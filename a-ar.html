let audioContext=null;

let fonTimer=null;
let fonAktif=false;

let aktifTarget=-1;


/* =====================================================
   SESLER
===================================================== */

const tamSes=
document.getElementById("tamSes");

const sounds=[];

for(let i=1;i<=8;i++){
  sounds.push(
    document.getElementById("sound"+i)
  );
}

const sound1=sounds[0];
const sound2=sounds[1];
const sound3=sounds[2];
const sound4=sounds[3];

const sound5=sounds[4];
const sound6=sounds[5];
const sound7=sounds[6];
const sound8=sounds[7];


function sesSisteminiAc(){

  if(!audioContext){

    const AC=
    window.AudioContext ||
    window.webkitAudioContext;

    audioContext=
    new AC();
  }

  if(
    audioContext.state==="suspended"
  ){
    audioContext.resume();
  }
}


function stopMP3(){

  try{
    tamSes.pause();
    tamSes.currentTime=0;
  }catch(e){}

  sounds.forEach(audio=>{

    try{
      audio.pause();
      audio.currentTime=0;
    }catch(e){}

  });
}


async function playSound(audio){

  if(!audio) return;

  stopMP3();

  try{

    audio.muted=false;
    audio.volume=1;
    audio.currentTime=0;

    await audio.play();

  }catch(e){

    console.log(
      "Ses hatası:",
      e
    );
  }
}


/* =====================================================
   WEB AUDIO
===================================================== */

function popSesiCal(){

  if(!audioContext) return;

  const now=
  audioContext.currentTime;

  const oscillator=
  audioContext.createOscillator();

  const gain=
  audioContext.createGain();

  oscillator.type="sine";

  oscillator.frequency.setValueAtTime(
    720,
    now
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    980,
    now+.07
  );

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .13,
    now+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+.16
  );

  oscillator.connect(gain);
  gain.connect(
    audioContext.destination
  );

  oscillator.start(now);
  oscillator.stop(now+.18);
}


function fonNotasiCal(
frequency,
duration=.55
){

  if(!audioContext) return;

  const now=
  audioContext.currentTime;

  const oscillator=
  audioContext.createOscillator();

  const gain=
  audioContext.createGain();

  oscillator.type="sine";

  oscillator.frequency.setValueAtTime(
    frequency,
    now
  );

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .018,
    now+.08
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start(now);

  oscillator.stop(
    now+duration+.05
  );
}


function fonBaslat(){

  fonDurdur();

  if(!audioContext) return;

  fonAktif=true;

  const notalar=[
    261.63,
    329.63,
    392,
    329.63,
    293.66,
    349.23,
    392,
    329.63
  ];

  let index=0;

  function cal(){

    if(!fonAktif) return;

    fonNotasiCal(
      notalar[index],
      .55
    );

    index=
    (index+1)%
    notalar.length;

    fonTimer=
    setTimeout(
      cal,
      750
    );
  }

  cal();
}


function fonDurdur(){

  fonAktif=false;

  if(fonTimer){

    clearTimeout(
      fonTimer
    );

    fonTimer=null;
  }
}

   BAŞLANGIÇ

   Burada Safari için tüm MP3'leri
   kullanıcı dokunuşu sırasında
   hazırlıyoruz.
===================================================== */

document

.addEventListener(

async function(){

  sesSisteminiAc();

  userStarted=true;

  document.getElementById(
    "startScreen"

  /*
    TANIMA SESİNİ SAFARI'YE

    tamSes.muted=true;

    await tamSes.play();

    tamSes.pause();

  /*
    YAZMA SESLERİNİ YÜKLE
  */

  sounds.forEach(
    audio=>audio.load()
  );


  window.dispatchEvent(
    new Event(
      "neti-user-start"

});

AFRAME.registerComponent(
"smooth-bee-flight",
{

init:function(){

  this.active=false;

  this.startTime=0;

  this.duration=3700;

  this.points=[

    {x:-.48,y:-.30},
    {x:-.40,y:-.18},
    {x:-.32,y:-.03},
    {x:-.25,y:.08},
    {x:-.17,y:.03},
    {x:-.08,y:-.13},
    {x:.02,y:-.23},
    {x:.14,y:-.22},
    {x:.25,y:-.12},
    {x:.35,y:.02},
    {x:.43,y:.18},
    {x:.45,y:.35},
    {x:.40,y:.50},
    {x:.30,y:.62},
    {x:.17,y:.70},
    {x:.02,y:.75},
    {x:-.15,y:.78},
    {x:-.27,y:.79}

  ];
},


startFlight:function(){

  this.startTime=
  performance.now();

  this.active=true;

  this.el.setAttribute(
    "visible",
    true
  );

  this.el.object3D.scale.set(
    1,1,1
  );
},


stopFlight:function(){

  this.active=false;

  this.el.setAttribute(
    "visible",
    false
  );
},


catmull:function(
p0,p1,p2,p3,t
){

  const t2=t*t;
  const t3=t2*t;

  return{

    x:.5*(

      2*p1.x+

      (-p0.x+p2.x)*t+

      (
        2*p0.x-
        5*p1.x+
        4*p2.x-
        p3.x
      )*t2+

      (
        -p0.x+
        3*p1.x-
        3*p2.x+
        p3.x
      )*t3
    ),

    y:.5*(

      2*p1.y+

      (-p0.y+p2.y)*t+

      (
        2*p0.y-
        5*p1.y+
        4*p2.y-
        p3.y
      )*t2+

      (
        -p0.y+
        3*p1.y-
        3*p2.y+
        p3.y
      )*t3
    )
  };
},


tick:function(){

  if(!this.active) return;

  const elapsed=
  performance.now()-
  this.startTime;

  let progress=
  elapsed/
  this.duration;

  if(progress>=1)
    progress=1;

  const segmentCount=
  this.points.length-1;

  let position=
  progress*
  segmentCount;

  let index=
  Math.floor(position);

  let localT=
  position-index;

  if(index>=segmentCount){

    index=
    segmentCount-1;

    localT=1;
  }

  const p0=
  this.points[
    Math.max(
      0,
      index-1
    )
  ];

  const p1=
  this.points[index];

  const p2=
  this.points[
    Math.min(
      this.points.length-1,
      index+1
    )
  ];

  const p3=
  this.points[
    Math.min(
      this.points.length-1,
      index+2
    )
  ];

  const pos=
  this.catmull(
    p0,p1,p2,p3,
    localT
  );

  this.el.object3D.position.set(
    pos.x,
    pos.y,
    .09
  );

  if(progress>=1){

    this.active=false;

    this.el.object3D.position.set(
      -.27,
      .79,
      .09
    );
  }
}

});

AFRAME.registerComponent(
"eye-pop-exercise",
{

init:function(){

  this.running=false;

  this.timers=[];

  this.steps=[

    {x:-.40,y:.72,letter:"A",show:950,gap:250},
    {x:.40,y:.22,letter:"a",show:950,gap:250},
    {x:.40,y:.72,letter:"A",show:950,gap:250},
    {x:-.40,y:.22,letter:"a",show:950,gap:250},

    {x:0,y:.48,letter:"A",show:900,gap:230},
    {x:-.46,y:.48,letter:"a",show:900,gap:230},
    {x:.46,y:.48,letter:"A",show:900,gap:230},

    {x:0,y:.80,letter:"a",show:850,gap:220},
    {x:0,y:.16,letter:"A",show:850,gap:220},

    {x:-.42,y:.48,letter:"a",show:800,gap:200},

    {x:.39,y:.70,letter:"A",show:750,gap:180},
    {x:-.39,y:.20,letter:"a",show:750,gap:180},

    {x:.39,y:.20,letter:"A",show:700,gap:170},

    {x:0,y:.48,letter:"a",show:900,gap:0}

  ];
},


clearTimers:function(){

  this.timers.forEach(
    clearTimeout
  );

  this.timers=[];
},


stopExercise:function(){

  this.running=false;

  this.clearTimers();

  fonDurdur();

  this.el.setAttribute(
    "visible",
    false
  );
},


drawLetter:function(letter){

  const canvas=
  document.getElementById(
    "tekHarfCanvas"
  );

  const ctx=
  canvas.getContext("2d");

  ctx.clearRect(
    0,0,
    500,500
  );

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.font=
  "bold 360px Arial";

  ctx.lineWidth=20;

  ctx.strokeStyle=
  "#FFFFFF";

  ctx.fillStyle=
  "#FF6B35";

  const value=
  letter==="a"
  ?
  "ɑ"
  :
  "A";

  ctx.strokeText(
    value,
    250,
    255
  );

  ctx.fillText(
    value,
    250,
    255
  );

  const mesh=
  this.el.getObject3D(
    "mesh"
  );

  if(
    mesh &&
    mesh.material &&
    mesh.material.map
  ){

    mesh.material.map.needsUpdate=true;
  }
},


startExercise:function(){

  this.stopExercise();

  this.running=true;

  fonBaslat();

  let currentTime=0;

  this.steps.forEach(
  step=>{

    const showTimer=
    setTimeout(()=>{

      if(!this.running)
        return;

      this.drawLetter(
        step.letter
      );

      this.el.object3D.position.set(
        step.x,
        step.y,
        .12
      );

      this.el.setAttribute(
        "visible",
        true
      );

      popSesiCal();

    },currentTime);

    this.timers.push(
      showTimer
    );


    const hideTimer=
    setTimeout(()=>{

      if(!this.running)
        return;

      this.el.setAttribute(
        "visible",
        false
      );

    },
    currentTime+
    step.show);

    this.timers.push(
      hideTimer
    );


    currentTime+=
    step.show+
    step.gap;

  });


  const finishTimer=
  setTimeout(()=>{

    this.running=false;

    this.el.setAttribute(
      "visible",
      false
    );

    fonDurdur();

    window.dispatchEvent(
      new Event(
        "neti-gorev-animasyon"
      )
    );

  },
  currentTime+100);

  this.timers.push(
    finishTimer
  );
}

});

AFRAME.registerComponent(
"neti-recognition",
{

init:function(){

const target=this.el;

const neti=
document.getElementById(
  "netiKarakter"
);

const harfler=
document.getElementById(
  "harfler"
);

const tekHarf=
document.getElementById(
  "tekHarf"
);

const ari=
document.getElementById(
  "ariKarakter"
);

let basladi=false;

let timers=[];

let kayipTimer=null;


function timer(fn,ms){

  const t=
  setTimeout(fn,ms);

  timers.push(t);

  return t;
}


function temizle(){

  timers.forEach(
    clearTimeout
  );

  timers=[];

  fonDurdur();

  try{

    tamSes.pause();
    tamSes.currentTime=0;

  }catch(e){}

  if(
    ari.components[
      "smooth-bee-flight"
    ]
  ){
    ari.components[
      "smooth-bee-flight"
    ].stopFlight();
  }

  if(
    tekHarf.components[
      "eye-pop-exercise"
    ]
  ){
    tekHarf.components[
      "eye-pop-exercise"
    ].stopExercise();
  }

  ari.setAttribute(
    "visible",
    false
  );

  harfler.setAttribute(
    "visible",
    false
  );

  tekHarf.setAttribute(
    "visible",
    false
  );
}


window.addEventListener(
"neti-gorev-animasyon",
()=>{

  if(aktifTarget!==0)
    return;

  neti.removeAttribute(
    "animation__gorev"
  );

  neti.setAttribute(
    "animation__gorev",
    "property:scale;"+
    "from:1 1 1;"+
    "to:1.12 1.12 1.12;"+
    "dir:alternate;"+
    "loop:2;"+
    "dur:350;"
  );

});


function baslat(){

  if(basladi)
    return;

  if(!userStarted)
    return;

  if(aktifTarget!==0)
    return;

  basladi=true;

  temizle();


  neti.removeAttribute(
    "animation__buyume"
  );

  neti.removeAttribute(
    "animation__yuksel"
  );

  neti.setAttribute(
    "scale",
    ".05 .05 .05"
  );

  neti.setAttribute(
    "position",
    "0 -.25 .03"
  );


  timer(()=>{

    neti.setAttribute(
      "animation__buyume",
      "property:scale;"+
      "from:.05 .05 .05;"+
      "to:1 1 1;"+
      "dur:1100;"+
      "easing:easeOutBack"
    );

    neti.setAttribute(
      "animation__yuksel",
      "property:position;"+
      "from:0 -.25 .03;"+
      "to:0 .08 .03;"+
      "dur:1100;"+
      "easing:easeOutQuad"
    );


    try{

      tamSes.muted=false;
      tamSes.volume=1;
      tamSes.currentTime=0;

      tamSes.play();

    }catch(e){}

  },100);


  harfler.setAttribute(
    "visible",
    false
  );

  harfler.setAttribute(
    "position",
    "0 .55 .04"
  );

  harfler.setAttribute(
    "scale",
    ".01 .01 .01"
  );


  timer(()=>{

    harfler.setAttribute(
      "visible",
      true
    );

    harfler.setAttribute(
      "animation__harf",
      "property:scale;"+
      "from:.01 .01 .01;"+
      "to:1 1 1;"+
      "dur:550;"+
      "easing:easeOutBack"
    );

  },1500);


  ari.object3D.position.set(
    -.48,
    -.30,
    .09
  );


  timer(()=>{

    const flight=
    ari.components[
      "smooth-bee-flight"
    ];

    if(flight)
      flight.startFlight();

  },1700);


  timer(()=>{

    ari.setAttribute(
      "visible",
      false
    );

    harfler.setAttribute(
      "visible",
      false
    );

  },6400);


  timer(()=>{

    const exercise=
    tekHarf.components[
      "eye-pop-exercise"
    ];

    if(exercise)
      exercise.startExercise();

  },6700);

}


target.addEventListener(
"targetFound",
()=>{

  aktifTarget=0;

  hideMessage();

  if(kayipTimer){

    clearTimeout(
      kayipTimer
    );

    kayipTimer=null;
  }

  baslat();
});


target.addEventListener(
"targetLost",
()=>{

  kayipTimer=
  setTimeout(()=>{

    if(aktifTarget===0)
      aktifTarget=-1;

    basladi=false;

    temizle();

  },1200);

});


window.addEventListener(
"neti-user-start",
()=>{

  if(aktifTarget===0)
    baslat();

});

}

});


/* =====================================================
   YAZMA ORTAK ÇİZİM FONKSİYONLARI
===================================================== */

function linePoints(
x1,y1,x2,y2,count=200
){

  const points=[];

  for(let i=0;i<=count;i++){

    const t=i/count;

    points.push({

      x:
      x1+
      (x2-x1)*t,

      y:
      y1+
      (y2-y1)*t

    });
  }

  return points;
}

===================================================== */

function updateTexture(){

  const mesh=
  plane.getObject3D("mesh");

  if(
    mesh &&
    mesh.material &&
    mesh.material.map
  ){
    mesh.material.map.needsUpdate=true;
  }
}


function clearCanvas(){

  ctx.clearRect(
    0,0,
    canvas.width,
    canvas.height
  );
}


/* =====================================================
   PATH
===================================================== */

function drawPath(
points,
color,
width,
dash=[]
){

  if(!points || points.length<2)
    return;

  ctx.save();

  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  ctx.setLineDash(
    dash
  );

  ctx.beginPath();

  ctx.moveTo(
    points[0].x,
    points[0].y
  );

  for(let i=1;i<points.length;i++){

    ctx.lineTo(
      points[i].x,
      points[i].y
    );
  }

  ctx.stroke();

  ctx.restore();
}


/* =====================================================
   NUMARA
===================================================== */

function numberCircle(
x,y,number,color
){

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    x,y,
    43,
    0,
    Math.PI*2
  );

  ctx.fillStyle=color;
  ctx.fill();

  ctx.strokeStyle="white";
  ctx.lineWidth=7;
  ctx.stroke();

  ctx.fillStyle="white";
  ctx.font=
  "bold 49px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    number,
    x,
    y+2
  );

  ctx.restore();
}


/* =====================================================
   OK
===================================================== */

function arrow(
x,y,rotation
){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(rotation);

  ctx.beginPath();

  ctx.moveTo(-34,-16);
  ctx.lineTo(5,-16);
  ctx.lineTo(5,-29);
  ctx.lineTo(42,0);
  ctx.lineTo(5,29);
  ctx.lineTo(5,16);
  ctx.lineTo(-34,16);

  ctx.closePath();

  ctx.fillStyle="#ffd600";
  ctx.strokeStyle="white";
  ctx.lineWidth=7;

  ctx.stroke();
  ctx.fill();

  ctx.restore();
}


/* =====================================================
   NOKTA
===================================================== */

function drawPoint(points){

  if(!points || !points.length)
    return;

  const p=
  points[
    points.length-1
  ];

  ctx.save();

  ctx.shadowColor="#ffe600";
  ctx.shadowBlur=25;

  ctx.beginPath();

  ctx.arc(
    p.x,p.y,
    18,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#fff000";
  ctx.fill();

  ctx.strokeStyle="white";
  ctx.lineWidth=5;
  ctx.stroke();

  ctx.restore();
}


/* =====================================================
   KÜÇÜK a
===================================================== */

const CX=520;
const CY=600;
const R=250;

const START_DEG=-40;
const END_DEG=40;


function makeC(){

  const points=[];

  const travel=
  360-
  (
    END_DEG-
    START_DEG
  );

  const count=400;

  for(let i=0;i<=count;i++){

    const t=i/count;

    const degree=
    START_DEG-
    travel*t;

    const angle=
    degree*
    Math.PI/180;

    points.push({

      x:
      CX+
      R*Math.cos(angle),

      y:
      CY+
      R*Math.sin(angle)

    });
  }

  return points;
}

/* =====================================================
   ANİMASYON
===================================================== */

function animate(
points,
duration,
drawFunction,
callback
){

  const myToken=
  animationToken;

  let start=null;

  function frame(time){

    /*
      SAYFA DEĞİŞTİYSE
      ANİMASYONU DURDUR
    */

    if(
      myToken!==
      animationToken
    ){
      return;
    }

    if(
      aktifTarget!==1
    ){
      return;
    }

    if(start===null)
      start=time;

    const progress=
    Math.min(
      (time-start)/
      duration,
      1
    );

    const index=
    Math.max(
      1,
      Math.floor(
        progress*
        (points.length-1)
      )
    );

    const partial=
    points.slice(
      0,
      index+1
    );

    drawFunction(
      partial
    );

    if(progress<1){

      requestAnimationFrame(
        frame
      );

    }else{

      if(callback)
        callback();
    }
  }

  requestAnimationFrame(
    frame
  );
}

const A_LEFT_X=345;
const A_LEFT_Y=875;

const A_RIGHT_X=855;
const A_RIGHT_Y=875;

const BAR_Y=635;

const leftRatio=
(BAR_Y-A_TOP_Y)/
(A_LEFT_Y-A_TOP_Y);

const BAR_LEFT_X=
A_TOP_X+
(A_LEFT_X-A_TOP_X)*
leftRatio;

const rightRatio=
(BAR_Y-A_TOP_Y)/
(A_RIGHT_Y-A_TOP_Y);

const BAR_RIGHT_X=
A_TOP_X+
(A_RIGHT_X-A_TOP_X)*
rightRatio;
