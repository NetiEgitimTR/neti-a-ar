<!DOCTYPE html>

<head>

<title>Neti | A Sesi</title>

<style>

*{

  -webkit-tap-highlight-color:transparent;
}

html,body{

body{

/* ================= HEADER ================= */

/* ================= SAYFALAR ================= */

.page.active{

}

.repeatBtn{

}

.homeBtn{

}

.info{

  margin:18px auto 8px;
  font-size:24px;
  line-height:1.25;
  font-weight:900;
}

/* ================= ANA SAYFA ================= */

#home{
  text-align:center;
  padding:35px 20px;
}

#home h1{
  color:#3888c7;
  font-size:44px;
  margin:10px 0 12px;
}

.homeLetters{

}

.menu{

.menuCard{

/* =====================================================
ARI EKRANI
===================================================== */

.soundStage{

  height:540px;

  overflow:hidden;

}

  bottom:12px;

}

.netiWrap img{

.eyeText{

  right:25px;

/* ================= ARI ================= */

#bee{
  position:absolute;

  left:150px;
  bottom:155px;

  visibility:hidden;

}

  height:100%;

KÜÇÜK a ALANI
===================================================== */

  overflow:hidden;

/*
ÇOK ÖNEMLİ:

ARTIK PEMBE ÇİZGİLER CSS DEĞİL.

PEMBE ÇİZGİLER + a
AYNI SVG'NİN İÇİNDE.

BÖYLECE TELEFONDA DA
AKILLI TAHTADA DA
AYNI ORANDA ÖLÇEKLENİYOR.
*/

.letterSvg{
  display:block;
  width:100%;
  height:100%;
}

/* PEMBE SATIRLAR */

.rowSolid{
  stroke:#eca1c7;
  stroke-width:4;
}

.rowDash{
  stroke:#eca1c7;
  stroke-width:5;
  stroke-dasharray:22 18;
}

/* HARF */

.guideOuter{
  fill:none;
  stroke:rgba(120,125,130,.55);
  stroke-width:34;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.guideInner{
  fill:none;
  stroke:rgba(225,227,230,.98);
  stroke-width:24;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.guideDash{
  fill:none;
  stroke:#fff;
  stroke-width:4;
  stroke-dasharray:10 8;
  stroke-linecap:round;
}

.drawStroke{
  fill:none;
  stroke:#ff3030;
  stroke-width:22;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.yellowDot{
  fill:#fff000;
  stroke:#efa900;
  stroke-width:4;
}

.stepCircle{
  fill:#2599d0;
}

.stepNumber{
  fill:#fff;
  font-size:22px;
  font-weight:900;
  text-anchor:middle;
  dominant-baseline:middle;
}

.arrowLine{
  fill:none;
  stroke:#ef5050;
  stroke-width:7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

<script>

let soundEnabled=true;
let running=false;

let beeAnimation=null;
let beeStartTimer=null;
let beeStopTimer=null;


/* =====================================================
SAYFA
===================================================== */

function showPage(id){

  stopEverything();

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}


function goHome(){

  stopEverything();

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById("home")
    .classList.add("active");

  window.scrollTo(0,0);
}


/* =====================================================
SES
===================================================== */

function toggleSound(){

  soundEnabled=!soundEnabled;

  document
    .getElementById("soundToggle")
    .textContent=
      soundEnabled
      ? "🔊 Ses Açık"
      : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }
}


function stopAllAudio(){

  document
    .querySelectorAll("audio")
    .forEach(audio=>{

      try{
        audio.pause();
        audio.currentTime=0;
      }catch(e){}

    });
}


function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const audio=
      document.getElementById(id);

    audio.pause();
    audio.currentTime=0;

    let finished=false;

    function done(){

      if(finished) return;

      finished=true;

      audio.onended=null;
      audio.onerror=null;

      resolve();
    }

    audio.onended=done;
    audio.onerror=done;

    const p=audio.play();

    if(p){
      p.catch(done);
    }

  });
}


/* =====================================================
ARI

ZAMANLAMA:

0.0 sn
Neti konuşmaya başlıyor.

1.7 sn
İlk cümle bitiyor.
ARI NETİ'NİN YANINDA BELİRİYOR.

1.7 - 6.4 sn
ARI YAVAŞ VE AKICI HAREKET EDİYOR.

6.4 sn
"Şimdi sıra sende" kısmına geçerken
ARI DURUYOR VE KAYBOLUYOR.
===================================================== */


function hideBee(){

  const bee=
    document.getElementById("bee");

  if(beeAnimation){

    beeAnimation.cancel();
    beeAnimation=null;

  }

  bee.style.opacity="0";
  bee.style.visibility="hidden";
  bee.style.transform="translate3d(0,0,0)";
}


function startBee(){

  const bee=
    document.getElementById("bee");

  const stage=
    document.getElementById("soundStage");


  /*
  NETİ'NİN YANINDA BAŞLANGIÇ
  */

  const startX=
    window.innerWidth<=760
    ? 105
    : 150;

  const startBottom=
    window.innerWidth<=760
    ? 135
    : 155;

  bee.style.left=startX+"px";
  bee.style.bottom=startBottom+"px";


  bee.style.visibility="visible";
  bee.style.opacity="1";


  /*
  HAREKET ALANI

  Arı kutudan çıkmayacak.
  */

  const beeW=
    bee.offsetWidth;

  const beeH=
    bee.offsetHeight;

  const stageW=
    stage.clientWidth;

  const stageH=
    stage.clientHeight;


  /*
  BAŞLANGIÇ KONUMUNA GÖRE
  TRANSFORM SINIRLARI
  */

  const maxRight=
    stageW
    -startX
    -beeW
    -25;

  const currentTop=
    stageH
    -startBottom
    -beeH;

  const maxUp=
    -currentTop
    +125;

  const maxDown=
    stageH
    -currentTop
    -beeH
    -100;


  /*
  4.7 SANİYEDE TEK TUR.

  Arı:
  - sağa
  - yukarı
  - yuvarlak
  - merkeze
  - aşağı
  - sola
  - çapraz

  gidiyor.

  EASING = LINEAR

  Yani hiçbir noktada
  yavaşlayıp hızlanmıyor.
  */

  beeAnimation=
    bee.animate(

      [

        {
          transform:
            "translate3d(0px,0px,0px)",
          offset:0
        },


        /*
        SOL → ORTA ÜST
        */

        {
          transform:
            `translate3d(
              ${maxRight*0.34}px,
              ${maxUp*0.70}px,
              0
            )`,
          offset:.16
        },


        /*
        ORTA ÜST → SAĞ ÜST
        */

        {
          transform:
            `translate3d(
              ${maxRight*0.72}px,
              ${maxUp*0.82}px,
              0
            )`,
          offset:.29
        },


        /*
        SAĞA DOĞRU YUVARLAK DÖNÜŞ
        */

        {
          transform:
            `translate3d(
              ${maxRight*0.94}px,
              ${maxUp*0.30}px,
              0
            )`,
          offset:.40
        },


        /*
        SAĞ ORTA
        */

        {
          transform:
            `translate3d(
              ${maxRight*0.86}px,
              ${maxDown*0.45}px,
              0
            )`,
          offset:.51
        },


        /*
        ORTA ALT
        */

        {
          transform:
            `translate3d(
              ${maxRight*0.55}px,
              ${maxDown*0.90}px,
              0
            )`,
          offset:.64
        },


        /*
        SOL ALT
        */

        {
          transform:
            `translate3d(
              ${maxRight*0.17}px,
              ${maxDown*0.67}px,
              0
            )`,
          offset:.77
        },


        /*
        MERKEZDEN ÇAPRAZ
        */

        {
          transform:
            `translate3d(
              ${maxRight*0.53}px,
              ${maxUp*0.10}px,
              0
            )`,
          offset:.88
        },


        /*
        SAĞ ORTA
        */

        {
          transform:
            `translate3d(
              ${maxRight*0.78}px,
              ${maxDown*0.15}px,
              0
            )`,
          offset:1
        }

      ],

      {
        duration:4700,

        /*
        SABİT HIZ
        */

        easing:"linear",

        fill:"forwards"
      }

    );
}


function stopBee(){

  if(beeAnimation){

    beeAnimation.cancel();
    beeAnimation=null;

  }

  const bee=
    document.getElementById("bee");

  bee.style.opacity="0";
  bee.style.visibility="hidden";
}


/* =====================================================
DURDUR
===================================================== */

function stopEverything(){

  running=false;

  stopAllAudio();

  clearTimeout(beeStartTimer);
  clearTimeout(beeStopTimer);

  hideBee();
}


/* =====================================================
ARI + NETİ SESİ
===================================================== */

function startSoundActivity(){

  if(running) return;

  running=true;

  stopAllAudio();

  clearTimeout(beeStartTimer);
  clearTimeout(beeStopTimer);

  hideBee();


  const audio=
    document.getElementById("introAudio");


  /*
  SESİ TIKLAMANIN İÇİNDEN
  DOĞRUDAN BAŞLATIYORUZ.
  */

  if(soundEnabled){

    audio.pause();
    audio.currentTime=0;
    audio.volume=1;

    audio.play().catch(()=>{});

  }


  /*
  1.7 SANİYE:
  "Neti ile A harfini öğrenmeye
  hazır mısın?" bittikten sonra
  arı geliyor.
  */

  beeStartTimer=
    setTimeout(()=>{

      startBee();

    },1700);


  /*
  6.4 SANİYE:

  "Şimdi sıra sende" başlarken
  arı duruyor.
  */

  beeStopTimer=
    setTimeout(()=>{

      stopBee();

    },6400);


  /*
  SES DOSYASI BİTİNCE
  BUTON TEKRAR KULLANILABİLİR.
  */

  audio.onended=()=>{

    stopBee();

    running=false;

  };


  /*
  Ses kapalıysa da etkinlik
  kilitlenmesin.
  */

  if(!soundEnabled){

    beeStartTimer=
      setTimeout(
        startBee,
        300
      );

    beeStopTimer=
      setTimeout(()=>{

        stopBee();
        running=false;

      },5000);

  }
}


/* =====================================================
KÜÇÜK a
===================================================== */

function hidePath(path){

  const length=
    path.getTotalLength();

  path.style.strokeDasharray=
    length;

  path.style.strokeDashoffset=
    length;
}


function resetSmall(){

  hidePath(
    document.getElementById("smallC")
  );

  hidePath(
    document.getElementById("smallStraight")
  );

  const dot=
    document.getElementById("smallDot");

  dot.setAttribute(
    "cx",
    "548"
  );

  dot.setAttribute(
    "cy",
    "248"
  );
}


function animatePath(
  path,
  dot,
  duration
){

  return new Promise(resolve=>{

    const length=
      path.getTotalLength();

    path.style.strokeDasharray=
      length;

    path.style.strokeDashoffset=
      length;

    const start=
      performance.now();

    function frame(now){

      const progress=
        Math.min(
          (now-start)/duration,
          1
        );

      const current=
        length*progress;

      path.style.strokeDashoffset=
        length-current;

      const point=
        path.getPointAtLength(current);

      dot.setAttribute(
        "cx",
        point.x
      );

      dot.setAttribute(
        "cy",
        point.y
      );

      if(progress<1){

        requestAnimationFrame(frame);

      }else{

        resolve();

      }

    }

    requestAnimationFrame(frame);

  });
}


async function startSmall(){

  if(running) return;

  running=true;

  stopAllAudio();
  resetSmall();


  const c=
    document.getElementById("smallC");

  const straight=
    document.getElementById(
      "smallStraight"
    );

  const dot=
    document.getElementById(
      "smallDot"
    );

  const info=
    document.getElementById(
      "smallInfo"
    );


  /* ================= 1 ================= */

  info.textContent=
    "1️⃣ Önce c çizgisini çiz. Sarı okları takip et.";


  await Promise.all([

    playAudio("small1"),

    animatePath(
      c,
      dot,
      6500
    )

  ]);


  /* ================= 2 ================= */

  info.textContent=
    "2️⃣ Şimdi düz çizgiyi yukarıdan aşağı doğru çiz.";


  dot.setAttribute(
    "cx",
    "552"
  );

  dot.setAttribute(
    "cy",
    "220"
  );


  await Promise.all([

    playAudio("small2"),

    animatePath(
      straight,
      dot,
      4000
    )

  ]);


  /* ================= TEKRAR ================= */

  info.textContent=
    "🌟 Harika! Bir kez daha yazalım.";


  await playAudio(
    "small3"
  );


  resetSmall();


  await animatePath(
    c,
    dot,
    6500
  );


  dot.setAttribute(
    "cx",
    "552"
  );

  dot.setAttribute(
    "cy",
    "220"
  );


  await animatePath(
    straight,
    dot,
    4000
  );


  /* ================= BİTİŞ ================= */

  info.textContent=
    "✏️ Şimdi sıra sende!";


  await playAudio(
    "small4"
  );


  running=false;
}

AÇILIŞ
===================================================== */

window.addEventListener(
  "load",
  ()=>{

    resetSmall();
    hideBee();

    document
      .querySelectorAll("audio")
      .forEach(audio=>{
        audio.load();
      });

  }
);
