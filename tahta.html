<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<title>Neti | A Sesi</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#effcff,#fff9ea);
  color:#292929;
}

button{
  font-family:inherit;

}

/* =====================================================
HEADER
===================================================== */

header{
  height:82px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 24px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:28px;
  font-weight:900;
  color:#ef7d43;
}

.brand img{
  width:62px;
  height:62px;
  object-fit:contain;
}

#soundToggle{
  border:0;
  border-radius:18px;
  background:#e7f6ff;
  color:#328bc8;
  font-size:20px;
  font-weight:900;
  padding:13px 18px;
}

/* =====================================================
SAYFALAR
===================================================== */

.page{
  display:none;
}

.page.active{
  display:block;
}

.activity{
  text-align:center;
  padding:20px 14px 45px;
}

.activityTitle{
  color:#3888c7;
  font-size:40px;
  margin:5px 0 18px;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;
  margin-top:18px;
}

.mainBtn{
  border:0;
  border-radius:20px;
  padding:17px 28px;
  min-width:250px;
  background:#61c77a;
  color:#fff;
  font-size:22px;
  font-weight:900;
  box-shadow:0 5px 12px rgba(0,0,0,.10);
}

.repeatBtn{
  background:#ff9e43;
}

.homeBtn{
  background:#4f9fd3;
}

.info{
  min-height:50px;
  margin:18px auto 8px;
  font-size:24px;
  line-height:1.25;
  font-weight:900;
}

/* =====================================================
ANA SAYFA
===================================================== */

#home{
  text-align:center;
  padding:35px 20px;
}

#home h1{
  color:#3888c7;
  font-size:44px;
  margin:10px 0 12px;
}

.homeLetters{
  font-size:100px;
  font-weight:900;
  color:#ef7038;
  margin:20px;
}

.menu{
  max-width:800px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.menuCard{
  border:0;
  border-radius:28px;
  padding:28px 20px;
  font-size:25px;
  font-weight:900;
  box-shadow:0 7px 18px rgba(0,0,0,.10);
}

.menuCard:first-child{
  background:#fff0a5;
}

.menuCard:last-child{
  background:#dff6ff;
}

/* =====================================================
ARI EKRANI
===================================================== */

.soundStage{
  width:min(1050px,94vw);
  height:540px;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:#fff;
  border:5px solid #f1d66c;
  border-radius:32px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.soundLetters{
  position:absolute;
  top:20px;
  left:0;
  right:0;
  font-size:120px;
  line-height:1;
  font-weight:900;
  color:#ef7038;
  z-index:3;
}

.netiWrap{
  position:absolute;
  left:18px;
  bottom:12px;
  width:190px;
  z-index:4;
}

.netiWrap img{
  width:100%;
  display:block;
}

.eyeText{
  position:absolute;
  right:25px;
  bottom:25px;
  font-size:27px;
  font-weight:900;
  z-index:4;
}

/* =====================================================
ARI

Daha büyük.
Başlangıçta görünmez.
===================================================== */

#bee{

  left:150px;
  bottom:145px;

  width:145px;
  height:145px;

  z-index:7;

  opacity:0;
  visibility:hidden;

}

#bee img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* =====================================================
KÜÇÜK a ALANI
===================================================== */

.writingStage{
  width:min(1000px,94vw);
  height:400px;
  margin:8px auto;

  position:relative;
  overflow:hidden;

  background:#fff;

  border:6px solid #58b6da;
  border-radius:32px;

  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.letterSvg{
  display:block;
  width:100%;
  height:100%;
}

/* =====================================================
SATIR
===================================================== */

.rowSolid{
  stroke:#eca1c7;
  stroke-width:4;
}

.rowDash{
  stroke:#eca1c7;
  stroke-width:5;
  stroke-dasharray:22 18;
}

/* =====================================================
HARF
===================================================== */

.guideOuter{
  fill:none;
  stroke:#bfc1c5;
  stroke-width:30;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.guideInner{
  fill:none;
  stroke:#e5e6e8;
  stroke-width:21;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.guideDash{
  fill:none;
  stroke:#fff;
  stroke-width:4;
  stroke-dasharray:10 8;
  stroke-linecap:round;
}

.drawStroke{
  fill:none;
  stroke:#ff3030;
  stroke-width:19;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.yellowDot{
  fill:#fff000;
  stroke:#efa900;
  stroke-width:4;
}

.stepCircle{
  fill:#2599d0;
}

.stepNumber{
  fill:#fff;
  font-size:22px;
  font-weight:900;
  text-anchor:middle;
  dominant-baseline:middle;
}

.arrowLine{
  fill:none;
  stroke:#ef5050;
  stroke-width:7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

MOBİL

<script>

let soundEnabled=true;
let running=false;

let beeAnimation=null;
let beeStartTimer=null;
let beeStopTimer=null;


/* =====================================================
SAYFALAR
===================================================== */

function showPage(id){

  stopEverything();

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}


function goHome(){

  stopEverything();

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById("home")
    .classList.add("active");

  window.scrollTo(0,0);
}


/* =====================================================
SES
===================================================== */

function toggleSound(){

  soundEnabled=!soundEnabled;

  document
    .getElementById("soundToggle")
    .textContent=
      soundEnabled
      ? "🔊 Ses Açık"
      : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }
}


function stopAllAudio(){

  document
    .querySelectorAll("audio")
    .forEach(audio=>{

      try{
        audio.pause();
        audio.currentTime=0;
      }catch(e){}

    });
}


function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const audio=
      document.getElementById(id);

    audio.pause();
    audio.currentTime=0;

    let finished=false;

    function done(){

      if(finished) return;

      finished=true;

      audio.onended=null;
      audio.onerror=null;

      resolve();
    }

    audio.onended=done;
    audio.onerror=done;

    const p=audio.play();

    if(p){
      p.catch(done);
    }

  });
}


/* =====================================================
ARI
===================================================== */

function hideBee(){

  const bee=
    document.getElementById("bee");

  if(beeAnimation){

    beeAnimation.cancel();
    beeAnimation=null;

  }

  bee.style.opacity="0";
  bee.style.visibility="hidden";
  bee.style.transform="translate3d(0,0,0)";
}


/* =====================================================
ARI HAREKETİ

Bu sefer:
- büyük
- yavaş
- linear
- ani hızlanma yok
===================================================== */

function startBee(){

  const bee=
    document.getElementById("bee");

  const stage=
    document.getElementById("soundStage");


  const mobile=
    window.innerWidth<=760;


  const startX=
    mobile
    ? 95
    : 150;


  const startBottom=
    mobile
    ? 120
    : 145;


  bee.style.left=
    startX+"px";

  bee.style.bottom=
    startBottom+"px";


  bee.style.opacity="1";
  bee.style.visibility="visible";


  const beeW=
    bee.offsetWidth;

  const beeH=
    bee.offsetHeight;

  const stageW=
    stage.clientWidth;

  const stageH=
    stage.clientHeight;


  /*
  BAŞLANGIÇTA ARININ
  ÜST KOORDİNATI
  */

  const startTop=
    stageH
    -startBottom
    -beeH;


  /*
  SAĞA GİDEBİLECEĞİ MESAFE
  */

  const right=
    stageW
    -startX
    -beeW
    -25;


  /*
  YUKARI ÇIKABİLECEĞİ MESAFE
  */

  const up=
    125-startTop;


  /*
  AŞAĞI İNEBİLECEĞİ MESAFE
  */

  const down=
    stageH
    -startTop
    -beeH
    -95;


  /*
  HAREKET

  10.5 saniyelik rota.

  Ancak arı yaklaşık 4.7 saniye
  ekranda kaldığı için rotayı
  yavaş biçimde takip ediyor.

  easing LINEAR:
  noktalarda duraklama / hızlanma yok.
  */

  beeAnimation=
    bee.animate(

      [

        /*
        NETİ'NİN YANI
        */

        {
          transform:
            "translate3d(0px,0px,0px)",
          offset:0
        },


        /*
        SAĞ ÜSTE DOĞRU
        */

        {
          transform:
            `translate3d(
              ${right*0.22}px,
              ${up*0.50}px,
              0
            )`,
          offset:.12
        },


        /*
        YUKARI
        */

        {
          transform:
            `translate3d(
              ${right*0.38}px,
              ${up*0.90}px,
              0
            )`,
          offset:.24
        },


        /*
        YUVARLAK DÖNÜŞÜN SAĞ TARAFI
        */

        {
          transform:
            `translate3d(
              ${right*0.55}px,
              ${up*0.72}px,
              0
            )`,
          offset:.34
        },


        /*
        SAĞ ORTA
        */

        {
          transform:
            `translate3d(
              ${right*0.67}px,
              ${up*0.15}px,
              0
            )`,
          offset:.44
        },


        /*
        SAĞ ALT
        */

        {
          transform:
            `translate3d(
              ${right*0.62}px,
              ${down*0.65}px,
              0
            )`,
          offset:.55
        },


        /*
        ORTA ALT
        */

        {
          transform:
            `translate3d(
              ${right*0.42}px,
              ${down*0.90}px,
              0
            )`,
          offset:.66
        },


        /*
        SOL ALT
        */

        {
          transform:
            `translate3d(
              ${right*0.16}px,
              ${down*0.55}px,
              0
            )`,
          offset:.76
        },


        /*
        ÇAPRAZ MERKEZ
        */

        {
          transform:
            `translate3d(
              ${right*0.45}px,
              ${up*0.05}px,
              0
            )`,
          offset:.87
        },


        /*
        SAĞ ÜST
        */

        {
          transform:
            `translate3d(
              ${right*0.72}px,
              ${up*0.60}px,
              0
            )`,
          offset:1
        }

      ],

      {
        duration:10500,
        easing:"linear",
        fill:"forwards"
      }

    );
}


function stopBee(){

  if(beeAnimation){

    beeAnimation.cancel();
    beeAnimation=null;

  }

  const bee=
    document.getElementById("bee");

  bee.style.opacity="0";
  bee.style.visibility="hidden";
}


/* =====================================================
DURDUR
===================================================== */

function stopEverything(){

  running=false;

  stopAllAudio();

  clearTimeout(beeStartTimer);
  clearTimeout(beeStopTimer);

  hideBee();
}


/* =====================================================
NETİ + ARI
===================================================== */

function startSoundActivity(){

  if(running) return;

  running=true;

  stopAllAudio();

  clearTimeout(beeStartTimer);
  clearTimeout(beeStopTimer);

  hideBee();


  const audio=
    document.getElementById(
      "introAudio"
    );


  /*
  NETİ HEMEN KONUŞMAYA BAŞLAR
  */

  if(soundEnabled){

    audio.pause();
    audio.currentTime=0;
    audio.volume=1;

    audio.play().catch(()=>{});

  }


  /*
  İLK CÜMLE BİTTİKTEN SONRA
  ARI GELİR
  */

  beeStartTimer=
    setTimeout(()=>{

      startBee();

    },1700);


  /*
  "ŞİMDİ SIRA SENDE"
  BAŞLARKEN ARI DURUR
  */

  beeStopTimer=
    setTimeout(()=>{

      stopBee();

    },6400);


  audio.onended=()=>{

    stopBee();
    running=false;

  };


  /*
  SES KAPALIYSA
  TEST İÇİN ARI YİNE ÇALIŞIR
  */

  if(!soundEnabled){

    clearTimeout(beeStartTimer);
    clearTimeout(beeStopTimer);

    beeStartTimer=
      setTimeout(()=>{

        startBee();

      },300);


    beeStopTimer=
      setTimeout(()=>{

        stopBee();
        running=false;

      },5000);

  }
}


/* =====================================================
KÜÇÜK a
===================================================== */

function hidePath(path){

  const length=
    path.getTotalLength();

  path.style.strokeDasharray=
    length;

  path.style.strokeDashoffset=
    length;
}


function resetSmall(){

  hidePath(
    document.getElementById(
      "smallC"
    )
  );

  hidePath(
    document.getElementById(
      "smallStraight"
    )
  );


  const dot=
    document.getElementById(
      "smallDot"
    );


  dot.setAttribute(
    "cx",
    "575"
  );

  dot.setAttribute(
    "cy",
    "245"
  );
}


/* =====================================================
HARF ANİMASYONU
===================================================== */

function animatePath(
  path,
  dot,
  duration
){

  return new Promise(resolve=>{

    const length=
      path.getTotalLength();


    path.style.strokeDasharray=
      length;

    path.style.strokeDashoffset=
      length;


    const start=
      performance.now();


    function frame(now){

      const progress=
        Math.min(
          (now-start)/duration,
          1
        );


      const current=
        length*progress;


      path.style.strokeDashoffset=
        length-current;


      const point=
        path.getPointAtLength(
          current
        );


      dot.setAttribute(
        "cx",
        point.x
      );


      dot.setAttribute(
        "cy",
        point.y
      );


      if(progress<1){

        requestAnimationFrame(
          frame
        );

      }else{

        resolve();

      }

    }


    requestAnimationFrame(
      frame
    );

  });
}
