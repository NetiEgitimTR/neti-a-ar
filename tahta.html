<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neti Akıllı Tahta | A Sesi</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#effcff,#fff9ea);
  color:#292929;
}

button{
  font-family:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

/* ================= HEADER ================= */

header{
  height:82px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 24px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
  position:relative;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:28px;
  font-weight:900;
  color:#ef7d43;
}

.brand img{
  width:62px;
  height:62px;
  object-fit:contain;
}

#soundToggle{
  border:0;
  border-radius:16px;
  background:#e7f6ff;
  color:#328bc8;
  font-size:20px;
  font-weight:900;
  padding:13px 18px;
}

/* ================= SAYFALAR ================= */

.page{
  display:none;
  min-height:calc(100vh - 82px);
}

.page.active{
  display:block;
}

/* ================= ANA SAYFA ================= */

#home{
  text-align:center;
  padding:25px 20px 45px;
}

#home h1{
  color:#3888c7;
  font-size:44px;
  margin:4px 0;
}

.subtitle{
  font-size:23px;
  color:#666;
  margin:10px 0 20px;
}

.letters{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:15px 0 25px;
}

.letterBox{
  width:120px;
  height:120px;
  background:#fff;
  border:6px solid #ff9c43;
  border-radius:26px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:82px;
  font-weight:900;
  color:#ef7038;
}

.letterBox.small{
  border-color:#58b7dc;
  color:#3888c7;
}

.menu{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.menuCard{
  border:0;
  border-radius:28px;
  min-height:190px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.menuCard:nth-child(1){background:#fff0a5;}
.menuCard:nth-child(2){background:#dff6ff;}
.menuCard:nth-child(3){background:#ffe1ee;}

.menuIcon{
  display:block;
  font-size:54px;
}

.menuTitle{
  display:block;
  font-size:26px;
  font-weight:900;
  margin-top:10px;
}

.menuDesc{
  display:block;
  font-size:17px;
  color:#666;
  margin-top:8px;
}

/* ================= ETKİNLİK ================= */

.activity{
  text-align:center;
  padding:20px 20px 45px;
}

.activityTitle{
  color:#3888c7;
  font-size:40px;
  margin:4px 0 15px;
}

.info{
  font-size:25px;
  line-height:1.25;
  font-weight:900;
  min-height:48px;
  margin:15px auto 10px;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  margin:15px auto 0;
}

.mainBtn{
  border:0;
  border-radius:19px;
  padding:16px 26px;
  min-width:225px;
  background:#65c77c;
  color:#fff;
  font-size:22px;
  font-weight:900;
  box-shadow:0 5px 12px rgba(0,0,0,.10);
}

.repeatBtn{
  background:#ff9e43;
}

.homeBtn{
  background:#4f9fd3;
}

/* ================= SES TANIMA ================= */

.soundStage{
  width:min(1050px,94vw);
  height:540px;
  margin:auto;
  background:#fff;
  border:5px solid #f1d66c;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.soundLetters{
  position:absolute;
  left:0;
  right:0;
  top:20px;
  font-size:135px;
  font-weight:900;
  color:#ef7038;
}

.netiWrap{
  position:absolute;
  width:225px;
  left:28px;
  bottom:18px;
}

.netiWrap img{
  width:100%;
  display:block;
}

/* ARININ TAKİP ROTASI */

.routeSvg{
  position:absolute;
  left:235px;
  top:185px;
  width:760px;
  height:235px;
}

.routePath{
  fill:none;
  stroke:#aaa;
  stroke-width:4;
  stroke-dasharray:11 13;
  stroke-linecap:round;
}

/* ARI */

#bee{
  position:absolute;
  width:82px;
  height:82px;
  left:245px;
  top:230px;
  will-change:transform;
  transform:translate3d(0,0,0);
  z-index:4;
}

#bee img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.eyeText{
  position:absolute;
  left:280px;
  right:30px;
  bottom:28px;
  font-size:28px;
  font-weight:900;
}

/* ================= YAZI ALANI ================= */

.writingStage{
  width:min(1000px,94vw);
  height:540px;
  margin:8px auto;
  background:#fff;
  border:6px solid #58b6da;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

/*
  1. SINIF YAZI SATIRI
*/

.schoolLine{
  position:absolute;
  left:5%;
  width:90%;
  z-index:1;
}

.schoolTop{
  top:13%;
  border-top:3px solid #efa6c9;
}

.schoolMiddle{
  top:50%;
  border-top:4px dashed #efa6c9;
}

.schoolBottom{
  top:87%;
  border-top:3px solid #efa6c9;
}

.letterSvg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

.guide{
  fill:none;
  stroke:#dedede;
  stroke-width:25;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.drawStroke{
  fill:none;
  stroke:#ef5050;
  stroke-width:19;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.yellowDot{
  fill:#ffd328;
  stroke:#efa900;
  stroke-width:4;
}

/* ================= MOBİL ================= */

@media(max-width:760px){

  header{
    height:72px;
    padding:6px 12px;
  }

  .brand{
    font-size:22px;
  }

  .brand img{
    width:48px;
    height:48px;
  }

  #soundToggle{
    font-size:16px;
    padding:10px 12px;
  }

  .page{
    min-height:calc(100vh - 72px);
  }

  #home{
    padding:18px 12px 35px;
  }

  #home h1{
    font-size:34px;
    line-height:1.08;
  }

  .subtitle{
    font-size:19px;
  }

  .letterBox{
    width:100px;
    height:100px;
    font-size:70px;
  }

  .menu{
    grid-template-columns:1fr;
  }

  .menuCard{
    min-height:145px;
  }

  .activity{
    padding:15px 9px 40px;
  }

  .activityTitle{
    font-size:31px;
    line-height:1.08;
    margin:4px 0 12px;
  }

  .writingStage{
    width:96vw;
    height:470px;
  }

  .info{
    font-size:21px;
    min-height:54px;
    padding:0 8px;
  }

  .controls{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
  }

  .mainBtn{
    position:static !important;
    width:min(88vw,430px);
    min-width:0;
    margin:0;
    font-size:20px;
  }

  .soundStage{
    width:96vw;
    height:500px;
  }

  .soundLetters{
    font-size:105px;
  }

  .netiWrap{
    width:145px;
    left:8px;
    bottom:20px;
  }

  .routeSvg{
    left:135px;
    top:185px;
    width:530px;
    height:210px;
  }

  #bee{
    width:67px;
    height:67px;
    left:155px;
    top:235px;
  }

  .eyeText{
    left:155px;
    right:10px;
    bottom:35px;
    font-size:21px;
  }
}

</style>

<script>

let soundEnabled = true;
let running = false;
let beeAnimation = null;

/* ================= SAYFALAR ================= */

function showPage(id){

  stopEverything();

  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}

function goHome(){

  stopEverything();

  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });

  document.getElementById("home").classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}

/* ================= SES ================= */

function toggleSound(){

  soundEnabled = !soundEnabled;

  document.getElementById("soundToggle").textContent =
    soundEnabled
    ? "🔊 Ses Açık"
    : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }
}

function stopAllAudio(){

  document.querySelectorAll("audio").forEach(audio=>{
    audio.pause();
    audio.currentTime = 0;
  });
}

function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const audio = document.getElementById(id);

    audio.pause();
    audio.currentTime = 0;

    let finished = false;

    function done(){

      if(finished) return;

      finished = true;

      audio.onended = null;
      audio.onerror = null;

      resolve();
    }

    audio.onended = done;
    audio.onerror = done;

    const result = audio.play();

    if(result){
      result.catch(()=>{
        done();
      });
    }

  });
}

/* ================= ARI ================= */

function stopBee(){

  if(beeAnimation){
    beeAnimation.cancel();
    beeAnimation = null;
  }

  const bee = document.getElementById("bee");

  bee.style.transform =
    "translate3d(0px,0px,0px)";
}

function startBee(){

  stopBee();

  const bee = document.getElementById("bee");

  /*
    SADECE TRANSFORM KULLANIYORUZ.
    Safari için daha akıcı.
  */

  beeAnimation = bee.animate(

    [
      {
        transform:
        "translate3d(0px,0px,0px) rotate(-5deg)"
      },

      {
        transform:
        "translate3d(85px,-75px,0px) rotate(5deg)"
      },

      {
        transform:
        "translate3d(180px,45px,0px) rotate(-3deg)"
      },

      {
        transform:
        "translate3d(285px,-65px,0px) rotate(5deg)"
      },

      {
        transform:
        "translate3d(395px,35px,0px) rotate(-4deg)"
      },

      {
        transform:
        "translate3d(505px,-60px,0px) rotate(5deg)"
      },

      {
        transform:
        "translate3d(590px,10px,0px) rotate(-3deg)"
      },

      {
        transform:
        "translate3d(505px,65px,0px) rotate(4deg)"
      },

      {
        transform:
        "translate3d(390px,-15px,0px) rotate(-5deg)"
      },

      {
        transform:
        "translate3d(275px,70px,0px) rotate(4deg)"
      },

      {
        transform:
        "translate3d(160px,-20px,0px) rotate(-4deg)"
      },

      {
        transform:
        "translate3d(0px,0px,0px) rotate(-5deg)"
      }
    ],

    {
      duration:9000,
      iterations:Infinity,
      easing:"linear"
    }

  );
}

/* ================= DURDUR ================= */

function stopEverything(){

  running = false;

  stopAllAudio();
  stopBee();
}

/* ================= PATH ================= */

function hidePath(path){

  const length = path.getTotalLength();

  path.style.strokeDasharray = length;
  path.style.strokeDashoffset = length;
}

function resetSmall(){

  hidePath(
    document.getElementById("smallC")
  );

  hidePath(
    document.getElementById("smallStraight")
  );

  const dot =
    document.getElementById("smallDot");

  dot.setAttribute("cx","555");
  dot.setAttribute("cy","180");
}

function resetBig(){

  hidePath(
    document.getElementById("bigLeft")
  );

  hidePath(
    document.getElementById("bigRight")
  );

  hidePath(
    document.getElementById("bigMiddle")
  );

  const dot =
    document.getElementById("bigDot");

  dot.setAttribute("cx","450");
  dot.setAttribute("cy","75");
}

/* ================= ÇİZİM ================= */

function animatePath(path,dot,duration){

  return new Promise(resolve=>{

    const length = path.getTotalLength();

    path.style.strokeDasharray = length;
    path.style.strokeDashoffset = length;

    const start = performance.now();

    function frame(now){

      const progress =
        Math.min(
          (now-start)/duration,
          1
        );

      const current =
        length * progress;

      path.style.strokeDashoffset =
        length-current;

      const point =
        path.getPointAtLength(current);

      dot.setAttribute(
        "cx",
        point.x
      );

      dot.setAttribute(
        "cy",
        point.y
      );

      if(progress < 1){
        requestAnimationFrame(frame);
      }else{
        resolve();
      }
    }

    requestAnimationFrame(frame);
  });
}

/* ================= SES TANIMA ================= */

async function startSoundActivity(){

  if(running) return;

  running = true;

  stopAllAudio();

  /*
    BUTONA BASILDIĞI ANDA
    SESİ BAŞLATIYORUZ.
  */

  const audioPromise =
    playAudio("introAudio");

  startBee();

  await audioPromise;

  /*
    Ses bittikten sonra arı biraz daha
    hareket edebilir.
  */

  await new Promise(resolve=>{
    setTimeout(resolve,2500);
  });

  stopBee();

  running = false;
}

/* ================= KÜÇÜK a ================= */

async function startSmall(){

  if(running) return;

  running = true;

  stopAllAudio();
  resetSmall();

  const c =
    document.getElementById("smallC");

  const straight =
    document.getElementById("smallStraight");

  const dot =
    document.getElementById("smallDot");

  const info =
    document.getElementById("smallInfo");

  /*
    1 — C
  */

  info.textContent =
    "1️⃣ Önce c çizgisini çiz. Sarı okları takip et.";

  await Promise.all([

    playAudio("small1"),

    animatePath(
      c,
      dot,
      4200
    )

  ]);

  /*
    2 — DÜZ
  */

  info.textContent =
    "2️⃣ Şimdi düz çizgiyi yukarıdan aşağı doğru çiz.";

  dot.setAttribute("cx","570");
  dot.setAttribute("cy","145");

  await Promise.all([

    playAudio("small2"),

    animatePath(
      straight,
      dot,
      3000
    )

  ]);

  /*
    BİR KEZ DAHA
  */

  info.textContent =
    "🌟 Harika! Bir kez daha yazalım.";

  await playAudio("small3");

  resetSmall();

  await animatePath(
    c,
    dot,
    3500
  );

  dot.setAttribute("cx","570");
  dot.setAttribute("cy","145");

  await animatePath(
    straight,
    dot,
    2500
  );

  /*
    BİTİŞ
  */

  info.textContent =
    "✏️ Şimdi sıra sende!";

  await playAudio("small4");

  running = false;
}

/* ================= BÜYÜK A ================= */

async function startBig(){

  if(running) return;

  running = true;

  stopAllAudio();
  resetBig();

  const left =
    document.getElementById("bigLeft");

  const right =
    document.getElementById("bigRight");

  const middle =
    document.getElementById("bigMiddle");

  const dot =
    document.getElementById("bigDot");

  const info =
    document.getElementById("bigInfo");

  /*
    1 — SOL EĞİK
  */

  info.textContent =
    "1️⃣ Yukarıdan başlayıp sol alta doğru eğik çiz.";

  await Promise.all([

    playAudio("big1"),

    animatePath(
      left,
      dot,
      4200
    )

  ]);

  /*
    2 — SAĞ EĞİK
    NOKTA TEPEYE GERİ DÖNER
  */

  dot.setAttribute("cx","450");
  dot.setAttribute("cy","75");

  info.textContent =
    "2️⃣ Tekrar yukarıdan başla. Bu kez sağ alta doğru eğik çiz.";

  await Promise.all([

    playAudio("big2"),

    animatePath(
      right,
      dot,
      4200
    )

  ]);

  /*
    3 — ORTA
    SOLDAN SAĞA
  */

  dot.setAttribute("cx","335");
  dot.setAttribute("cy","275");

  info.textContent =
    "3️⃣ Şimdi ortadaki çizgiyi soldan sağa doğru çiz.";

  await Promise.all([

    playAudio("big3"),

    animatePath(
      middle,
      dot,
      3200
    )

  ]);

  /*
    BİTİŞ
  */

  info.textContent =
    "🌟 Harika! Büyük A harfini de tamamladın. Şimdi sıra sende!";

  await playAudio("big4");

  running = false;
}

/* ================= AÇILIŞ ================= */

window.addEventListener("load",()=>{

  resetSmall();
  resetBig();

  document
    .querySelectorAll("audio")
    .forEach(audio=>{
      audio.load();
    });

});

</script>
