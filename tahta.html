<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Neti Akıllı Tahta | A Sesi</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#eefcff,#fff9ea);
  color:#292929;
}

button{
  font-family:inherit;
  touch-action:manipulation;
  cursor:pointer;
}

/* =========================
   ÜST MENÜ
========================= */

header{
  height:82px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 25px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
  position:relative;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:29px;
  font-weight:900;
  color:#ef7c43;
}

.brand img{
  width:62px;
  height:62px;
  object-fit:contain;
}

.soundToggle{
  border:0;
  border-radius:16px;
  background:#e7f6ff;
  color:#328bc8;
  font-size:20px;
  font-weight:800;
  padding:13px 18px;
}

/* =========================
   SAYFALAR
========================= */

.page{
  display:none;
  min-height:calc(100vh - 82px);
}

.page.active{
  display:block;
}

/* =========================
   ANA MENÜ
========================= */

#home{
  text-align:center;
  padding:24px 25px 45px;
}

.homeTitle{
  color:#3888c7;
  font-size:44px;
  margin:4px 0;
}

.homeSubtitle{
  font-size:23px;
  color:#666;
  margin:8px 0 18px;
}

.letters{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:15px 0 25px;
}

.letterBox{
  width:120px;
  height:120px;
  background:white;
  border:6px solid #ff9c43;
  border-radius:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:82px;
  font-weight:900;
  color:#ef7038;
  box-shadow:0 7px 18px rgba(0,0,0,.08);
}

.letterBox.small{
  border-color:#58b7dc;
  color:#3888c7;
}

.menu{
  max-width:1120px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.menuCard{
  border:0;
  border-radius:28px;
  min-height:195px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.menuCard:nth-child(1){background:#fff0a5;}
.menuCard:nth-child(2){background:#dff6ff;}
.menuCard:nth-child(3){background:#ffe1ee;}

.menuIcon{
  display:block;
  font-size:55px;
}

.menuTitle{
  display:block;
  font-size:26px;
  font-weight:900;
  margin-top:10px;
}

.menuDesc{
  display:block;
  font-size:17px;
  color:#666;
  margin-top:8px;
}

/* =========================
   ETKİNLİK ORTAK
========================= */

.activity{
  text-align:center;
  padding:20px 25px 45px;
}

.activityTitle{
  color:#3888c7;
  font-size:40px;
  margin:4px 0 14px;
}

.info{
  min-height:42px;
  font-size:26px;
  line-height:1.25;
  font-weight:900;
  margin:13px auto;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-top:12px;
}

.mainBtn{
  border:0;
  border-radius:19px;
  background:#65c77c;
  color:#fff;
  padding:16px 28px;
  font-size:22px;
  font-weight:900;
  min-width:230px;
  box-shadow:0 5px 12px rgba(0,0,0,.10);
}

.repeatBtn{
  background:#ff9e43;
}

.homeBtn{
  background:#4f9fd3;
}

/* =========================
   NETİ + A SESİ
========================= */

.soundStage{
  width:min(1050px,94vw);
  height:535px;
  margin:auto;
  background:white;
  border:5px solid #f1d66c;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.soundLetters{
  position:absolute;
  left:0;
  right:0;
  top:20px;
  font-size:132px;
  font-weight:900;
  color:#ef7038;
}

.netiWrap{
  position:absolute;
  left:25px;
  bottom:20px;
  width:215px;
}

.netiWrap img{
  display:block;
  width:100%;
}

.eyeRoute{
  position:absolute;
  left:255px;
  right:45px;
  top:275px;
  height:2px;
  border-top:4px dashed #aaa;
}

.beeWrap{
  position:absolute;
  left:290px;
  top:210px;
  width:80px;
  height:80px;

  /* GPU katmanı */
  will-change:transform;
  transform:translate3d(0,0,0);
}

.beeWrap img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.eyeText{
  position:absolute;
  left:250px;
  right:25px;
  bottom:38px;
  font-size:29px;
  font-weight:900;
}

/* =========================
   YAZI TAHTASI
========================= */

.writingStage{
  width:min(1000px,94vw);
  height:535px;
  margin:8px auto;
  background:#fff;
  border:6px solid #58b6da;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

/*
  YAZI ALANI
  Üst-alt düz
  orta kesik
*/

.schoolLine{
  position:absolute;
  left:6%;
  width:88%;
  z-index:1;
}

.schoolTop{
  top:17%;
  border-top:3px solid #efa6c9;
}

.schoolMiddle{
  top:50%;
  border-top:4px dashed #efa6c9;
}

.schoolBottom{
  top:83%;
  border-top:3px solid #efa6c9;
}

.letterSvg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

.guide{
  fill:none;
  stroke:#dedede;
  stroke-width:24;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.drawStroke{
  fill:none;
  stroke:#ef5050;
  stroke-width:18;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.yellowDot{
  fill:#ffd328;
  stroke:#efa900;
  stroke-width:4;
}

/* OKLAR */

.arrow{
  fill:none;
  stroke:#ef5050;
  stroke-width:6;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.arrowHead{
  fill:#ef5050;
}

.stepCircle{
  fill:#2e9bd2;
}

.stepText{
  fill:#fff;
  font-size:23px;
  font-weight:900;
  text-anchor:middle;
  dominant-baseline:middle;
}

/* =========================
   MOBİL

    right:10px;
    font-size:22px;
  }
}

</style>

<script>

/* =========================
   GENEL
========================= */

let soundEnabled=true;
let running=false;
let beeAnimation=null;


function wait(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );

}


/* =========================
   SAYFA
========================= */

function showPage(id){

  stopEverything();

  document
  .querySelectorAll(".page")
  .forEach(page=>{
    page.classList.remove("active");
  });

  document
  .getElementById(id)
  .classList.add("active");

  window.scrollTo(0,0);

}


function goHome(){

  stopEverything();

  document
  .querySelectorAll(".page")
  .forEach(page=>{
    page.classList.remove("active");
  });

  document
  .getElementById("home")
  .classList.add("active");

  window.scrollTo(0,0);

}


/* =========================
   SES
========================= */

function toggleSound(){

  soundEnabled=!soundEnabled;

  document
  .getElementById("soundToggle")
  .textContent=
    soundEnabled
    ? "🔊 Ses Açık"
    : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }

}


function stopAllAudio(){

  document
  .querySelectorAll("audio")
  .forEach(audio=>{

    audio.pause();
    audio.currentTime=0;

  });

}


function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){

      resolve();
      return;

    }

    const audio=
      document.getElementById(id);

    audio.pause();
    audio.currentTime=0;

    let done=false;

    function finish(){

      if(done)return;

      done=true;

      audio.onended=null;
      audio.onerror=null;

      resolve();

    }

    audio.onended=finish;
    audio.onerror=finish;

    const result=audio.play();

    if(result){

      result.catch(()=>{
        finish();
      });

    }

  });

}


/* =========================
   ARI
========================= */

function stopBee(){

  if(beeAnimation){

    beeAnimation.cancel();
    beeAnimation=null;

  }

  const bee=
    document.getElementById("bee");

  bee.style.transform=
    "translate3d(0px,0px,0px)";

}


function startBee(){

  stopBee();

  const bee=
    document.getElementById("bee");

  /*
  Sadece transform kullanıyoruz.
  left/top sürekli değişmiyor.
  Bu nedenle hareket daha akıcı.
  */

  beeAnimation=
    bee.animate(

      [

        {
          transform:
          "translate3d(0px,0px,0px) rotate(-6deg)"
        },

        {
          transform:
          "translate3d(150px,70px,0px) rotate(4deg)"
        },

        {
          transform:
          "translate3d(320px,-10px,0px) rotate(7deg)"
        },

        {
          transform:
          "translate3d(460px,55px,0px) rotate(-2deg)"
        },

        {
          transform:
          "translate3d(300px,-80px,0px) rotate(-7deg)"
        },

        {
          transform:
          "translate3d(140px,-30px,0px) rotate(4deg)"
        },

        {
          transform:
          "translate3d(0px,0px,0px) rotate(-6deg)"
        }

      ],

      {
        duration:6500,
        iterations:Infinity,
        easing:"ease-in-out"
      }

    );

}


/* =========================
   DURDUR
========================= */

function stopEverything(){

  running=false;

  stopAllAudio();
  stopBee();

}


/* =========================
   PATH HAZIRLAMA
========================= */

function hidePath(path){

  const length=
    path.getTotalLength();

  path.style.strokeDasharray=
    length;

  path.style.strokeDashoffset=
    length;

}


function resetSmall(){

  hidePath(
    document.getElementById("smallC")
  );

  hidePath(
    document.getElementById("smallStraight")
  );

}


function resetBig(){

  hidePath(
    document.getElementById("bigLeft")
  );

  hidePath(
    document.getElementById("bigRight")
  );

  hidePath(
    document.getElementById("bigMiddle")
  );

}


/* =========================
   ÇİZGİ ANİMASYONU
========================= */

function animatePath(
  path,
  dot,
  duration
){

  return new Promise(resolve=>{

    const length=
      path.getTotalLength();

    path.style.strokeDasharray=
      length;

    path.style.strokeDashoffset=
      length;

    const start=
      performance.now();


    function frame(now){

      const progress=
        Math.min(
          (now-start)/duration,
          1
        );

      const current=
        length*progress;

      path.style.strokeDashoffset=
        length-current;

      const point=
        path.getPointAtLength(current);

      dot.setAttribute(
        "cx",
        point.x
      );

      dot.setAttribute(
        "cy",
        point.y
      );

      if(progress<1){

        requestAnimationFrame(frame);

      }else{

        resolve();

      }

    }

    requestAnimationFrame(frame);

  });

}


/* =========================
   SES TANIMA
========================= */

async function startSoundActivity(){

  if(running)return;

  running=true;

  stopAllAudio();

  /*
  Dokunma anında ses başlar.
  */

  const sound=
    playAudio("introAudio");

  startBee();

  await sound;

  await wait(5000);

  stopBee();

  running=false;

}


/* =========================
   KÜÇÜK a
========================= */

async function startSmall(){

  if(running)return;

  running=true;

  stopAllAudio();
  resetSmall();

  const c=
    document.getElementById("smallC");

  const straight=
    document.getElementById("smallStraight");

  const dot=
    document.getElementById("smallDot");

  const info=
    document.getElementById("smallInfo");


  /* 1 */

  info.textContent=
    "1️⃣ Önce c çizgisini çiz. Sarı okları takip et.";

  await Promise.all([

    playAudio("small1"),

    animatePath(
      c,
      dot,
      4200
    )

  ]);


  /* 2 */

  info.textContent=
    "2️⃣ Şimdi düz çizgiyi yukarıdan aşağı doğru çiz.";

  await Promise.all([

    playAudio("small2"),

    animatePath(
      straight,
      dot,
      3000
    )

  ]);


  /* TEKRAR */

  info.textContent=
    "🌟 Harika! Bir kez daha yazalım.";

  await playAudio("small3");

  resetSmall();

  await animatePath(
    c,
    dot,
    3500
  );

  await animatePath(
    straight,
    dot,
    2500
  );


  /* BİTİŞ */

  info.textContent=
    "✏️ Şimdi sıra sende!";

  await playAudio("small4");

  running=false;

}
