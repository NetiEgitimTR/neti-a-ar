<script>

let soundEnabled = true;
let running = false;

let beeAnimation = null;
let beeStartTimer = null;
let beeStopTimer = null;


/* =====================================================
SAYFA
===================================================== */

function showPage(id){

  stopEverything();

  document.querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document.getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}


function goHome(){

  stopEverything();

  document.querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document.getElementById("home")
    .classList.add("active");

  window.scrollTo(0,0);
}


/* =====================================================
SES
===================================================== */

function toggleSound(){

  soundEnabled = !soundEnabled;

  document.getElementById("soundToggle")
    .textContent =
      soundEnabled
      ? "🔊 Ses Açık"
      : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }
}


function stopAllAudio(){

  document.querySelectorAll("audio")
    .forEach(audio=>{

      try{
        audio.pause();
        audio.currentTime = 0;
      }catch(e){}

    });
}


function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const audio =
      document.getElementById(id);

    audio.pause();
    audio.currentTime = 0;

    let finished = false;

    function done(){

      if(finished) return;

      finished = true;

      audio.onended = null;
      audio.onerror = null;

      resolve();
    }

    audio.onended = done;
    audio.onerror = done;

    const p = audio.play();

    if(p){
      p.catch(done);
    }

  });
}


/* =====================================================
ARI
===================================================== */

function hideBee(){

  clearTimeout(beeStartTimer);
  clearTimeout(beeStopTimer);

  if(beeAnimation){
    beeAnimation.cancel();
    beeAnimation = null;
  }

  const bee =
    document.getElementById("bee");

  bee.style.opacity = "0";
  bee.style.visibility = "hidden";
  bee.style.transform = "translate3d(0,0,0)";
}


/* =====================================================
ARI HAREKETİ

Önemli:
Web Animations keyframe kullanmıyoruz.

requestAnimationFrame + matematiksel
sürekli eğri kullanıyoruz.

Böylece noktalarda hızlanma/duraklama yok.
===================================================== */

function startBee(){

  const bee =
    document.getElementById("bee");

  const stage =
    document.getElementById("soundStage");


  const mobile =
    window.innerWidth <= 760;


  const startX =
    mobile ? 100 : 150;

  const startBottom =
    mobile ? 110 : 135;


  bee.style.left =
    startX + "px";

  bee.style.bottom =
    startBottom + "px";

  bee.style.visibility = "visible";
  bee.style.opacity = "1";


  const beeW =
    bee.offsetWidth;

  const beeH =
    bee.offsetHeight;

  const stageW =
    stage.clientWidth;

  const stageH =
    stage.clientHeight;


  const startTop =
    stageH -
    startBottom -
    beeH;


  /*
  Hareket alanı
  */

  const areaW =
    stageW -
    startX -
    beeW -
    30;

  const centerY =
    stageH * 0.43;


  /*
  ÇOK YAVAŞ HAREKET

  Tam hareket döngüsü 18 saniye.
  Biz arıyı daha önce durduracağımız için
  sadece bunun bir bölümünü göreceğiz.
  */

  const duration = 18000;

  const startTime =
    performance.now();


  let animationFrame;


  function move(now){

    if(
      bee.style.visibility === "hidden"
    ){
      cancelAnimationFrame(animationFrame);
      return;
    }


    const t =
      ((now - startTime) % duration)
      / duration;


    /*
    x:
    yavaş sağ-sol

    sinüs kullandığımız için
    keskin dönüş yok.
    */

    const x =
      areaW *
      (
        0.48 +
        0.43 *
        Math.sin(
          t * Math.PI * 2
        )
      );


    /*
    y:
    farklı frekansta yukarı-aşağı.

    x ve y farklı çalıştığı için
    arı:
    - yuvarlak
    - çapraz
    - sağ-sol
    - yukarı-aşağı

    karışık bir rota oluşturuyor.
    */

    const yWave1 =
      Math.sin(
        t * Math.PI * 4
      );

    const yWave2 =
      Math.sin(
        t * Math.PI * 2 + 1.2
      );


    const y =
      centerY
      + yWave1 * 80
      + yWave2 * 45
      - startTop;


    bee.style.transform =
      `translate3d(
        ${x}px,
        ${y}px,
        0
      )`;


    animationFrame =
      requestAnimationFrame(move);
  }


  animationFrame =
    requestAnimationFrame(move);


  beeAnimation = {

    cancel(){

      cancelAnimationFrame(
        animationFrame
      );

    }

  };
}


function stopBee(){

  if(beeAnimation){

    beeAnimation.cancel();
    beeAnimation = null;

  }

  const bee =
    document.getElementById("bee");

  bee.style.opacity = "0";
  bee.style.visibility = "hidden";
}


/* =====================================================
TÜMÜNÜ DURDUR
===================================================== */

function stopEverything(){

  running = false;

  stopAllAudio();

  clearTimeout(beeStartTimer);
  clearTimeout(beeStopTimer);

  hideBee();
}


/* =====================================================
NETİ + ARI ZAMANLAMASI
===================================================== */

function startSoundActivity(){

  if(running) return;

  running = true;

  stopAllAudio();
  hideBee();


  const audio =
    document.getElementById(
      "introAudio"
    );


  /*
  ÖNEMLİ:

  Ses başlarken arı GİZLİ.
  */

  hideBee();


  if(soundEnabled){

    audio.pause();
    audio.currentTime = 0;
    audio.volume = 1;

    audio.play().catch(()=>{
      running = false;
    });

  }


  /*
  ==================================================
  ARI BAŞLANGICI

  Neti'nin ilk konuşmasının bitmesini
  bekliyoruz.

  Önceki 1.7 saniyeyi kaldırdım.

  Arı 3.4 saniyede çıkıyor.
  ==================================================
  */

  beeStartTimer =
    setTimeout(()=>{

      if(running){
        startBee();
      }

    },3400);


  /*
  ==================================================
  ARI BİTİŞİ

  "Şimdi sıra sende" başlamadan
  hemen önce kayboluyor.
  ==================================================
  */

  beeStopTimer =
    setTimeout(()=>{

      stopBee();

    },6400);


  audio.onended = ()=>{

    stopBee();
    running = false;

  };


  /*
  Ses kapalıysa test
  */

  if(!soundEnabled){

    clearTimeout(beeStartTimer);
    clearTimeout(beeStopTimer);

    beeStartTimer =
      setTimeout(()=>{

        startBee();

      },500);


    beeStopTimer =
      setTimeout(()=>{

        stopBee();
        running = false;

      },5000);

  }

}


/* =====================================================
KÜÇÜK a
===================================================== */

function hidePath(path){

  const length =
    path.getTotalLength();

  path.style.strokeDasharray =
    length;

  path.style.strokeDashoffset =
    length;
}


function resetSmall(){

  hidePath(
    document.getElementById(
      "smallC"
    )
  );

  hidePath(
    document.getElementById(
      "smallStraight"
    )
  );


  const dot =
    document.getElementById(
      "smallDot"
    );


  dot.setAttribute(
    "cx",
    "590"
  );

  dot.setAttribute(
    "cy",
    "265"
  );
}


/* =====================================================
ÇİZİM
===================================================== */

function animatePath(
  path,
  dot,
  duration
){

  return new Promise(resolve=>{

    const length =
      path.getTotalLength();


    path.style.strokeDasharray =
      length;

    path.style.strokeDashoffset =
      length;


    const start =
      performance.now();


    function frame(now){

      const progress =
        Math.min(
          (now-start)/duration,
          1
        );


      const current =
        length * progress;


      path.style.strokeDashoffset =
        length-current;


      const point =
        path.getPointAtLength(
          current
        );


      dot.setAttribute(
        "cx",
        point.x
      );


      dot.setAttribute(
        "cy",
        point.y
      );


      if(progress < 1){

        requestAnimationFrame(
          frame
        );

      }else{

        resolve();

      }

    }


    requestAnimationFrame(
      frame
    );

  });
}


/* =====================================================
KÜÇÜK a ETKİNLİĞİ
===================================================== */

  if(running) return;

  running = true;

  stopAllAudio();
  resetSmall();


  const c =
    document.getElementById(
      "smallC"
    );


  const straight =
    document.getElementById(
      "smallStraight"
    );


  const dot =
    document.getElementById(
      "smallDot"
    );


  const info =

      "smallInfo"
    );


  /* 1 */

  info.textContent =
    "1️⃣ Önce c çizgisini çiz. Sarı okları takip et.";


  await Promise.all([

    animatePath(
      c,

      5200
    )

  ]);


  /* 2 */

  info.textContent =

  dot.setAttribute(
    "cx",
    "590"
  );

  dot.setAttribute(
    "cy",
    "240"
  );


  await Promise.all([

    playAudio("small2"),

    animatePath(
      straight,
      dot,
      3200
    )

  ]);


  /* TEKRAR */

  info.textContent =
    "🌟 Harika! Bir kez daha yazalım.";


  await playAudio(
    "small3"
  );


  resetSmall();


  await animatePath(
    c,
    dot,
    5200
  );


  dot.setAttribute(
    "cx",
    "590"
  );

  dot.setAttribute(
    "cy",
    "240"
  );


  await animatePath(
    straight,
    dot,
    3200
  );


  /* BİTİŞ */

  info.textContent =
    "✏️ Şimdi sıra sende!";


  await playAudio(
    "small4"
  );


  running = false;
}
