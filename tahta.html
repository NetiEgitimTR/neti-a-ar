<style>
*{

/* =====================================================
ANA SAYFA
===================================================== */

.menuCard{

.menuCard:first-child{

}

/* =====================================================
ARI EKRANI
===================================================== */

.soundStage{

  height:540px;
  margin:auto;

  position:relative;
  overflow:hidden;

  background:#fff;
  border:5px solid #f1d66c;

=====================================================
ARI SVG

ÖNEMLİ:
ROTANIN ÇİZGİSİ YOK.
SADECE ARI GÖRÜNÜYOR.
=====================================================
*/

#beePath{

}

/* =====================================================
KÜÇÜK a YAZI ALANI
===================================================== */

  overflow:hidden;

  background:white;

  border-radius:32px;

}

/*
SATIR:

ÜST PEMBE     = %14
KESİK PEMBE   = %43
ALT PEMBE     = %82

KÜÇÜK a SADECE
%43 - %82 ARASINDA.
*/

.schoolLine{
  position:absolute;
  left:6%;
  width:88%;
  z-index:1;
}

.schoolTop{
  top:14%;
  border-top:3px solid #efa6c9;

.schoolMiddle{

}

.schoolBottom{
  top:82%;

}

/* =====================================================
SVG
===================================================== */

.letterSvg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

.guideOuter{
  fill:none;
  stroke:#bfc1c5;
  stroke-width:27;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.guideInner{
  fill:none;
  stroke:#e5e6e8;
  stroke-width:19;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.guideDash{
  fill:none;
  stroke:white;
  stroke-width:3;
  stroke-dasharray:8 7;
  stroke-linecap:round;
}

.drawStroke{
  fill:none;
  stroke:#ff3d3d;
  stroke-width:16;
  stroke-linecap:round;
  stroke-linejoin:round;

.yellowDot{

.arrowLine{

<script>

let soundEnabled=true;
let running=false;

/* =====================================================
SAYFA
===================================================== */

function showPage(id){

  stopEverything();

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}

function goHome(){

  stopEverything();

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById("home")
    .classList.add("active");

  window.scrollTo(0,0);
}

/* =====================================================
SES
===================================================== */

function toggleSound(){

  soundEnabled=!soundEnabled;

  document
    .getElementById("soundToggle")
    .textContent=
      soundEnabled
      ? "🔊 Ses Açık"
      : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }
}

function stopAllAudio(){

  document
    .querySelectorAll("audio")
    .forEach(audio=>{

      try{
        audio.pause();
        audio.currentTime=0;
      }catch(e){}

    });
}

function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const audio=
      document.getElementById(id);

    audio.pause();
    audio.currentTime=0;

    let finished=false;

    function done(){

      if(finished) return;

      finished=true;

      audio.onended=null;
      audio.onerror=null;

      resolve();
    }

    audio.onended=done;
    audio.onerror=done;

    const p=audio.play();

    if(p){
      p.catch(done);
    }

  });
}

/* =====================================================
ARI
===================================================== */

function resetBee(){

  const svg=
    document.getElementById("beeArea");

  try{

    svg.pauseAnimations();
    svg.setCurrentTime(0);

  }catch(e){}
}

function startBee(){

  const svg=
    document.getElementById("beeArea");

  const motion=
    document.getElementById("beeMotion");

  try{

    svg.setCurrentTime(0);
    svg.unpauseAnimations();

    motion.beginElement();

  }catch(e){}
}

function stopBee(){

  const svg=
    document.getElementById("beeArea");

  try{
    svg.pauseAnimations();
  }catch(e){}
}

/* =====================================================
DURDUR
===================================================== */

function stopEverything(){

  running=false;

  stopAllAudio();
  resetBee();
}

/* =====================================================
PATH HAZIRLIK
===================================================== */

function hidePath(path){

  const length=
    path.getTotalLength();

  path.style.strokeDasharray=
    length;

  path.style.strokeDashoffset=
    length;
}

function resetSmall(){

  hidePath(
    document.getElementById("smallC")
  );

  hidePath(
    document.getElementById("smallStraight")
  );

  const dot=
    document.getElementById("smallDot");

  dot.setAttribute(
    "cx",
    "540"
  );

  dot.setAttribute(
    "cy",
    "230"
  );
}

/* =====================================================
ÇİZİM ANİMASYONU
===================================================== */

function animatePath(
  path,
  dot,
  duration
){

  return new Promise(resolve=>{

    const length=
      path.getTotalLength();

    path.style.strokeDasharray=
      length;

    path.style.strokeDashoffset=
      length;

    const start=
      performance.now();

    function frame(now){

      const progress=
        Math.min(
          (now-start)/duration,
          1
        );

      const current=
        length*progress;

      path.style.strokeDashoffset=
        length-current;

      const point=
        path.getPointAtLength(current);

      dot.setAttribute(
        "cx",
        point.x
      );

      dot.setAttribute(
        "cy",
        point.y
      );

      if(progress<1){

        requestAnimationFrame(frame);

      }else{

        resolve();

      }
    }

    requestAnimationFrame(frame);

  });
}

/* =====================================================
ARI ETKİNLİĞİ
===================================================== */

async function startSoundActivity(){

  if(running) return;

  running=true;

  stopAllAudio();

  startBee();

  /*
  SESİ BUTON TIKLAMASINDAN
  DOĞRUDAN BAŞLATIYORUZ.
  */

  await playAudio(
    "introAudio"
  );

  /*
  SES BİTSE DE ARI
  BİRAZ DEVAM ETSİN.
  */

  await new Promise(resolve=>{
    setTimeout(resolve,4500);
  });

  stopBee();

  running=false;
}

/* =====================================================
KÜÇÜK a
===================================================== */

async function startSmall(){

  if(running) return;

  running=true;

  stopAllAudio();
  resetSmall();

  const c=
    document.getElementById(
      "smallC"
    );

  const straight=
    document.getElementById(
      "smallStraight"
    );

  const dot=
    document.getElementById(
      "smallDot"
    );

  const info=
    document.getElementById(
      "smallInfo"
    );

  /* ================= 1 ================= */

  info.textContent=
    "1️⃣ Önce c çizgisini çiz. Sarı okları takip et.";

  await Promise.all([

    playAudio("small1"),

    animatePath(
      c,
      dot,
      4200
    )

  ]);

  /* ================= 2 ================= */

  info.textContent=
    "2️⃣ Şimdi düz çizgiyi yukarıdan aşağı doğru çiz.";

  dot.setAttribute(
    "cx",
    "542"
  );

  dot.setAttribute(
    "cy",
    "216"
  );

  await Promise.all([

    playAudio("small2"),

    animatePath(
      straight,
      dot,
      3000
    )

  ]);

  /* ================= TEKRAR ================= */

  info.textContent=
    "🌟 Harika! Bir kez daha yazalım.";

  await playAudio(
    "small3"
  );

  resetSmall();

  await animatePath(
    c,
    dot,
    3500
  );

  dot.setAttribute(
    "cx",
    "542"
  );

  dot.setAttribute(
    "cy",
    "216"
  );

  await animatePath(
    straight,
    dot,
    2500
  );

  /* ================= BİTİŞ ================= */

  info.textContent=
    "✏️ Şimdi sıra sende!";

  await playAudio(
    "small4"
  );

  running=false;
}

window.addEventListener(
  "load",
  ()=>{

    resetSmall();
    resetBee();

    document
      .querySelectorAll("audio")
      .forEach(audio=>{
        audio.load();
      });

  }
);
