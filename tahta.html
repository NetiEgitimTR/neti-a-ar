<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neti Akıllı Tahta - A Sesi</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#effcff,#fff9e9);
  color:#292929;
}

button{
  font-family:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

/* ÜST */

header{
  height:82px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 25px;
  box-shadow:0 3px 12px #0002;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:29px;
  font-weight:900;
  color:#ef7d43;
}

.brand img{
  width:62px;
  height:62px;
  object-fit:contain;
}

#soundToggle{
  border:0;
  border-radius:16px;
  background:#e7f6ff;
  color:#328bc8;
  font-size:20px;
  font-weight:bold;
  padding:13px 18px;
}

/* SAYFALAR */

.page{
  display:none;
  min-height:calc(100vh - 82px);
}

.page.active{
  display:block;
}

/* ANA MENÜ */

#home{
  text-align:center;
  padding:25px;
}

h1{
  color:#3888c7;
  font-size:45px;
  margin:5px 0;
}

.subtitle{
  font-size:23px;
  color:#666;
  margin-bottom:20px;
}

.letters{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:15px;
}

.letter{
  width:120px;
  height:120px;
  background:white;
  border:6px solid #ff9c43;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:82px;
  font-weight:bold;
  color:#ef7038;
}

.letter.small{
  border-color:#59b7dc;
  color:#3888c7;
}

.menu{
  max-width:1100px;
  margin:25px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.menu button{
  border:0;
  border-radius:27px;
  min-height:190px;
  padding:20px;
  box-shadow:0 7px 18px #0002;
}

.menu button:nth-child(1){background:#fff0a5}
.menu button:nth-child(2){background:#dff6ff}
.menu button:nth-child(3){background:#ffe1ee}

.icon{
  display:block;
  font-size:55px;
}

.menu strong{
  display:block;
  font-size:26px;
  margin:10px;
}

.menu small{
  font-size:17px;
  color:#666;
}

/* ETKİNLİK */

.activity{
  text-align:center;
  padding:20px 25px 100px;
}

.activity h2{
  font-size:40px;
  color:#3888c7;
  margin:5px 0 15px;
}

.mainBtn{
  border:0;
  border-radius:18px;
  background:#65c77c;
  color:white;
  padding:16px 30px;
  font-size:23px;
  font-weight:bold;
  margin:10px;
}

.repeatBtn{
  background:#ff9e43;
}

.homeBtn{
  position:fixed;
  left:20px;
  bottom:18px;
  border:0;
  border-radius:18px;
  background:#ff9e43;
  color:white;
  padding:15px 23px;
  font-size:20px;
  font-weight:bold;
  z-index:20;
}

/* SES TANIMA */

.soundBox{
  width:min(1000px,94vw);
  height:540px;
  margin:auto;
  background:white;
  border:5px solid #f3d66b;
  border-radius:32px;
  position:relative;
  overflow:hidden;
}

.soundLetters{
  font-size:135px;
  font-weight:bold;
  color:#ef7038;
  padding-top:25px;
}

.neti{
  position:absolute;
  width:210px;
  left:25px;
  bottom:15px;
}

.neti img{
  width:100%;
}

.beePath{
  position:absolute;
  left:250px;
  right:40px;
  top:270px;
  border-top:4px dashed #999;
}

#bee{
  position:absolute;
  left:270px;
  top:220px;
  font-size:75px;
}

#bee.fly{
  animation:fly 5s ease-in-out infinite;
}

@keyframes fly{
  0%{left:28%;top:220px}
  25%{left:45%;top:300px}
  50%{left:75%;top:220px}
  75%{left:55%;top:155px}
  100%{left:28%;top:220px}
}

.eyeText{
  position:absolute;
  left:250px;
  right:20px;
  bottom:40px;
  font-size:29px;
  font-weight:bold;
}

/* YAZIM */

.board{
  width:min(920px,94vw);
  height:500px;
  margin:10px auto;
  background:white;
  border:6px solid #58b6da;
  border-radius:30px;
  position:relative;
  overflow:hidden;
}

/* 1. sınıf satırı */

.topLine,
.midLine,
.bottomLine{
  position:absolute;
  left:6%;
  width:88%;
}

.topLine{
  top:20%;
  border-top:3px solid #efa6c9;
}

.midLine{
  top:50%;
  border-top:4px dashed #efa6c9;
}

.bottomLine{
  top:80%;
  border-top:3px solid #efa6c9;
}

svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.guide{
  fill:none;
  stroke:#ddd;
  stroke-width:22;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.stroke{
  fill:none;
  stroke:#ef5050;
  stroke-width:17;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.dot{
  fill:#ffd328;
  stroke:#efa900;
  stroke-width:4;
}

.info{
  min-height:42px;
  font-size:26px;
  font-weight:bold;
  margin:12px;
}

/* TELEFON */

@media(max-width:750px){

  h1{font-size:34px}

  .menu{
    grid-template-columns:1fr;
  }

  .menu button{
    min-height:145px;
  }

  .activity h2{
    font-size:34px;
  }

  .board{
    height:440px;
  }

  .neti{
    width:135px;
    left:8px;
  }

  .soundLetters{
    font-size:105px;
  }

  .eyeText{
    left:150px;
    font-size:23px;
  }
}
</style>
</head>

<body>

<header>

<div class="brand">

<img
src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
alt="Neti">

<span>NETİ</span>

</div>

<button id="soundToggle" onclick="toggleSound()">
🔊 Ses Açık
</button>

</header>


<!-- ANA SAYFA -->

<section id="home" class="page active">

<h1>Neti ile A Sesini Öğreniyorum</h1>

<div class="subtitle">
Akıllı Tahta Etkinlikleri
</div>

<div class="letters">

<div class="letter">A</div>

<div class="letter small">a</div>

</div>

<div class="menu">

<button onclick="showPage('soundPage')">

<span class="icon">🔤</span>

<strong>
A / a Sesini Tanıyalım
</strong>

<small>
Neti'yi dinle • Harfi tanı • Göz egzersizi
</small>

</button>


<button onclick="showPage('smallPage')">

<span class="icon">✍️</span>

<strong>
Küçük a Yazımı
</strong>

<small>
Önce c çizgisi • Sonra düz çizgi
</small>

</button>


<button onclick="showPage('bigPage')">

<span class="icon">✏️</span>

<strong>
Büyük A Yazımı
</strong>

<small>
Sol eğik • Sağ eğik • Orta çizgi
</small>

</button>

</div>

</section>


<!-- SES TANIMA -->

<section id="soundPage" class="page activity">

<h2>A / a Sesini Tanıyalım</h2>

<div class="soundBox">

<div class="soundLetters">
A a
</div>

<div class="neti">

<img
src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
alt="Neti">

</div>

<div class="beePath"></div>

<div id="bee">
🐝
</div>

<div class="eyeText">
👀 Gözlerinle arıyı takip et!
</div>

</div>

<button
class="mainBtn"
onclick="startSound()">
🔊 Neti ile Başla
</button>

<button
class="homeBtn"
onclick="goHome()">
🏠 Ana Sayfa
</button>

</section>


<!-- KÜÇÜK a -->

<section id="smallPage" class="page activity">

<h2>Küçük a Harfini Yazalım</h2>

<div class="board">

<div class="topLine"></div>
<div class="midLine"></div>
<div class="bottomLine"></div>

<svg viewBox="0 0 900 500">

<!-- GRİ REHBER -->

<path
class="guide"
d="
M500 170
C405 125 305 170 300 275
C295 380 405 415 500 360
"/>

<path
class="guide"
d="
M510 150
L510 365
"/>

<!-- KIRMIZI ÇİZİM -->

<path
id="smallC"
class="stroke"
d="
M500 170
C405 125 305 170 300 275
C295 380 405 415 500 360
"/>

<path
id="smallStraight"
class="stroke"
d="
M510 150
L510 365
"/>

<circle
id="smallDot"
class="dot"
cx="500"
cy="170"
r="13"/>

</svg>

</div>

<div id="smallInfo" class="info">
Hazırsan başlayalım!
</div>

<button
class="mainBtn"
onclick="startSmall()">
🔊 Küçük a'yı Göster
</button>

<button
class="mainBtn repeatBtn"
onclick="startSmall()">
🔁 Tekrar
</button>

<button
class="homeBtn"
onclick="goHome()">
🏠 Ana Sayfa
</button>

</section>


<!-- BÜYÜK A -->

<section id="bigPage" class="page activity">

<h2>Büyük A Harfini Yazalım</h2>

<div class="board">

<div class="topLine"></div>
<div class="midLine"></div>
<div class="bottomLine"></div>

<svg viewBox="0 0 900 500">

<!-- GRİ REHBER -->

<path
class="guide"
d="M450 100 L270 410"/>

<path
class="guide"
d="M450 100 L630 410"/>

<path
class="guide"
d="M350 290 L550 290"/>

<!-- KIRMIZI -->

<path
id="bigLeft"
class="stroke"
d="M450 100 L270 410"/>

<path
id="bigRight"
class="stroke"
d="M450 100 L630 410"/>

<path
id="bigBar"
class="stroke"
d="M350 290 L550 290"/>

<circle
id="bigDot"
class="dot"
cx="450"
cy="100"
r="13"/>

</svg>

</div>

<div id="bigInfo" class="info">
Hazırsan başlayalım!
</div>

<button
class="mainBtn"
onclick="startBig()">
🔊 Büyük A'yı Göster
</button>

<button
class="mainBtn repeatBtn"
onclick="startBig()">
🔁 Tekrar
</button>

<button
class="homeBtn"
onclick="goHome()">
🏠 Ana Sayfa
</button>

</section>


<!-- SESLER -->

<audio id="intro"
src="./neti-a-tam-ses.mp3"
preload="auto"></audio>

<audio id="small1"
src="./1-c-cizgisi.mp3.mp3"
preload="auto"></audio>

<audio id="small2"
src="./2-duz-cizgi.mp3.mp3"
preload="auto"></audio>

<audio id="small3"
src="./3-bir-kez-daha.mp3.mp3"
preload="auto"></audio>

<audio id="small4"
src="./4-simdi-sen.mp3.mp3"
preload="auto"></audio>

<audio id="big1"
src="./5-buyuk-a-sol.mp3"
preload="auto"></audio>

<audio id="big2"
src="./6-buyuk-a-sag.mp3"
preload="auto"></audio>

<audio id="big3"
src="./7-buyuk-a-orta.mp3"
preload="auto"></audio>

<audio id="big4"
src="./8-buyuk-a-bitti.mp3"
preload="auto"></audio>


<script>

let soundOn=true;
let busy=false;


/* SAYFA */

function showPage(id){

stopAll();

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

}


function goHome(){

stopAll();

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById("home")
.classList.add("active");

}


/* SES AÇ KAPA */

function toggleSound(){

soundOn=!soundOn;

document
.getElementById("soundToggle")
.textContent=
soundOn
? "🔊 Ses Açık"
: "🔇 Ses Kapalı";

if(!soundOn){
stopAllAudio();
}

}


function stopAllAudio(){

document
.querySelectorAll("audio")
.forEach(a=>{

a.pause();
a.currentTime=0;

});

}


function stopAll(){

busy=false;

stopAllAudio();

document
.getElementById("bee")
.classList.remove("fly");

}


/* SES ÇAL */

function playAudio(id){

return new Promise(resolve=>{

if(!soundOn){

resolve();
return;

}

const audio=
document.getElementById(id);

audio.pause();
audio.currentTime=0;

let finished=false;

function done(){

if(finished)return;

finished=true;

audio.onended=null;
audio.onerror=null;

resolve();

}

audio.onended=done;
audio.onerror=done;

const result=audio.play();

if(result){

result.catch(err=>{

console.log(
"Ses başlatılamadı:",
id,
err
);

done();

});

}

});

}


/* PATH */

function hidePath(path){

const length=
path.getTotalLength();

path.style.strokeDasharray=
length;

path.style.strokeDashoffset=
length;

}


function prepareSmall(){

hidePath(
document.getElementById("smallC")
);

hidePath(
document.getElementById("smallStraight")
);

}


function prepareBig(){

hidePath(
document.getElementById("bigLeft")
);

hidePath(
document.getElementById("bigRight")
);

hidePath(
document.getElementById("bigBar")
);

}


/* ÇİZİM */

function animatePath(
path,
dot,
duration
){

return new Promise(resolve=>{

const length=
path.getTotalLength();

path.style.strokeDasharray=
length;

path.style.strokeDashoffset=
length;

const start=
performance.now();

function frame(now){

const progress=
Math.min(
(now-start)/duration,
1
);

const current=
length*progress;

path.style.strokeDashoffset=
length-current;

const point=
path.getPointAtLength(current);

dot.setAttribute(
"cx",
point.x
);

dot.setAttribute(
"cy",
point.y
);

if(progress<1){

requestAnimationFrame(frame);

}else{

resolve();

}

}

requestAnimationFrame(frame);

});

}


/* A SESİ */

async function startSound(){

if(busy)return;

busy=true;

stopAllAudio();

const bee=
document.getElementById("bee");

bee.classList.remove("fly");

void bee.offsetWidth;

bee.classList.add("fly");

/*
Butona basıldığı anda ses.
*/

await playAudio("intro");

setTimeout(()=>{

bee.classList.remove("fly");

busy=false;

},5000);

}


/* KÜÇÜK a */

async function startSmall(){

if(busy)return;

busy=true;

stopAllAudio();
prepareSmall();

const c=
document.getElementById("smallC");

const straight=
document.getElementById("smallStraight");

const dot=
document.getElementById("smallDot");

const info=
document.getElementById("smallInfo");


/*
1
Ses + c çizimi
aynı anda başlar.
*/

info.textContent=
"1️⃣ Önce c çizgisini çiz. Sarı okları takip et.";

const audio1=
playAudio("small1");

const draw1=
animatePath(
c,
dot,
4200
);

await Promise.all([
audio1,
draw1
]);


/*
2
*/

info.textContent=
"2️⃣ Şimdi düz çizgiyi yukarıdan aşağı doğru çiz.";

const audio2=
playAudio("small2");

const draw2=
animatePath(
straight,
dot,
3000
);

await Promise.all([
audio2,
draw2
]);


/*
3
*/

info.textContent=
"🌟 Harika! Bir kez daha yazalım.";

await playAudio("small3");

prepareSmall();

await animatePath(
c,
dot,
3300
);

await animatePath(
straight,
dot,
2300
);


/*
4
*/

info.textContent=
"✏️ Şimdi sıra sende!";

await playAudio("small4");

busy=false;

}


/* BÜYÜK A */

async function startBig(){

if(busy)return;

busy=true;

stopAllAudio();
prepareBig();

const left=
document.getElementById("bigLeft");

const right=
document.getElementById("bigRight");

const bar=
document.getElementById("bigBar");

const dot=
document.getElementById("bigDot");

const info=
document.getElementById("bigInfo");


/*
1 SOL
*/

info.textContent=
"1️⃣ Yukarıdan başlayıp sol alta doğru eğik çiz.";

await Promise.all([

playAudio("big1"),

animatePath(
left,
dot,
4200
)

]);


/*
2 SAĞ
*/

info.textContent=
"2️⃣ Tekrar yukarıdan başla. Bu kez sağ alta doğru eğik çiz.";

await Promise.all([

playAudio("big2"),

animatePath(
right,
dot,
4200
)

]);


/*
3 ORTA
*/

info.textContent=
"3️⃣ Şimdi ortadaki çizgiyi soldan sağa doğru çiz.";

await Promise.all([

playAudio("big3"),

animatePath(
bar,
dot,
3200
)

]);


/*
4 BİTİŞ
*/

info.textContent=
"🌟 Harika! Büyük A harfini tamamladın.";

await playAudio("big4");

busy=false;

}


/* AÇILIŞ */

window.addEventListener(
"load",
()=>{

prepareSmall();
prepareBig();

document
.querySelectorAll("audio")
.forEach(a=>a.load());

});

</script>

</body>
</html>
