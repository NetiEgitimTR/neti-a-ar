<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Neti Akıllı Tahta | A Sesi</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,#effcff,#fffbed);
  color:#292929;
  min-height:100vh;
}

button{
  font-family:inherit;
  cursor:pointer;
}

/* ---------- ÜST MENÜ ---------- */

header{
  height:90px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 28px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
  position:relative;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:68px;
  height:68px;
  object-fit:contain;
}

.brand-name{
  font-size:32px;
  font-weight:900;
  color:#f07c45;
}

.sound-toggle{
  border:0;
  border-radius:18px;
  background:#e9f7ff;
  color:#398bc5;
  font-size:21px;
  font-weight:800;
  padding:15px 22px;
}

/* ---------- ANA SAYFA ---------- */

.page{
  display:none;
  min-height:calc(100vh - 90px);
}

.page.active{
  display:block;
}

#home{
  padding:28px 30px 45px;
  text-align:center;
}

.home-title{
  font-size:48px;
  color:#3888c7;
  margin:5px 0;
}

.home-subtitle{
  font-size:25px;
  color:#666;
  margin-bottom:20px;
}

.letters{
  display:flex;
  justify-content:center;
  gap:30px;
  margin:15px 0 25px;
}

.letter-card{
  width:135px;
  height:135px;
  background:white;
  border:7px solid #ff9b43;
  border-radius:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:92px;
  font-weight:900;
  color:#f17039;
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.letter-card.blue{
  border-color:#59b8dc;
  color:#3d8dca;
}

.menu{
  max-width:1180px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.menu-card{
  border:0;
  border-radius:28px;
  padding:25px 18px;
  min-height:210px;
  box-shadow:0 8px 18px rgba(0,0,0,.10);
}

.menu-card:nth-child(1){background:#fff1a9;}
.menu-card:nth-child(2){background:#dff6ff;}
.menu-card:nth-child(3){background:#ffe2ef;}

.menu-icon{
  display:block;
  font-size:62px;
  margin-bottom:10px;
}

.menu-title{
  display:block;
  font-size:27px;
  font-weight:900;
}

.menu-desc{
  display:block;
  font-size:17px;
  color:#666;
  margin-top:10px;
}

/* ---------- ETKİNLİK ORTAK ---------- */

.activity{
  padding:22px 28px 105px;
  text-align:center;
}

.activity-title{
  margin:5px 0 15px;
  font-size:43px;
  color:#3888c7;
}

.noti{
  min-height:44px;
  font-size:27px;
  font-weight:900;
  margin:12px auto;
}

.green-button{
  border:0;
  border-radius:20px;
  background:#65c77d;
  color:white;
  padding:17px 30px;
  font-size:23px;
  font-weight:900;
  margin:8px;
  box-shadow:0 5px 10px rgba(0,0,0,.12);
}

.orange-button{
  background:#ff9f43;
}

.home-button{
  position:fixed;
  bottom:20px;
  left:22px;
  border:0;
  border-radius:20px;
  padding:16px 25px;
  background:#ff9f43;
  color:white;
  font-size:21px;
  font-weight:900;
  z-index:30;
}

/* ---------- SES TANIMA ---------- */

.sound-stage{
  width:min(1100px,94vw);
  min-height:570px;
  margin:auto;
  background:white;
  border:5px solid #f2d76b;
  border-radius:35px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.neti-box{
  position:absolute;
  left:35px;
  bottom:25px;
  width:220px;
}

.neti-box img{
  width:100%;
  display:block;
}

.aa{
  font-size:155px;
  font-weight:900;
  color:#f16e35;
  padding-top:35px;
}

.eye-path{
  position:absolute;
  left:270px;
  right:40px;
  top:245px;
  height:170px;
  border-top:4px dashed #a8a8a8;
  border-radius:50%;
}

.bee{
  position:absolute;
  font-size:76px;
  left:300px;
  top:215px;
}

.bee.fly{
  animation:beeMove 5s ease-in-out infinite;
}

@keyframes beeMove{
  0%{
    left:28%;
    top:220px;
    transform:rotate(-8deg);
  }
  25%{
    left:48%;
    top:300px;
    transform:rotate(5deg);
  }
  50%{
    left:75%;
    top:210px;
    transform:rotate(10deg);
  }
  75%{
    left:53%;
    top:150px;
    transform:rotate(-4deg);
  }
  100%{
    left:28%;
    top:220px;
    transform:rotate(-8deg);
  }
}

.sound-text{
  position:absolute;
  left:300px;
  right:30px;
  bottom:40px;
  font-size:32px;
  font-weight:900;
}

/* ---------- YAZI TAHTASI ---------- */

.writing-stage{
  width:min(1000px,94vw);
  height:530px;
  margin:10px auto;
  background:white;
  border:6px solid #57b7db;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

/*
  1. sınıf yazı alanı:
  üst ve alt çizgi düz,
  orta çizgi kesikli.
*/

.school-line{
  position:absolute;
  left:7%;
  width:86%;
}

.school-top{
  top:19%;
  border-top:3px solid #efacd0;
}

.school-middle{
  top:50%;
  border-top:4px dashed #efacd0;
}

.school-bottom{
  top:81%;
  border-top:3px solid #efacd0;
}

svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.guide{
  fill:none;
  stroke:#dedede;
  stroke-width:22;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.draw{
  fill:none;
  stroke:#ef5050;
  stroke-width:17;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.dot{
  fill:#ffd328;
  stroke:#f2a900;
  stroke-width:4;
}

.step{
  font-size:30px;
  font-weight:900;
  fill:#278bc8;
}

/* ---------- MOBİL ---------- */

@media(max-width:800px){

  header{
    height:78px;
    padding:8px 15px;

    grid-template-columns:1fr;

  .menu-card{
    min-height:160px;

  .activity-title{
    font-size:35px;
  }

  .writing-stage{
    height:470px;
  }

  .neti-box{
    width:150px;
    left:10px;
  }

  .aa{
    font-size:110px;
  }

  .sound-text{
    left:170px;
    font-size:25px;
  }
}

</style>

<script>

/* =========================
GENEL
========================= */

let soundEnabled = true;
let running = false;

const sleep = ms =>
  new Promise(resolve =>
    setTimeout(resolve,ms)
  );


function stopAudio(){

  document
  .querySelectorAll("audio")
  .forEach(a=>{

    a.pause();
    a.currentTime=0;

  });

}


function toggleSound(){

  soundEnabled=!soundEnabled;

  document.getElementById(
    "soundToggle"
  ).textContent=
    soundEnabled
    ? "🔊 Ses Açık"
    : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAudio();
  }

}


function openPage(id){

  stopAudio();
  running=false;

  document
  .querySelectorAll(".page")
  .forEach(page=>
    page.classList.remove("active")
  );

  document
  .getElementById(id)
  .classList.add("active");

}


function goHome(){

  stopAudio();
  running=false;

  const bee=
    document.getElementById("bee");

  bee.classList.remove("fly");

  document
  .querySelectorAll(".page")
  .forEach(page=>
    page.classList.remove("active")
  );

  document
  .getElementById("home")
  .classList.add("active");

}


/* =========================
SES
========================= */

function playAndWait(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const audio=
      document.getElementById(id);

    audio.pause();
    audio.currentTime=0;

    audio.onended=()=>{
      resolve();
    };

    audio.onerror=()=>{
      resolve();
    };

    const p=audio.play();

    if(p){
      p.catch(()=>{
        resolve();
      });
    }

  });

}


/*
Safari / iPhone için önemli:

İlk ses doğrudan öğretmenin
butona dokunmasıyla başlıyor.
*/

function startFirstAudio(id){

  const audio=
    document.getElementById(id);

  if(!soundEnabled){
    return Promise.resolve();
  }

  audio.pause();
  audio.currentTime=0;

  return new Promise(resolve=>{

    audio.onended=resolve;
    audio.onerror=resolve;

    const p=audio.play();

    if(p){
      p.catch(resolve);
    }

  });

}


/* =========================
SES TANIMA
========================= */

async function startSoundActivity(){

  if(running)return;

  running=true;
  stopAudio();

  const bee=
    document.getElementById("bee");

  /*
  Kullanıcı butona bastığı anda
  ses başlıyor.
  */

  const firstSound=
    startFirstAudio("introAudio");

  bee.classList.remove("fly");

  void bee.offsetWidth;

  bee.classList.add("fly");

  await firstSound;

  await sleep(5000);

  bee.classList.remove("fly");

  running=false;

}


/* =========================
ÇİZGİ HAZIRLAMA
========================= */

function preparePath(path){

  const length=
    path.getTotalLength();

  path.style.strokeDasharray=
    length;

  path.style.strokeDashoffset=
    length;

}


function resetSmall(){

  preparePath(
    document.getElementById("smallC")
  );

  preparePath(
    document.getElementById("smallLine")
  );

}


function resetBig(){

  preparePath(
    document.getElementById("bigLeft")
  );

  preparePath(
    document.getElementById("bigRight")
  );

  preparePath(
    document.getElementById("bigMiddle")
  );

}


/* =========================
ANİMASYON
========================= */

function drawPath(
  path,
  dot,
  duration
){

  return new Promise(resolve=>{

    const length=
      path.getTotalLength();

    path.style.strokeDasharray=
      length;

    path.style.strokeDashoffset=
      length;

    const start=
      performance.now();


    function animate(now){

      const progress=
        Math.min(
          (now-start)/duration,
          1
        );

      const current=
        length*progress;

      path.style.strokeDashoffset=
        length-current;

      const point=
        path.getPointAtLength(current);

      dot.setAttribute(
        "cx",
        point.x
      );

      dot.setAttribute(
        "cy",
        point.y
      );

      if(progress<1){

        requestAnimationFrame(
          animate
        );

      }else{

        resolve();

      }

    }

    requestAnimationFrame(
      animate
    );

  });

}


/* =========================
KÜÇÜK a
========================= */

async function startSmall(){

  if(running)return;

  running=true;
  stopAudio();
  resetSmall();

  const c=
    document.getElementById("smallC");

  const line=
    document.getElementById("smallLine");

  const dot=
    document.getElementById("smallDot");

  const text=
    document.getElementById("smallText");


  /*
  1. SES
  Buton dokunuşunun içinde
  DOĞRUDAN başlıyor.
  */

  text.textContent=
    "1. Önce c çizgisini çiz. Sarı okları takip et.";

  const firstAudio=
    startFirstAudio("s1");

  await drawPath(
    c,
    dot,
    4200
  );

  await firstAudio;


  /*
  2. SES
  */

  text.textContent=
    "2. Şimdi düz çizgiyi yukarıdan aşağı doğru çiz.";

  const secondAudio=
    playAndWait("s2");

  await drawPath(
    line,
    dot,
    3000
  );

  await secondAudio;


  /*
  TEKRAR
  */

  text.textContent=
    "Harika! Bir kez daha yazalım.";

  await playAndWait("s3");

  resetSmall();

  await drawPath(
    c,
    dot,
    3500
  );

  await drawPath(
    line,
    dot,
    2500
  );


  /*
  BİTİŞ
  */

  text.textContent=
    "✏️ Şimdi sıra sende!";

  await playAndWait("s4");

  running=false;

}


/* =========================
BÜYÜK A
========================= */

async function startBig(){

  if(running)return;

  running=true;
  stopAudio();
  resetBig();

  const left=
    document.getElementById("bigLeft");

  const right=
    document.getElementById("bigRight");

  const middle=
    document.getElementById("bigMiddle");

  const dot=
    document.getElementById("bigDot");

  const text=
    document.getElementById("bigText");


  /*
  1. SOL EĞİK
  */

  text.textContent=
    "1. Yukarıdan başlayıp sol alta doğru eğik çiz.";

  const firstAudio=
    startFirstAudio("b1");

  await drawPath(
    left,
    dot,
    4200
  );

  await firstAudio;


  /*
  2. SAĞ EĞİK
  */

  text.textContent=
    "2. Tekrar yukarıdan başla. Bu kez sağ alta doğru eğik çiz.";

  const secondAudio=
    playAndWait("b2");

  await drawPath(
    right,
    dot,
    4200
  );

  await secondAudio;


  /*
  3. ORTA
  */

  text.textContent=
    "3. Şimdi ortadaki çizgiyi soldan sağa doğru çiz.";

  const thirdAudio=
    playAndWait("b3");

  await drawPath(
    middle,
    dot,
    3200
  );

  await thirdAudio;


  /*
  BİTİŞ
  */

  text.textContent=
    "🌟 Harika! Büyük A harfini tamamladın.";

  await playAndWait("b4");

  running=false;

}
