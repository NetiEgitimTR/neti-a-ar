<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neti Akıllı Tahta | A Sesi</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#effcff,#fff9ea);
  color:#292929;
}

button{
  font-family:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

/* ================= HEADER ================= */

header{
  height:82px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 24px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
  position:relative;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:28px;
  font-weight:900;
  color:#ef7d43;
}

.brand img{
  width:62px;
  height:62px;
  object-fit:contain;
}

#soundToggle{
  border:0;
  border-radius:16px;
  background:#e7f6ff;
  color:#328bc8;
  font-size:20px;
  font-weight:900;
  padding:13px 18px;
}

/* ================= SAYFALAR ================= */

.page{
  display:none;
  min-height:calc(100vh - 82px);
}

.page.active{
  display:block;
}

/* ================= ANA SAYFA ================= */

#home{
  text-align:center;
  padding:25px 20px 45px;
}

#home h1{
  color:#3888c7;
  font-size:44px;
  margin:4px 0;
}

.subtitle{
  font-size:23px;
  color:#666;
  margin:10px 0 20px;
}

.letters{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:15px 0 25px;
}

.letterBox{
  width:120px;
  height:120px;
  background:#fff;
  border:6px solid #ff9c43;
  border-radius:26px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:82px;
  font-weight:900;
  color:#ef7038;
}

.letterBox.small{
  border-color:#58b7dc;
  color:#3888c7;
}

.menu{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.menuCard{
  border:0;
  border-radius:28px;
  min-height:190px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.menuCard:nth-child(1){background:#fff0a5;}
.menuCard:nth-child(2){background:#dff6ff;}
.menuCard:nth-child(3){background:#ffe1ee;}

.menuIcon{
  display:block;
  font-size:54px;
}

.menuTitle{
  display:block;
  font-size:26px;
  font-weight:900;
  margin-top:10px;
}

.menuDesc{
  display:block;
  font-size:17px;
  color:#666;
  margin-top:8px;
}

/* ================= ETKİNLİK ================= */

.activity{
  text-align:center;
  padding:20px 20px 45px;
}

.activityTitle{
  color:#3888c7;
  font-size:40px;
  margin:4px 0 15px;
}

.info{
  font-size:25px;
  line-height:1.25;
  font-weight:900;
  min-height:48px;
  margin:15px auto 10px;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  margin:15px auto 0;
}

.mainBtn{
  border:0;
  border-radius:19px;
  padding:16px 26px;
  min-width:225px;
  background:#65c77c;
  color:#fff;
  font-size:22px;
  font-weight:900;
  box-shadow:0 5px 12px rgba(0,0,0,.10);
}

.repeatBtn{
  background:#ff9e43;
}

.homeBtn{
  background:#4f9fd3;
}

/* =====================================================
   SES / ARI
===================================================== */

.soundStage{
  width:min(1050px,94vw);
  height:540px;
  margin:auto;
  background:#fff;
  border:5px solid #f1d66c;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.soundLetters{
  position:absolute;
  left:0;
  right:0;
  top:18px;
  font-size:125px;
  font-weight:900;
  color:#ef7038;
  z-index:3;
}

.netiWrap{
  position:absolute;
  width:190px;
  left:18px;
  bottom:12px;
  z-index:4;
}

.netiWrap img{
  width:100%;
  display:block;
}

/* ARININ HAREKET ROTASI */

.beeRoute{
  position:absolute;
  left:7%;
  top:26%;
  width:86%;
  height:47%;
  z-index:1;
  pointer-events:none;
}

.beeRoute path{
  fill:none;
  stroke:#aaa;
  stroke-width:4;
  stroke-dasharray:11 11;
  stroke-linecap:round;
}

#bee{
  position:absolute;
  width:72px;
  height:72px;
  left:7%;
  top:31%;
  z-index:5;
  will-change:transform;
  transform:translate3d(0,0,0);
}

#bee img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.eyeText{
  position:absolute;
  left:230px;
  right:20px;
  bottom:22px;
  font-size:27px;
  font-weight:900;
  z-index:4;
}

/* =====================================================
   YAZI ALANI
===================================================== */

.writingStage{
  width:min(1000px,94vw);
  height:540px;
  margin:8px auto;
  background:#fff;
  border:6px solid #58b6da;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.schoolLine{
  position:absolute;
  left:6%;
  width:88%;
  z-index:1;
}

.schoolTop{
  top:20%;
  border-top:3px solid #efa6c9;
}

.schoolMiddle{
  top:50%;
  border-top:4px dashed #efa6c9;
}

.schoolBottom{
  top:80%;
  border-top:3px solid #efa6c9;
}

.letterSvg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

.guide{
  fill:none;
  stroke:#dedede;
  stroke-width:20;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.drawStroke{
  fill:none;
  stroke:#ef5050;
  stroke-width:15;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.yellowDot{
  fill:#ffd328;
  stroke:#efa900;
  stroke-width:4;
}

.stepCircle{
  fill:#36a1d4;
}

.stepNumber{
  fill:#fff;
  font-size:21px;
  font-weight:900;
  text-anchor:middle;
  dominant-baseline:middle;
}

.arrowLine{
  fill:none;
  stroke:#ef5050;
  stroke-width:6;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ================= MOBİL ================= */

@media(max-width:760px){

  header{
    height:72px;
    padding:6px 12px;
  }

  .brand{
    font-size:22px;
  }

  .brand img{
    width:48px;
    height:48px;
  }

  #soundToggle{
    font-size:16px;
    padding:10px 12px;
  }

  .page{
    min-height:calc(100vh - 72px);
  }

  #home{
    padding:18px 12px 35px;
  }

  #home h1{
    font-size:34px;
    line-height:1.08;
  }

  .subtitle{
    font-size:19px;
  }

  .letterBox{
    width:100px;
    height:100px;
    font-size:70px;
  }

  .menu{
    grid-template-columns:1fr;
  }

  .menuCard{
    min-height:145px;
  }

  .activity{
    padding:15px 9px 40px;
  }

  .activityTitle{
    font-size:31px;
    line-height:1.08;
    margin:4px 0 12px;
  }

  .writingStage{
    width:96vw;
    height:470px;
  }

  .info{
    font-size:21px;
    min-height:54px;
    padding:0 8px;
  }

  .controls{
    flex-direction:column;
    width:100%;
  }

  .mainBtn{
    width:min(88vw,430px);
    min-width:0;
    font-size:20px;
  }

  .soundStage{
    width:96vw;
    height:500px;
  }

  .soundLetters{
    font-size:100px;
  }

  .netiWrap{
    width:140px;
    left:8px;
    bottom:12px;
  }

  #bee{
    width:58px;
    height:58px;
  }

  .eyeText{
    left:150px;
    right:8px;
    bottom:22px;
    font-size:19px;
  }
}

</style>
</head>

<script>

let soundEnabled = true;
let running = false;
let beeAnimation = null;

/* ================= SAYFA ================= */

function showPage(id){

  stopEverything();

  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  window.scrollTo(0,0);
}

function goHome(){

  stopEverything();

  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });

  document.getElementById("home").classList.add("active");

  window.scrollTo(0,0);
}

/* ================= SES ================= */

function toggleSound(){

  soundEnabled = !soundEnabled;

  document.getElementById("soundToggle").textContent =
    soundEnabled ? "🔊 Ses Açık" : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }
}

function stopAllAudio(){

  document.querySelectorAll("audio").forEach(audio=>{
    audio.pause();
    audio.currentTime = 0;
  });
}

function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const audio = document.getElementById(id);

    audio.pause();
    audio.currentTime = 0;

    let finished = false;

    function done(){

      if(finished) return;

      finished = true;

      audio.onended = null;
      audio.onerror = null;

      resolve();
    }

    audio.onended = done;
    audio.onerror = done;

    const p = audio.play();

    if(p){
      p.catch(done);
    }

  });
}

/* =====================================================
ARI
===================================================== */

function stopBee(){

  if(beeAnimation){
    beeAnimation.cancel();
    beeAnimation = null;
  }

  const bee = document.getElementById("bee");

  bee.style.transform = "translate3d(0,0,0)";
}

function startBee(){

  stopBee();

  const bee = document.getElementById("bee");
  const stage = document.querySelector(".soundStage");

  const padding = 25;

  const startX = Math.round(stage.clientWidth * 0.07);
  const startY = Math.round(stage.clientHeight * 0.31);

  bee.style.left = startX + "px";
  bee.style.top = startY + "px";

  /*
    Sağ sınır kesinlikle kutunun içinde.
  */

  const usableWidth =
    stage.clientWidth -
    startX -
    bee.offsetWidth -
    padding;

  /*
    Görseldeki gibi soldan başlayan,
    birkaç kıvrım yapan geniş rota.
  */

  beeAnimation = bee.animate(
    [
      {
        transform:
          "translate3d(0px,0px,0px)"
      },

      {
        transform:
          `translate3d(${usableWidth*0.12}px,55px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.20}px,-20px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.29}px,75px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.43}px,45px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.52}px,0px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.61}px,82px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.68}px,22px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.76}px,-12px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.83}px,65px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth}px,30px,0px)`
      },

      /*
        Aynı yol üzerinden yumuşak dönüş.
      */

      {
        transform:
          `translate3d(${usableWidth*0.83}px,65px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.68}px,22px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.52}px,0px,0px)`
      },

      {
        transform:
          `translate3d(${usableWidth*0.29}px,75px,0px)`
      },

      {
        transform:
          "translate3d(0px,0px,0px)"
      }
    ],
    {
      duration:15000,
      iterations:Infinity,
      easing:"ease-in-out"
    }
  );
}

/* ================= DURDUR ================= */

function stopEverything(){

  running = false;

  stopAllAudio();
  stopBee();
}

/* ================= PATH ================= */

function hidePath(path){

  const length = path.getTotalLength();

  path.style.strokeDasharray = length;
  path.style.strokeDashoffset = length;
}

function resetSmall(){

  hidePath(document.getElementById("smallC"));
  hidePath(document.getElementById("smallStraight"));

  const dot = document.getElementById("smallDot");

  dot.setAttribute("cx","505");
  dot.setAttribute("cy","337");
}

function resetBig(){

  hidePath(document.getElementById("bigLeft"));
  hidePath(document.getElementById("bigRight"));
  hidePath(document.getElementById("bigMiddle"));

  const dot = document.getElementById("bigDot");

  dot.setAttribute("cx","450");
  dot.setAttribute("cy","126");
}

/* ================= ÇİZİM ================= */

function animatePath(path,dot,duration){

  return new Promise(resolve=>{

    const length = path.getTotalLength();

    path.style.strokeDasharray = length;
    path.style.strokeDashoffset = length;

    const start = performance.now();

    function frame(now){

      const progress =
        Math.min((now-start)/duration,1);

      const current =
        length * progress;

      path.style.strokeDashoffset =
        length-current;

      const point =
        path.getPointAtLength(current);

      dot.setAttribute("cx",point.x);
      dot.setAttribute("cy",point.y);

      if(progress < 1){
        requestAnimationFrame(frame);
      }else{
        resolve();
      }
    }

    requestAnimationFrame(frame);
  });
}

/* ================= SES + ARI ================= */

async function startSoundActivity(){

  if(running) return;

  running = true;

  stopAllAudio();

  const audioPromise = playAudio("introAudio");

  startBee();

  await audioPromise;

  await new Promise(resolve=>{
    setTimeout(resolve,2500);
  });

  stopBee();

  running = false;
}

}
