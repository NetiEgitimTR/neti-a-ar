<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Neti Akıllı Tahta | A Sesi</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#effcff,#fff9ea);
  color:#292929;
}

button{
  font-family:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

/* =====================================================
HEADER
===================================================== */

header{
  height:82px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 24px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
  position:relative;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:28px;
  font-weight:900;
  color:#ef7d43;
}

.brand img{
  width:62px;
  height:62px;
  object-fit:contain;
}

#soundToggle{
  border:0;
  border-radius:16px;
  background:#e7f6ff;
  color:#328bc8;
  font-size:20px;
  font-weight:900;
  padding:13px 18px;
}

/* =====================================================
SAYFALAR
===================================================== */

.page{
  display:none;
  min-height:calc(100vh - 82px);
}

.page.active{
  display:block;
}

/* =====================================================
ANA SAYFA
===================================================== */

#home{
  text-align:center;
  padding:25px 20px 45px;
}

#home h1{
  color:#3888c7;
  font-size:44px;
  margin:4px 0;
}

.subtitle{
  font-size:23px;
  color:#666;
  margin:10px 0 20px;
}

.letters{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:15px 0 25px;
}

.letterBox{
  width:120px;
  height:120px;
  background:#fff;
  border:6px solid #ff9c43;
  border-radius:26px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:82px;
  font-weight:900;
  color:#ef7038;
}

.letterBox.small{
  border-color:#58b7dc;
  color:#3888c7;
}

.menu{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.menuCard{
  border:0;
  border-radius:28px;
  min-height:190px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.menuCard:nth-child(1){
  background:#fff0a5;
}

.menuCard:nth-child(2){
  background:#dff6ff;
}

.menuCard:nth-child(3){
  background:#ffe1ee;
}

.menuIcon{
  display:block;
  font-size:54px;
}

.menuTitle{
  display:block;
  font-size:26px;
  font-weight:900;
  margin-top:10px;
}

.menuDesc{
  display:block;
  font-size:17px;
  color:#666;
  margin-top:8px;
}

/* =====================================================
ETKİNLİK
===================================================== */

.activity{
  text-align:center;
  padding:20px 20px 45px;
}

.activityTitle{
  color:#3888c7;
  font-size:40px;
  margin:4px 0 15px;
}

.info{
  font-size:25px;
  line-height:1.25;
  font-weight:900;
  min-height:48px;
  margin:15px auto 10px;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  margin:15px auto 0;
}

.mainBtn{
  border:0;
  border-radius:19px;
  padding:16px 26px;
  min-width:225px;
  background:#65c77c;
  color:#fff;
  font-size:22px;
  font-weight:900;
  box-shadow:0 5px 12px rgba(0,0,0,.10);
}

.repeatBtn{
  background:#ff9e43;
}

.homeBtn{
  background:#4f9fd3;
}

/* =====================================================
ARI ALANI
===================================================== */

.soundStage{
  width:min(1050px,94vw);
  height:540px;
  margin:auto;
  background:#fff;
  border:5px solid #f1d66c;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.soundLetters{
  position:absolute;
  left:0;
  right:0;
  top:18px;
  font-size:125px;
  font-weight:900;
  color:#ef7038;
  z-index:3;
}

.netiWrap{
  position:absolute;
  width:190px;
  left:18px;
  bottom:12px;
  z-index:4;
}

.netiWrap img{
  width:100%;
  display:block;
}

.eyeText{
  position:absolute;
  left:230px;
  right:20px;
  bottom:22px;
  font-size:27px;
  font-weight:900;
  z-index:4;
}

/*
ARI ARTIK SVG İÇİNDE HAREKET EDİYOR.
JS KEYFRAME YOK.
DURAKSAMA YOK.
*/

#beeMotionSvg{
  position:absolute;
  left:3%;
  top:20%;
  width:94%;
  height:62%;
  overflow:visible;
  z-index:5;
  pointer-events:none;
}

#beeMovingImage{
  width:74px;
  height:74px;
}

/*
İstersen rota görünür olsun diye
stroke ekleyebiliriz.
Şimdilik göz egzersizinde arı tek başına geziyor.
*/

#beePath{
  fill:none;
  stroke:none;
}

/* =====================================================
YAZI ALANI

ESKİSİ 540px'Tİ.
ŞİMDİ SATIRI BİLEREK KISALTTIK.
===================================================== */

.writingStage{
  width:min(1000px,94vw);

  /* SATIR KÜÇÜLDÜ */
  height:390px;

  margin:8px auto;

  background:#fff;
  border:6px solid #58b6da;
  border-radius:32px;

  position:relative;
  overflow:hidden;

  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

/*
ÇİZGİLERİN KONUMU:

ÜST   %16
ORTA  %50
ALT   %84

Böylece satır sıkı ama dengeli.
*/

.schoolLine{
  position:absolute;
  left:6%;
  width:88%;
  z-index:1;
}

.schoolTop{
  top:16%;
  border-top:3px solid #efa6c9;
}

.schoolMiddle{
  top:50%;
  border-top:4px dashed #efa6c9;
}

.schoolBottom{
  top:84%;
  border-top:3px solid #efa6c9;
}

.letterSvg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

/* =====================================================
HARF KILAVUZU
===================================================== */

.guideOuter{
  fill:none;
  stroke:rgba(120,125,130,.55);
  stroke-width:25;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.guideInner{
  fill:none;
  stroke:rgba(225,227,230,.98);
  stroke-width:17;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.guideDash{
  fill:none;
  stroke:#fff;
  stroke-width:3;
  stroke-dasharray:8 7;
  stroke-linecap:round;
}

.drawStroke{
  fill:none;
  stroke:#ff3030;
  stroke-width:15;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.yellowDot{
  fill:#fff000;
  stroke:#efa900;
  stroke-width:4;
}

.stepCircle{
  fill:#2599d0;
}

.stepNumber{
  fill:#fff;
  font-size:20px;
  font-weight:900;
  text-anchor:middle;
  dominant-baseline:middle;
}

.arrowLine{
  fill:none;
  stroke:#ef5050;
  stroke-width:6;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =====================================================
MOBİL
===================================================== */

@media(max-width:760px){

  header{
    height:72px;
    padding:6px 12px;
  }

  .brand{
    font-size:22px;
  }

  .brand img{
    width:48px;
    height:48px;
  }

  #soundToggle{
    font-size:16px;
    padding:10px 12px;
  }

  .page{
    min-height:calc(100vh - 72px);
  }

  #home{
    padding:18px 12px 35px;
  }

  #home h1{
    font-size:34px;
  }

  .subtitle{
    font-size:19px;
  }

  .letterBox{
    width:100px;
    height:100px;
    font-size:70px;
  }

  .menu{
    grid-template-columns:1fr;
  }

  .menuCard{
    min-height:145px;
  }

  .activity{
    padding:15px 9px 40px;
  }

  .activityTitle{
    font-size:31px;
    line-height:1.08;
  }

  /*
  TELEFONDA DA SATIR ARTIK
  470px DEĞİL 340px.
  */

  .writingStage{
    width:96vw;
    height:340px;
  }

  .soundStage{
    width:96vw;
    height:500px;
  }

  .soundLetters{
    font-size:100px;
  }

  .netiWrap{
    width:140px;
    left:8px;
    bottom:12px;
  }

  .eyeText{
    left:150px;
    right:8px;
    bottom:22px;
    font-size:19px;
  }

  .info{
    font-size:21px;
    min-height:54px;
  }

  .controls{
    flex-direction:column;
  }

  .mainBtn{
    width:min(88vw,430px);
    min-width:0;
    font-size:20px;
  }

}

/* =====================================================
AKILLI TAHTA / GENİŞ EKRAN
===================================================== */

@media(min-width:1000px){

  .writingStage{
    height:430px;
  }

}

</style>
</head>

A / a SESİ
===================================================== -->

<section id="soundPage" class="page activity">

  <h2 class="activityTitle">
    A / a Sesini Tanıyalım

  <div class="soundStage">

    <div class="soundLetters">
      A a
    </div>

    <div class="netiWrap">

      <img
        src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
        alt="Neti"
      >

    </div>

    <!-- =================================================
    ARI

    SVG MOTION PATH.

    ROTA:
    - YUVARLAK
    - SAĞ SOL
    - AŞAĞI YUKARI
    - ÇAPRAZ
    - MERKEZDEN GEÇİŞ
    - TEKRAR YUVARLAK

    keySplines yok.
    Duraksama yok.
    ================================================= -->

    <svg
      id="beeMotionSvg"
      viewBox="0 0 1000 350"
      preserveAspectRatio="xMidYMid meet"
    >

      <path
        id="beePath"
        d="
        M 80 160

        C 80 80,
          180 40,
          250 100

        C 320 160,
          250 230,
          175 210

        C 100 190,
          105 95,
          185 85

        C 310 70,
          430 260,
          540 170

        C 650 80,
          760 70,
          870 155

        C 790 245,
          680 255,
          620 185

        C 565 120,
          640 70,
          715 105

        C 790 140,
          760 225,
          680 225

        C 550 225,
          470 70,
          355 105

        C 255 135,
          330 260,
          450 245

        C 585 225,
          530 80,
          420 65

        C 300 45,
          260 170,
          345 195

        C 455 230,
          550 110,
          665 145

        C 770 180,
          855 95,
          900 65

        C 920 155,
          870 250,
          775 260

        C 650 275,
          610 155,
          500 165

        C 390 175,
          325 300,
          205 260

        C 90 220,
          50 180,
          80 160
        "
      />

      <image
        id="beeMovingImage"
        href="./831FD224-0476-409E-B2D5-24D2A8AD424E.png"
        x="-37"
        y="-37"
        width="74"
        height="74"
      >

        <animateMotion
          id="beeMotion"
          dur="16s"
          repeatCount="indefinite"
          rotate="auto"
          calcMode="paced"
          begin="indefinite"
        >

          <mpath href="#beePath"/>

        </animateMotion>

      </image>

    </svg>

    <div class="eyeText">
      👀 Gözlerinle arıyı takip et!
    </div>

  </div>

  <div class="controls">

    <button
      class="mainBtn"
      onclick="startSoundActivity()"
    >
      🔊 Neti ile Başla
    </button>

    <button
      class="mainBtn homeBtn"
      onclick="goHome()"
    >
      🏠 Ana Sayfa
    </button>

  </div>

</section>

<script>

let soundEnabled=true;
let running=false;

/* =====================================================
SAYFALAR
===================================================== */

function showPage(id){

  stopEverything();

  document
  .querySelectorAll(".page")
  .forEach(page=>{
    page.classList.remove("active");
  });

  document
  .getElementById(id)
  .classList.add("active");

  window.scrollTo(0,0);
}

function goHome(){

  stopEverything();

  document
  .querySelectorAll(".page")
  .forEach(page=>{
    page.classList.remove("active");
  });

  document
  .getElementById("home")
  .classList.add("active");

  window.scrollTo(0,0);
}

/* =====================================================
SES
===================================================== */

function toggleSound(){

  soundEnabled=!soundEnabled;

  document
  .getElementById("soundToggle")
  .textContent=
  soundEnabled
  ? "🔊 Ses Açık"
  : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }
}

function stopAllAudio(){

  document
  .querySelectorAll("audio")
  .forEach(audio=>{

    try{
      audio.pause();
      audio.currentTime=0;
    }catch(e){}

  });
}

function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const audio=
    document.getElementById(id);

    audio.pause();
    audio.currentTime=0;

    let finished=false;

    function done(){

      if(finished) return;

      finished=true;

      audio.onended=null;
      audio.onerror=null;

      resolve();
    }

    audio.onended=done;
    audio.onerror=done;

    const result=audio.play();

    if(result){
      result.catch(done);
    }

  });
}

/* =====================================================
ARI

SVG animateMotion olduğu için hareket
noktalarda duraklamıyor.
===================================================== */

function startBee(){

  const motion=
  document.getElementById("beeMotion");

  try{
    motion.beginElement();
  }catch(e){}
}

function stopBee(){

  const svg=
  document.getElementById("beeMotionSvg");

  if(!svg) return;

  try{
    svg.pauseAnimations();
    svg.setCurrentTime(0);
  }catch(e){}
}

function resumeBee(){

  const svg=
  document.getElementById("beeMotionSvg");

  if(!svg) return;

  try{
    svg.unpauseAnimations();
  }catch(e){}
}

/* =====================================================
DURDUR
===================================================== */

function stopEverything(){

  running=false;

  stopAllAudio();
  stopBee();
}

/* =====================================================
PATH
===================================================== */

function hidePath(path){

  const length=
  path.getTotalLength();

  path.style.strokeDasharray=length;
  path.style.strokeDashoffset=length;
}

function resetSmall(){

  hidePath(
    document.getElementById("smallC")
  );

  hidePath(
    document.getElementById("smallStraight")
  );

  const dot=
  document.getElementById("smallDot");

  dot.setAttribute("cx","515");
  dot.setAttribute("cy","320");
}

function resetBig(){

  hidePath(
    document.getElementById("bigLeft")
  );

  hidePath(
    document.getElementById("bigRight")
  );

  hidePath(
    document.getElementById("bigMiddle")
  );

  const dot=
  document.getElementById("bigDot");

  dot.setAttribute("cx","450");
  dot.setAttribute("cy","130");
}

/* =====================================================
ÇİZİM
===================================================== */

function animatePath(path,dot,duration){

  return new Promise(resolve=>{

    const length=
    path.getTotalLength();

    path.style.strokeDasharray=length;
    path.style.strokeDashoffset=length;

    const start=
    performance.now();

    function frame(now){

      const progress=
      Math.min(
        (now-start)/duration,
        1
      );

      const current=
      length*progress;

      path.style.strokeDashoffset=
      length-current;

      const point=
      path.getPointAtLength(current);

      dot.setAttribute(
        "cx",
        point.x
      );

      dot.setAttribute(
        "cy",
        point.y
      );

      if(progress<1){

        requestAnimationFrame(frame);

      }else{

        resolve();

      }
    }

    requestAnimationFrame(frame);

  });
}

/* =====================================================
SES + ARI
===================================================== */

async function startSoundActivity(){

  if(running) return;

  running=true;

  stopAllAudio();

  /*
  SVG'yi sıfırla.
  */

  const svg=
  document.getElementById("beeMotionSvg");

  try{
    svg.setCurrentTime(0);
    svg.unpauseAnimations();
  }catch(e){}

  startBee();

  /*
  Ses kullanıcı tıklamasıyla
  doğrudan başlıyor.
  */

  await playAudio("introAudio");

  /*
  Arı ses bittikten sonra da
  biraz daha devam etsin.
  */

  await new Promise(resolve=>{
    setTimeout(resolve,3500);
  });

  stopBee();

  running=false;
}

/* =====================================================
KÜÇÜK a
===================================================== */

async function startSmall(){

  if(running) return;

  running=true;

  stopAllAudio();
  resetSmall();

  const c=
  document.getElementById("smallC");

  const straight=
  document.getElementById("smallStraight");

  const dot=
  document.getElementById("smallDot");

  const info=
  document.getElementById("smallInfo");

  info.textContent=
  "1️⃣ Önce c çizgisini çiz. Sarı okları takip et.";

  await Promise.all([

    playAudio("small1"),

    animatePath(
      c,
      dot,
      4200
    )

  ]);

  info.textContent=
  "2️⃣ Şimdi düz çizgiyi yukarıdan aşağı doğru çiz.";

  dot.setAttribute("cx","515");
  dot.setAttribute("cy","305");

  await Promise.all([

    playAudio("small2"),

    animatePath(
      straight,
      dot,
      3000
    )

  ]);

  info.textContent=
  "🌟 Harika! Bir kez daha yazalım.";

  await playAudio("small3");

  resetSmall();

  await animatePath(
    c,
    dot,
    3500
  );

  dot.setAttribute("cx","515");
  dot.setAttribute("cy","305");

  await animatePath(
    straight,
    dot,
    2500
  );

  info.textContent=
  "✏️ Şimdi sıra sende!";

  await playAudio("small4");

  running=false;
}

/* =====================================================
BÜYÜK A
===================================================== */

async function startBig(){

  if(running) return;

  running=true;

  stopAllAudio();
  resetBig();

  const left=
  document.getElementById("bigLeft");

  const right=
  document.getElementById("bigRight");

  const middle=
  document.getElementById("bigMiddle");

  const dot=
  document.getElementById("bigDot");

  const info=
  document.getElementById("bigInfo");

  info.textContent=
  "1️⃣ Yukarıdan başlayıp sol alta doğru eğik çiz.";

  await Promise.all([

    playAudio("big1"),

    animatePath(
      left,
      dot,
      4200
    )

  ]);

  dot.setAttribute("cx","450");
  dot.setAttribute("cy","130");

  info.textContent=
  "2️⃣ Tekrar yukarıdan başla. Bu kez sağ alta doğru eğik çiz.";

  await Promise.all([

    playAudio("big2"),

    animatePath(
      right,
      dot,
      4200
    )

  ]);

  dot.setAttribute("cx","350");
  dot.setAttribute("cy","270");

  info.textContent=
  "3️⃣ Şimdi ortadaki çizgiyi soldan sağa doğru çiz.";

  await Promise.all([

    playAudio("big3"),

    animatePath(
      middle,
      dot,
      3200
    )

  ]);

  info.textContent=
  "🌟 Harika! Büyük A harfini de tamamladın. Şimdi sıra sende!";

  await playAudio("big4");

  running=false;
}

/* =====================================================
AÇILIŞ
===================================================== */

window.addEventListener(
  "load",
  ()=>{

    resetSmall();
    resetBig();

    document
    .querySelectorAll("audio")
    .forEach(audio=>{
      audio.load();
    });

    /*
    Sayfa açılır açılmaz arı başlamasın.
    */

    stopBee();

  }
);

</script>
