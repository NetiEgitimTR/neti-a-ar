<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Neti Akıllı Tahta | A Sesi</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#effcff,#fff9ea);
  color:#292929;
}

button{
  font-family:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

/* =====================================================
HEADER
===================================================== */

header{
  height:82px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 24px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
  position:relative;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:28px;
  font-weight:900;
  color:#ef7d43;
}

.brand img{
  width:62px;
  height:62px;
  object-fit:contain;
}

#soundToggle{
  border:0;
  border-radius:16px;
  background:#e7f6ff;
  color:#328bc8;
  font-size:20px;
  font-weight:900;
  padding:13px 18px;
}

/* =====================================================
SAYFALAR
===================================================== */

.page{
  display:none;
  min-height:calc(100vh - 82px);
}

.page.active{
  display:block;
}

/* =====================================================
ANA SAYFA
===================================================== */

#home{
  text-align:center;
  padding:25px 20px 45px;
}

#home h1{
  color:#3888c7;
  font-size:44px;
  margin:4px 0;
}

.subtitle{
  font-size:23px;
  color:#666;
  margin:10px 0 20px;
}

.letters{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:15px 0 25px;
}

.letterBox{
  width:120px;
  height:120px;
  background:#fff;
  border:6px solid #ff9c43;
  border-radius:26px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:82px;
  font-weight:900;
  color:#ef7038;
}

.letterBox.small{
  border-color:#58b7dc;
  color:#3888c7;
}

.menu{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.menuCard{
  border:0;
  border-radius:28px;
  min-height:190px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.menuCard:nth-child(1){
  background:#fff0a5;
}

.menuCard:nth-child(2){
  background:#dff6ff;
}

.menuCard:nth-child(3){
  background:#ffe1ee;
}

.menuIcon{
  display:block;
  font-size:54px;
}

.menuTitle{
  display:block;
  font-size:26px;
  font-weight:900;
  margin-top:10px;
}

.menuDesc{
  display:block;
  font-size:17px;
  color:#666;
  margin-top:8px;
}

/* =====================================================
ETKİNLİK
===================================================== */

.activity{
  text-align:center;
  padding:20px 20px 45px;
}

.activityTitle{
  color:#3888c7;
  font-size:40px;
  margin:4px 0 15px;
}

.info{
  font-size:25px;
  line-height:1.25;
  font-weight:900;
  min-height:48px;
  margin:15px auto 10px;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  margin:15px auto 0;
}

.mainBtn{
  border:0;
  border-radius:19px;
  padding:16px 26px;
  min-width:225px;
  background:#65c77c;
  color:#fff;
  font-size:22px;
  font-weight:900;
  box-shadow:0 5px 12px rgba(0,0,0,.10);
}

.repeatBtn{
  background:#ff9e43;
}

.homeBtn{
  background:#4f9fd3;
}

/* =====================================================
ARI ALANI
===================================================== */

.soundStage{
  width:min(1050px,94vw);
  height:540px;
  margin:auto;
  background:#fff;
  border:5px solid #f1d66c;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.soundLetters{
  position:absolute;
  left:0;
  right:0;
  top:18px;
  font-size:125px;
  font-weight:900;
  color:#ef7038;
  z-index:3;
}

.netiWrap{
  position:absolute;
  width:190px;
  left:18px;
  bottom:12px;
  z-index:4;
}

.netiWrap img{
  width:100%;
  display:block;
}

/* ARI */

#bee{
  position:absolute;
  width:72px;
  height:72px;

  left:90px;
  top:170px;

  z-index:6;

  will-change:transform;
}

#bee img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ARININ GÖZ EGZERSİZİ ROTASI */

.beeRoute{
  position:absolute;
  left:8%;
  top:25%;
  width:84%;
  height:48%;
  z-index:1;
  pointer-events:none;
}

.beeRoute polyline{
  fill:none;
  stroke:#aaa;
  stroke-width:4;
  stroke-dasharray:11 11;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.eyeText{
  position:absolute;
  left:230px;
  right:20px;
  bottom:22px;
  font-size:27px;
  font-weight:900;
  z-index:4;
}

/* =====================================================
YAZI ALANI
===================================================== */

.writingStage{
  width:min(1000px,94vw);
  height:540px;
  margin:8px auto;

  background:#fff;

  border:6px solid #58b6da;
  border-radius:32px;

  position:relative;
  overflow:hidden;

  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.schoolLine{
  position:absolute;
  left:6%;
  width:88%;
  z-index:1;
}

.schoolTop{
  top:20%;
  border-top:3px solid #efa6c9;
}

.schoolMiddle{
  top:50%;
  border-top:4px dashed #efa6c9;
}

.schoolBottom{
  top:80%;
  border-top:3px solid #efa6c9;
}

.letterSvg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

/* ÇALIŞAN AR'DEKİ GÖRÜNÜME YAKIN KILAVUZ */

.guideOuter{
  fill:none;
  stroke:rgba(120,125,130,.55);
  stroke-width:26;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.guideInner{
  fill:none;
  stroke:rgba(225,227,230,.98);
  stroke-width:18;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.guideDash{
  fill:none;
  stroke:white;
  stroke-width:3;
  stroke-dasharray:8 7;
  stroke-linecap:round;
}

.drawStroke{
  fill:none;
  stroke:#ff3030;
  stroke-width:16;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.drawDash{
  fill:none;
  stroke:white;
  stroke-width:3;
  stroke-dasharray:8 7;
}

.yellowDot{
  fill:#fff000;
  stroke:#efa900;
  stroke-width:4;
}

.stepCircle{
  fill:#2599d0;
}

.stepNumber{
  fill:white;
  font-size:20px;
  font-weight:900;
  text-anchor:middle;
  dominant-baseline:middle;
}

.arrowLine{
  fill:none;
  stroke:#ef5050;
  stroke-width:6;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =====================================================
MOBİL
===================================================== */

@media(max-width:760px){

  header{
    height:72px;
    padding:6px 12px;
  }

  .brand{
    font-size:22px;
  }

  .brand img{
    width:48px;
    height:48px;
  }

  #soundToggle{
    font-size:16px;
    padding:10px 12px;
  }

  .page{
    min-height:calc(100vh - 72px);
  }

  #home{
    padding:18px 12px 35px;
  }

  #home h1{
    font-size:34px;
  }

  .subtitle{
    font-size:19px;
  }

  .letterBox{
    width:100px;
    height:100px;
    font-size:70px;
  }

  .menu{
    grid-template-columns:1fr;
  }

  .menuCard{
    min-height:145px;
  }

  .activity{
    padding:15px 9px 40px;
  }

  .activityTitle{
    font-size:31px;
    line-height:1.08;
  }

  .writingStage{
    width:96vw;
    height:470px;
  }

  .soundStage{
    width:96vw;
    height:500px;
  }

  .soundLetters{
    font-size:100px;
  }

  .netiWrap{
    width:140px;
    left:8px;
    bottom:12px;
  }

  #bee{
    width:58px;
    height:58px;
  }

  .eyeText{
    left:150px;
    right:8px;
    bottom:22px;
    font-size:19px;
  }

  .info{
    font-size:21px;
    min-height:54px;
  }

  .controls{
    flex-direction:column;
  }

  .mainBtn{
    width:min(88vw,430px);
    min-width:0;
    font-size:20px;
  }
}

</style>
</head>

<body>

<header>

  <div class="brand">

    <img
      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
      alt="Neti"
    >

    <span>NETİ</span>

  </div>

  <button
    id="soundToggle"
    onclick="toggleSound()"
  >
    🔊 Ses Açık
  </button>

</header>

<!-- =====================================================
ANA SAYFA
===================================================== -->

<section
  id="home"
  class="page active"
>

  <h1>
    Neti ile A Sesini Öğreniyorum
  </h1>

  <div class="subtitle">
    Akıllı Tahta Etkinlikleri
  </div>

  <div class="letters">

    <div class="letterBox">
      A
    </div>

    <div class="letterBox small">
      a
    </div>

  </div>

  <div class="menu">

    <button
      class="menuCard"
      onclick="showPage('soundPage')"
    >

      <span class="menuIcon">
        🔤
      </span>

      <span class="menuTitle">
        A / a Sesini Tanıyalım
      </span>

      <span class="menuDesc">
        Sesi dinle • Harfi tanı • Gözlerini çalıştır
      </span>

    </button>

    <button
      class="menuCard"
      onclick="showPage('smallPage')"
    >

      <span class="menuIcon">

      </span>

      <span class="menuTitle">
        Küçük a Yazımı

      <span class="menuDesc">
        Önce c çizgisi • Sonra düz çizgi
      </span>

    </button>

    <button
      class="menuCard"
      onclick="showPage('bigPage')"
    >

      <span class="menuIcon">
        ✏️
      </span>

      <span class="menuTitle">
        Büyük A Yazımı
      </span>

      <span class="menuDesc">
        Sol eğik • Sağ eğik • Orta çizgi
      </span>

    </button>

  </div>

</section>

<!-- =====================================================
A / a SESİ + ARI
===================================================== -->

<section
  id="soundPage"
  class="page activity"
>

  <h2 class="activityTitle">
    A / a Sesini Tanıyalım
  </h2>

  <div
    class="soundStage"
    id="soundStage"
  >

    <div class="soundLetters">
      A a
    </div>

    <!--
    ARI ROTASI:
    KENARDA DÖNMÜYOR.
    ORTADAN ÇAPRAZ GEÇİYOR.
    -->

    <svg
      class="beeRoute"
      viewBox="0 0 900 300"
      preserveAspectRatio="none"
    >

      <polyline
        points="
        30,65
        430,150
        820,255
        560,35
        100,245
        825,145
        450,150
        790,45
        460,265
        70,145
        430,80
        710,230
        280,190
        30,65
        "
      />

    </svg>

    <div class="netiWrap">

      <img
        src="./72509361-9673-4AB6-8739-B7646C5522E4.png"

    </div>

    <div id="bee">

      <img

    </div>

    <div class="eyeText">
      👀 Gözlerinle arıyı takip et!
    </div>

  </div>

  <div class="controls">

    <button
      class="mainBtn"
      onclick="startSoundActivity()"
    >
      🔊 Neti ile Başla
    </button>

    <button
      class="mainBtn homeBtn"
      onclick="goHome()"
    >
      🏠 Ana Sayfa
    </button>

  </div>

</section>

<!-- =====================================================
KÜÇÜK a
===================================================== -->

    <svg

      - kesik çizginin altında

      - AR'deki yuvarlak C geometrisini kullanıyor
      -->

      <!-- DIŞ GRİ C -->

      <path
        class="guideOuter"
        d="
        M 515 320

        C 490 295,
          445 294,
          412 310

        C 370 330,
          355 372,
          370 404

        C 388 441,
          445 447,
          486 422

        C 504 411,
          514 396,
          515 382
        "
      />

      <!-- DIŞ GRİ DİK -->

      <path
        class="guideOuter"
        d="
        M 515 305
        L 515 419
        "
      />

      <!-- İÇ AÇIK GRİ C -->

      <path
        class="guideInner"
        d="
        M 515 320

        C 490 295,
          445 294,
          412 310

        C 370 330,
          355 372,
          370 404

        C 388 441,
          445 447,
          486 422

        C 504 411,
          514 396,
          515 382
        "
      />

      <!-- İÇ AÇIK GRİ DİK -->

      <path
        class="guideInner"
        d="
        M 515 305
        L 515 419
        "
      />

      <!-- BEYAZ KESİKLİ MERKEZ -->

      <path
        class="guideDash"
        d="
        M 515 320

        C 490 295,
          445 294,
          412 310

        C 370 330,
          355 372,
          370 404

        C 388 441,
          445 447,
          486 422

        C 504 411,
          514 396,
          515 382
        "
      />

      <path
        class="guideDash"
        d="
        M 515 305
        L 515 419
        "
      />

      <!-- ANİMASYON C -->

      <path
        id="smallC"
        class="drawStroke"
        d="
        M 515 320

        C 490 295,
          445 294,
          412 310

        C 370 330,
          355 372,
          370 404

        C 388 441,
          445 447,
          486 422

        C 504 411,
          514 396,
          515 382
        "
      />

      <!-- ANİMASYON DİK -->

      <path
        id="smallStraight"

        M 515 305

        "

      <!-- NUMARALAR -->

      <text

      <path
        class="arrowLine"

        M 500 304

        "

      <path
        class="arrowLine"
        d="
        M 393 315

        M 393 315
        L 414 309
        "
      />

        class="arrowLine"

        "
      />

      <path
        class="arrowLine"

<script>

let soundEnabled=true;
let running=false;

let beeAnimation=null;

/* =====================================================
SAYFALAR
===================================================== */

function showPage(id){

  stopEverything();

  document
  .querySelectorAll(".page")
  .forEach(page=>{
    page.classList.remove("active");
  });

  document
  .getElementById(id)
  .classList.add("active");

  window.scrollTo(0,0);
}

function goHome(){

  stopEverything();

  document
  .querySelectorAll(".page")
  .forEach(page=>{
    page.classList.remove("active");
  });

  document
  .getElementById("home")
  .classList.add("active");

  window.scrollTo(0,0);
}

/* =====================================================
SES
===================================================== */

function toggleSound(){

  soundEnabled=!soundEnabled;

  document
  .getElementById("soundToggle")
  .textContent=
  soundEnabled
  ? "🔊 Ses Açık"
  : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }
}

function stopAllAudio(){

  document
  .querySelectorAll("audio")
  .forEach(audio=>{

    try{
      audio.pause();
      audio.currentTime=0;
    }catch(e){}

  });
}

function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const audio=
    document.getElementById(id);

    audio.pause();
    audio.currentTime=0;

    let done=false;

    function finish(){

      if(done) return;

      done=true;

      audio.onended=null;
      audio.onerror=null;

      resolve();
    }

    audio.onended=finish;
    audio.onerror=finish;

    const result=audio.play();

    if(result){
      result.catch(finish);
    }

  });
}

/* =====================================================
ARI

ÖNEMLİ:
BU KEZ ARI ÇEMBER ÇİZMİYOR.

ALANIN İÇİNDEN ÇAPRAZ,
YUKARI-AŞAĞI,
SAĞ-SOL VE MERKEZDEN GEÇİYOR.
===================================================== */

function stopBee(){

  if(beeAnimation){

    beeAnimation.cancel();
    beeAnimation=null;

  }

  const bee=
  document.getElementById("bee");

  if(bee){
    bee.style.transform=
    "translate3d(0,0,0)";
  }
}

function startBee(){

  stopBee();

  const bee=
  document.getElementById("bee");

  const stage=
  document.getElementById("soundStage");

  /*
  BAŞLANGIÇ:
  SOL ÜST TARAF
  */

  const margin=28;

  const startX=margin;

  const startY=
  Math.round(
    stage.clientHeight*0.30
  );

  bee.style.left=startX+"px";
  bee.style.top=startY+"px";

  /*
  GÜVENLİ HAREKET ALANI
  */

  const maxX=
  stage.clientWidth
  -bee.offsetWidth
  -margin
  -startX;

  const topY=
  margin-startY;

  const bottomAbsolute=
  stage.clientHeight
  -bee.offsetHeight
  -90;

  const bottomY=
  bottomAbsolute-startY;

  const centerY=
  (
    stage.clientHeight/2
    -bee.offsetHeight/2
  )
  -startY;

  /*
  KARIŞIK GÖZ EGZERSİZİ

  1 sol üst
  2 merkez
  3 sağ alt
  4 orta üst
  5 sol alt
  6 sağ orta
  7 merkez
  8 sağ üst
  9 orta alt
  10 sol orta
  11 merkez üst
  12 sağ alt
  13 merkez
  14 başlangıç
  */

  const frames=[

    {
      transform:
      "translate3d(0px,0px,0px)"
    },

    /* MERKEZ */

    {
      transform:
      `translate3d(
        ${maxX*0.50}px,
        ${centerY}px,
        0px
      )`
    },

    /* SAĞ ALT */

    {
      transform:
      `translate3d(
        ${maxX*0.95}px,
        ${bottomY}px,
        0px
      )`
    },

    /* ORTA ÜST */

    {
      transform:
      `translate3d(
        ${maxX*0.55}px,
        ${topY}px,
        0px
      )`
    },

    /* SOL ALT */

    {
      transform:
      `translate3d(
        ${maxX*0.08}px,
        ${bottomY*0.90}px,
        0px
      )`
    },

    /* SAĞ ORTA */

    {
      transform:
      `translate3d(
        ${maxX*0.95}px,
        ${centerY*0.70}px,
        0px
      )`
    },

    /* TAM MERKEZ */

    {
      transform:
      `translate3d(
        ${maxX*0.50}px,
        ${centerY}px,
        0px
      )`
    },

    /* SAĞ ÜST */

    {
      transform:
      `translate3d(
        ${maxX*0.90}px,
        ${topY*0.75}px,
        0px
      )`
    },

    /* ORTA ALT */

    {
      transform:
      `translate3d(
        ${maxX*0.48}px,
        ${bottomY}px,
        0px
      )`
    },

    /* SOL ORTA */

    {
      transform:
      `translate3d(
        ${maxX*0.08}px,
        ${centerY*0.65}px,
        0px
      )`
    },

    /* MERKEZ ÜST */

    {
      transform:
      `translate3d(
        ${maxX*0.45}px,
        ${topY*0.85}px,
        0px
      )`
    },

    /* SAĞ ALT TEKRAR */

    {
      transform:
      `translate3d(
        ${maxX*0.88}px,
        ${bottomY*0.82}px,
        0px
      )`
    },

    /* MERKEZ */

    {
      transform:
      `translate3d(
        ${maxX*0.50}px,
        ${centerY}px,
        0px
      )`
    },

    /* SOLA DÖN */

    {
      transform:
      "translate3d(0px,0px,0px)"
    }

  ];

  beeAnimation=
  bee.animate(
    frames,
    {
      duration:18000,
      iterations:Infinity,
      easing:"ease-in-out"
    }
  );
}

/* =====================================================
DURDUR
===================================================== */

function stopEverything(){

  running=false;

  stopAllAudio();
  stopBee();
}

/* =====================================================
PATH
===================================================== */

function hidePath(path){

  const length=
  path.getTotalLength();

  path.style.strokeDasharray=
  length;

  path.style.strokeDashoffset=
  length;
}

/* =====================================================
KÜÇÜK a RESET
===================================================== */

function resetSmall(){

  hidePath(
    document.getElementById("smallC")
  );

  hidePath(
    document.getElementById(
      "smallStraight"
    )
  );

  const dot=
  document.getElementById("smallDot");

  dot.setAttribute("cx","515");
  dot.setAttribute("cy","320");
}

/* =====================================================
BÜYÜK A RESET
===================================================== */

function resetBig(){

  hidePath(
    document.getElementById("bigLeft")
  );

  hidePath(
    document.getElementById("bigRight")
  );

  hidePath(
    document.getElementById("bigMiddle")
  );

  const dot=
  document.getElementById("bigDot");

  dot.setAttribute("cx","450");
  dot.setAttribute("cy","130");
}

/* =====================================================
PATH ANİMASYONU
===================================================== */

function animatePath(
  path,
  dot,
  duration
){

  return new Promise(resolve=>{

    const length=
    path.getTotalLength();

    path.style.strokeDasharray=
    length;

    path.style.strokeDashoffset=
    length;

    const start=
    performance.now();

    function frame(now){

      const progress=
      Math.min(
        (now-start)/duration,
        1
      );

      const current=
      length*progress;

      path.style.strokeDashoffset=
      length-current;

      const point=
      path.getPointAtLength(current);

      dot.setAttribute(
        "cx",
        point.x
      );

      dot.setAttribute(
        "cy",
        point.y
      );

      if(progress<1){

        requestAnimationFrame(frame);

      }else{

        resolve();

      }
    }

    requestAnimationFrame(frame);

  });
}

/* =====================================================
SES + ARI
===================================================== */

async function startSoundActivity(){

  if(running) return;

  running=true;

  stopAllAudio();

  /*
  Kullanıcı butona bastığı anda
  ses doğrudan başlıyor.
  */

  const audioPromise=
  playAudio("introAudio");

  startBee();

  await audioPromise;

  /*
  Ses bitince arı biraz daha devam etsin.
  */

  await new Promise(resolve=>{
    setTimeout(resolve,3000);
  });

  stopBee();

  running=false;
}

/* =====================================================
KÜÇÜK a
===================================================== */

async function startSmall(){

  if(running) return;

  running=true;

  stopAllAudio();
  resetSmall();

  const c=
  document.getElementById("smallC");

  const straight=
  document.getElementById(
    "smallStraight"
  );

  const dot=
  document.getElementById("smallDot");

  const info=
  document.getElementById("smallInfo");

  /* 1 - C */

  info.textContent=
  "1️⃣ Önce c çizgisini çiz. Sarı okları takip et.";

  await Promise.all([

    playAudio("small1"),

    animatePath(
      c,
      dot,
      4200
    )

  ]);

  /* 2 - DİK */

  info.textContent=
  "2️⃣ Şimdi düz çizgiyi yukarıdan aşağı doğru çiz.";

  dot.setAttribute(
    "cx",
    "515"
  );

  dot.setAttribute(
    "cy",
    "305"
  );

  await Promise.all([

    playAudio("small2"),

    animatePath(
      straight,
      dot,
      3000
    )

  ]);

  /* TEKRAR */

  info.textContent=
  "🌟 Harika! Bir kez daha yazalım.";

  await playAudio("small3");

  resetSmall();

  await animatePath(
    c,
    dot,
    3500
  );

  dot.setAttribute(
    "cx",
    "515"
  );

  dot.setAttribute(
    "cy",
    "305"
  );

  await animatePath(
    straight,
    dot,
    2500
  );

  /* BİTİŞ */

  info.textContent=
  "✏️ Şimdi sıra sende!";

  await playAudio("small4");

  running=false;
}

/* =====================================================
BÜYÜK A
===================================================== */

async function startBig(){

  if(running) return;

  running=true;

  stopAllAudio();
  resetBig();

  const left=
  document.getElementById("bigLeft");

  const right=
  document.getElementById("bigRight");

  const middle=
  document.getElementById("bigMiddle");

  document.getElementById("bigDot");

  document.getElementById("bigInfo");

  /* BİTİŞ */

  info.textContent=

  await playAudio("big4");

}
