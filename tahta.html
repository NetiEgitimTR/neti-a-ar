<script>

/* =====================================================
GENEL
===================================================== */

let soundEnabled=true;
let running=false;

let beeFrame=null;
let beeStartTimer=null;
let beeStopTimer=null;


/* =====================================================
SAYFALAR
===================================================== */

function showPage(id){

  stopEverything();

  document
    .querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}

function goHome(){

  stopEverything();

  document
    .querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

  document
    .getElementById("home")
    .classList.add("active");

  window.scrollTo(0,0);
}


/* =====================================================
SES
===================================================== */

function toggleSound(){

  soundEnabled=!soundEnabled;

  document
    .getElementById("soundToggle")
    .textContent=
      soundEnabled
      ? "🔊 Ses Açık"
      : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }
}

function stopAllAudio(){

  document
    .querySelectorAll("audio")
    .forEach(a=>{

      try{
        a.pause();
        a.currentTime=0;
      }catch(e){}

    });
}

function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const a=
      document.getElementById(id);

    a.pause();
    a.currentTime=0;

    let done=false;

    function finish(){

      if(done)return;

      done=true;

      a.onended=null;
      a.onerror=null;

      resolve();
    }

    a.onended=finish;
    a.onerror=finish;

    const p=a.play();

    if(p){
      p.catch(finish);
    }

  });
}


/* =====================================================
ARI

Burada keyframe noktaları yok.

Tek sürekli matematiksel hareket var.
Bu yüzden:
- noktalarda durmuyor
- birden hızlanmıyor
- yumuşak dönüyor
===================================================== */

function hideBee(){

  clearTimeout(beeStartTimer);
  clearTimeout(beeStopTimer);

  if(beeFrame){
    cancelAnimationFrame(beeFrame);
    beeFrame=null;
  }

  const bee=
    document.getElementById("bee");

  bee.style.opacity="0";
  bee.style.visibility="hidden";
  bee.style.transform="translate3d(0,0,0)";
}


function startBee(){

  const bee=
    document.getElementById("bee");

  const stage=
    document.getElementById("soundStage");

  bee.style.opacity="1";
  bee.style.visibility="visible";

  const stageW=stage.clientWidth;
  const stageH=stage.clientHeight;

  const beeW=bee.offsetWidth;
  const beeH=bee.offsetHeight;

  /*
  Arının kullanacağı güvenli alan
  */

  const centerX=stageW*0.48;
  const centerY=stageH*0.48;

  const radiusX=
    Math.max(
      100,
      stageW*0.30
    );

  const radiusY=
    Math.max(
      80,
      stageH*0.24
    );

  /*
  ÇOK DAHA YAVAŞ.

  1 tam karma hareket:
  24 saniye.
  */

  const duration=24000;

  const start=
    performance.now();


  function frame(now){

    const t=
      (now-start)/duration;

    /*
    İki farklı sinüs frekansı.

    Sonuç:
    yuvarlak +
    sağ-sol +
    yukarı-aşağı +
    çapraz geçiş.
    */

    const angle=
      t*Math.PI*2;

    const x=
      centerX
      + radiusX*Math.sin(angle)
      + radiusX*0.22*Math.sin(angle*3);

    const y=
      centerY
      + radiusY*Math.cos(angle*2)
      + radiusY*0.24*Math.sin(angle*3);


    /*
    bee'nin CSS başlangıç noktasına göre
    transform hesaplanıyor.
    */

    const baseLeft=
      bee.offsetLeft;

    const baseTop=
      bee.offsetTop;

    let tx=
      x-baseLeft-beeW/2;

    let ty=
      y-baseTop-beeH/2;


    /*
    Kutudan çıkmasını engelle.
    */

    const actualX=
      baseLeft+tx;

    const actualY=
      baseTop+ty;

    if(actualX<10)
      tx+=10-actualX;

    if(actualX+beeW>stageW-10)
      tx-=actualX+beeW-(stageW-10);

    if(actualY<105)
      ty+=105-actualY;

    if(actualY+beeH>stageH-60)
      ty-=actualY+beeH-(stageH-60);


    bee.style.transform=
      `translate3d(${tx}px,${ty}px,0)`;


    beeFrame=
      requestAnimationFrame(frame);
  }

  beeFrame=
    requestAnimationFrame(frame);
}


function stopBee(){

  if(beeFrame){
    cancelAnimationFrame(beeFrame);
    beeFrame=null;
  }

  const bee=
    document.getElementById("bee");

  bee.style.opacity="0";
  bee.style.visibility="hidden";
}


/* =====================================================
NETİ + ARI

Neti önce konuşuyor.
Arı ilk konuşmadan SONRA çıkıyor.

Şimdilik zamanlama:
3.4 sn -> arı gelir
6.4 sn -> arı gider

Hareket çok daha yavaş.
===================================================== */

function startSoundActivity(){

  if(running)return;

  running=true;

  stopAllAudio();
  hideBee();

  const audio=
    document.getElementById("introAudio");

  /*
  TIKLAMA İÇİNDE DOĞRUDAN PLAY:
  iPHONE SAFARI SES İZNİ KORUNUYOR.
  */

  if(soundEnabled){

    audio.pause();
    audio.currentTime=0;
    audio.volume=1;

    audio.play().catch(()=>{
      running=false;
    });
  }


  /*
  Neti'nin ilk cümlesi sırasında
  ARI YOK.
  */

  beeStartTimer=
    setTimeout(()=>{

      if(running){
        startBee();
      }

    },3400);


  /*
  "Şimdi sıra sende" kısmına
  geçerken ARI KAYBOLUR.
  */

  beeStopTimer=
    setTimeout(()=>{

      stopBee();

    },6400);


  audio.onended=()=>{

    stopBee();
    running=false;

  };


  if(!soundEnabled){

    clearTimeout(beeStartTimer);
    clearTimeout(beeStopTimer);

    beeStartTimer=
      setTimeout(startBee,500);

    beeStopTimer=
      setTimeout(()=>{

        stopBee();
        running=false;

      },5000);
  }
}


/* =====================================================
KÜÇÜK a

BURASI ÇALIŞAN yazma.html'DEKİ
GERÇEK GEOMETRİ.

Orijinal:
CX = 520
CY = 600
R  = 250
START = -40
END = 40

ÖNCE ORİJİNAL NOKTALARI ÜRETİYORUZ.
SONRA TAM OLARAK 240-420 ARASINA
ÖLÇEKLİYORUZ.
===================================================== */

const ORIGINAL_CX=520;
const ORIGINAL_CY=600;
const ORIGINAL_R=250;

const START_DEG=-40;
const END_DEG=40;


function makeOriginalC(){

  const points=[];

  const travel=
    360-(END_DEG-START_DEG);

  const count=400;

  for(let i=0;i<=count;i++){

    const t=i/count;

    const degree=
      START_DEG-(travel*t);

    const angle=
      degree*Math.PI/180;

    points.push({

      x:
        ORIGINAL_CX+
        ORIGINAL_R*Math.cos(angle),

      y:
        ORIGINAL_CY+
        ORIGINAL_R*Math.sin(angle)

    });
  }

  return points;
}


const originalC=
  makeOriginalC();


/*
Orijinal harfin bütün sınırlarını
hesaplıyoruz.

Stem de hesaba dahil.
*/

const originalJoin=
  originalC[0];

const originalStemX=
  originalJoin.x;

const originalStemTop=
  originalJoin.y-95;

const originalStemBottom=
  ORIGINAL_CY+ORIGINAL_R;


/*
İSTEDİĞİN KESİN SINIRLAR
*/

const TARGET_TOP=240;
const TARGET_BOTTOM=420;


/*
Orijinal harfin en üst / alt noktası
*/

let sourceTop=
  Math.min(
    originalStemTop,
    ...originalC.map(p=>p.y)
  );

let sourceBottom=
  Math.max(
    originalStemBottom,
    ...originalC.map(p=>p.y)
  );


/*
Y ölçeği:
tam 240 -> 420
*/

const scaleY=
  (TARGET_BOTTOM-TARGET_TOP)/
  (sourceBottom-sourceTop);


/*
X'i Y ile aynı oranda küçültürsek
çalışan AR'daki dairesel yapı
KORUNUR.

Yani artık yumurta şeklinde
elle çizilmiş bir Bézier yok.
*/

const scaleX=
  scaleY;


/*
Tahta üzerinde merkez.
*/

const TARGET_CENTER_X=450;


/*
Orijinal harfin x sınırları
*/

const allOriginalX=[
  ...originalC.map(p=>p.x),
  originalStemX
];

const sourceLeft=
  Math.min(...allOriginalX);

const sourceRight=
  Math.max(...allOriginalX);

const sourceCenterX=
  (sourceLeft+sourceRight)/2;


/*
Dönüşüm
*/

function transformPoint(p){

  return{

    x:
      TARGET_CENTER_X+
      (p.x-sourceCenterX)*scaleX,

    y:
      TARGET_TOP+
      (p.y-sourceTop)*scaleY

  };
}


const cPoints=
  originalC.map(transformPoint);


const stemTopPoint=
  transformPoint({
    x:originalStemX,
    y:originalStemTop
  });


const stemBottomPoint=
  transformPoint({
    x:originalStemX,
    y:originalStemBottom
  });


const stemPoints=[];

for(let i=0;i<=200;i++){

  const t=i/200;

  stemPoints.push({

    x:stemTopPoint.x,

    y:
      stemTopPoint.y+
      (
        stemBottomPoint.y-
        stemTopPoint.y
      )*t

  });
}


/* =====================================================
SVG PATH ÜRET
===================================================== */

function pointsToPath(points){

  if(!points.length)return "";

  let d=
    `M ${points[0].x} ${points[0].y}`;

  for(let i=1;i<points.length;i++){

    d+=
      ` L ${points[i].x} ${points[i].y}`;
  }

  return d;
}


const cD=
  pointsToPath(cPoints);

const stemD=
  pointsToPath(stemPoints);


/* =====================================================
KILAVUZU ÇİZ
===================================================== */

function addPath(parent,className,d,id=null){

  const NS=
    "http://www.w3.org/2000/svg";

  const path=
    document.createElementNS(
      NS,
      "path"
    );

  path.setAttribute(
    "class",
    className
  );

  path.setAttribute(
    "d",
    d
  );

  if(id){
    path.setAttribute("id",id);
  }

  parent.appendChild(path);

  return path;
}

/* =====================================================
HARF ANİMASYONU
===================================================== */

function hidePath(path){

  if(!path)return;

  const length=
    path.getTotalLength();

  path.style.strokeDasharray=
    length;

  path.style.strokeDashoffset=
    length;
}


function resetSmall(){

  const c=
    document.getElementById(
      "smallC"
    );

  const stem=
    document.getElementById(
      "smallStraight"
    );

  hidePath(c);
  hidePath(stem);

  const dot=
    document.getElementById(
      "smallDot"
    );

  dot.setAttribute(
    "cx",
    cPoints[0].x
  );

  dot.setAttribute(
    "cy",
    cPoints[0].y
  );
}


function animatePath(
  path,
  dot,
  duration
){

  return new Promise(resolve=>{

    const length=
      path.getTotalLength();

    path.style.strokeDasharray=
      length;

    path.style.strokeDashoffset=
      length;

    const start=
      performance.now();


    function frame(now){

      const progress=
        Math.min(
          (now-start)/duration,
          1
        );

      const current=
        length*progress;

      path.style.strokeDashoffset=
        length-current;

      const point=
        path.getPointAtLength(current);

      dot.setAttribute(
        "cx",
        point.x
      );

      dot.setAttribute(
        "cy",
        point.y
      );

      if(progress<1){

        requestAnimationFrame(frame);

      }else{

        resolve();
      }
    }

    requestAnimationFrame(frame);
  });
}

    );


  /*

  /*

  info.textContent=
