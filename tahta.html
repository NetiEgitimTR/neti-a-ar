<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Neti Akıllı Tahta | A Sesi</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#effcff,#fff9ea);
  color:#292929;
}

button{
  font-family:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

/* ================= HEADER ================= */

header{
  height:82px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 24px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
  position:relative;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:28px;
  font-weight:900;
  color:#ef7d43;
}

.brand img{
  width:62px;
  height:62px;
  object-fit:contain;
}

#soundToggle{
  border:0;
  border-radius:16px;
  background:#e7f6ff;
  color:#328bc8;
  font-size:20px;
  font-weight:900;
  padding:13px 18px;
}

/* ================= SAYFALAR ================= */

.page{
  display:none;
  min-height:calc(100vh - 82px);
}

.page.active{
  display:block;
}

/* ================= ANA SAYFA ================= */

#home{
  text-align:center;
  padding:25px 20px 45px;
}

#home h1{
  color:#3888c7;
  font-size:44px;
  margin:4px 0;
}

.subtitle{
  font-size:23px;
  color:#666;
  margin:10px 0 20px;
}

.letters{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:15px 0 25px;
}

.letterBox{
  width:120px;
  height:120px;
  background:#fff;
  border:6px solid #ff9c43;
  border-radius:26px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:82px;
  font-weight:900;
  color:#ef7038;
}

.letterBox.small{
  border-color:#58b7dc;
  color:#3888c7;
}

.menu{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.menuCard{
  border:0;
  border-radius:28px;
  min-height:190px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.menuCard:nth-child(1){background:#fff0a5;}
.menuCard:nth-child(2){background:#dff6ff;}
.menuCard:nth-child(3){background:#ffe1ee;}

.menuIcon{
  display:block;
  font-size:54px;
}

.menuTitle{
  display:block;
  font-size:26px;
  font-weight:900;
  margin-top:10px;
}

.menuDesc{
  display:block;
  font-size:17px;
  color:#666;
  margin-top:8px;
}

/* ================= ETKİNLİK ================= */

.activity{
  text-align:center;
  padding:20px 20px 45px;
}

.activityTitle{
  color:#3888c7;
  font-size:40px;
  margin:4px 0 15px;
}

.info{
  font-size:25px;
  line-height:1.25;
  font-weight:900;
  min-height:48px;
  margin:15px auto 10px;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  margin:15px auto 0;
}

.mainBtn{
  border:0;
  border-radius:19px;
  padding:16px 26px;
  min-width:225px;
  background:#65c77c;
  color:#fff;
  font-size:22px;
  font-weight:900;
  box-shadow:0 5px 12px rgba(0,0,0,.10);
}

.repeatBtn{
  background:#ff9e43;
}

.homeBtn{
  background:#4f9fd3;
}

/* =====================================================
   SES / GÖZ EGZERSİZİ
===================================================== */

.soundStage{
  width:min(1050px,94vw);
  height:540px;
  margin:auto;
  background:#fff;
  border:5px solid #f1d66c;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.soundLetters{
  position:absolute;
  left:0;
  right:0;
  top:18px;
  font-size:125px;
  font-weight:900;
  color:#ef7038;
  z-index:2;
}

/* NETİ SOL ALT */

.netiWrap{
  position:absolute;
  width:205px;
  left:20px;
  bottom:15px;
  z-index:3;
}

.netiWrap img{
  width:100%;
  display:block;
}

/* ARI ARTIK KARENİN İÇİNDE KALACAK */

#bee{
  position:absolute;
  width:76px;
  height:76px;

  /*
    Başlangıç noktası:
    SOL TARAFTA.
  */
  left:90px;
  top:185px;

  z-index:5;

  will-change:transform;
  transform:translate3d(0,0,0);
}

#bee img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/*
  Göz takip yazısı altta.
*/

.eyeText{
  position:absolute;
  left:245px;
  right:20px;
  bottom:24px;
  font-size:27px;
  font-weight:900;
  z-index:3;
}

/* =====================================================
   YAZI ALANI
===================================================== */

.writingStage{
  width:min(1000px,94vw);
  height:540px;
  margin:8px auto;
  background:#fff;
  border:6px solid #58b6da;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

/*
  ÇİZGİ ARALIKLARINI DARALTTIK.

  ÜST      = %22
  ORTA     = %50
  ALT      = %78

  Böylece üst-alt mesafe eskisinden daha dar.
*/

.schoolLine{
  position:absolute;
  left:6%;
  width:88%;
  z-index:1;
}

.schoolTop{
  top:22%;
  border-top:3px solid #efa6c9;
}

.schoolMiddle{
  top:50%;
  transform:translateY(-50%);
  border-top:4px dashed #efa6c9;
}

.schoolBottom{
  top:78%;
  border-top:3px solid #efa6c9;
}

.letterSvg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

.guide{
  fill:none;
  stroke:#dedede;
  stroke-width:22;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.drawStroke{
  fill:none;
  stroke:#ef5050;
  stroke-width:17;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.yellowDot{
  fill:#ffd328;
  stroke:#efa900;
  stroke-width:4;
}

/* NUMARALAR */

.stepCircle{
  fill:#36a1d4;
}

.stepNumber{
  fill:white;
  font-size:21px;
  font-weight:900;
  text-anchor:middle;
  dominant-baseline:middle;
}

/* OKLAR */

.arrowLine{
  fill:none;
  stroke:#ef5050;
  stroke-width:6;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ================= MOBİL ================= */

  }

<script>

let soundEnabled = true;
let running = false;
let beeAnimation = null;


/* =====================================================
SAYFA
===================================================== */

function showPage(id){

  stopEverything();

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}


function goHome(){

  stopEverything();

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById("home")
    .classList.add("active");

  window.scrollTo(0,0);
}


/* =====================================================
SES
===================================================== */

function toggleSound(){

  soundEnabled = !soundEnabled;

  document
    .getElementById("soundToggle")
    .textContent =
      soundEnabled
      ? "🔊 Ses Açık"
      : "🔇 Ses Kapalı";

  if(!soundEnabled){
    stopAllAudio();
  }
}


function stopAllAudio(){

  document
    .querySelectorAll("audio")
    .forEach(audio=>{

      audio.pause();
      audio.currentTime = 0;

    });
}


function playAudio(id){

  return new Promise(resolve=>{

    if(!soundEnabled){
      resolve();
      return;
    }

    const audio =
      document.getElementById(id);

    audio.pause();
    audio.currentTime = 0;

    let finished = false;

    function done(){

      if(finished) return;

      finished = true;

      audio.onended = null;
      audio.onerror = null;

      resolve();
    }

    audio.onended = done;
    audio.onerror = done;

    const promise = audio.play();

    if(promise){

      promise.catch(()=>{
        done();
      });

    }

  });
}


/* =====================================================
ARI

ÖNEMLİ:
- SOL TARAFTAN BAŞLAR
- SAĞDAN DIŞARI ÇIKMAZ
- KARENİN ÜST / ORTA / ALT KISIMLARINI GEZER
- GERİ DÖNÜŞ DE KARENİN İÇİNDEDİR
===================================================== */

function stopBee(){

  if(beeAnimation){

    beeAnimation.cancel();
    beeAnimation = null;

  }

  const bee =
    document.getElementById("bee");

  bee.style.transform =
    "translate3d(0px,0px,0px)";
}


function startBee(){

  stopBee();

  const bee =
    document.getElementById("bee");

  /*
    Hareket miktarlarını soundStage'ın
    gerçek genişliğine göre hesaplıyoruz.

    Böylece telefonda da akıllı tahtada da
    arı kutudan dışarı çıkmaz.
  */

  const stage =
    document.querySelector(".soundStage");

  const stageWidth =
    stage.clientWidth;

  const stageHeight =
    stage.clientHeight;

  const beeWidth =
    bee.offsetWidth;

  /*
    Arının başlangıç left değeri zaten var.
    Buradan sağ kenara kadar güvenli mesafe.
  */

  const startLeft =
    bee.offsetLeft;

  const maxX =
    Math.max(
      0,
      stageWidth - startLeft - beeWidth - 30
    );

  /*
    Dikey hareket:
    başlangıç konumunun hem üstünü
    hem altını kullanıyoruz.
  */

  const up =
    Math.min(120, stageHeight * 0.22);

  const down =
    Math.min(155, stageHeight * 0.28);


  beeAnimation = bee.animate(

    [
      /* SOL ORTA */
      {
        transform:
          "translate3d(0px,0px,0px) rotate(0deg)"
      },

      /* SOL ÜST */
      {
        transform:
          `translate3d(${maxX*0.14}px,${-up}px,0px) rotate(8deg)`
      },

      /* ORTA ÜST */
      {
        transform:
          `translate3d(${maxX*0.40}px,${-up*0.65}px,0px) rotate(-5deg)`
      },

      /* SAĞ ÜST */
      {
        transform:
          `translate3d(${maxX*0.72}px,${-up}px,0px) rotate(6deg)`
      },

      /* SAĞ ORTA */
      {
        transform:
          `translate3d(${maxX}px,0px,0px) rotate(0deg)`
      },

      /* SAĞ ALT */
      {
        transform:
          `translate3d(${maxX*0.84}px,${down}px,0px) rotate(-7deg)`
      },

      /* ORTA ALT */
      {
        transform:
          `translate3d(${maxX*0.55}px,${down*0.85}px,0px) rotate(5deg)`
      },

      /* SOL ALT */
      {
        transform:
          `translate3d(${maxX*0.22}px,${down}px,0px) rotate(-6deg)`
      },

      /* SOL ORTA */
      {
        transform:
          "translate3d(0px,0px,0px) rotate(0deg)"
      }
    ],

    {
      duration:11000,
      iterations:Infinity,
      easing:"ease-in-out"
    }

  );
}


/* =====================================================
DURDUR
===================================================== */

function stopEverything(){

  running = false;

  stopAllAudio();
  stopBee();
}


/* =====================================================
PATH
===================================================== */

function hidePath(path){

  const length =
    path.getTotalLength();

  path.style.strokeDasharray =
    length;

  path.style.strokeDashoffset =
    length;
}


function resetSmall(){

  hidePath(
    document.getElementById("smallC")
  );

  hidePath(
    document.getElementById("smallStraight")
  );

  const dot =
    document.getElementById("smallDot");

  dot.setAttribute("cx","515");
  dot.setAttribute("cy","310");
}


function resetBig(){

  hidePath(
    document.getElementById("bigLeft")
  );

  hidePath(
    document.getElementById("bigRight")
  );

  hidePath(
    document.getElementById("bigMiddle")
  );

  const dot =
    document.getElementById("bigDot");

  dot.setAttribute("cx","450");
  dot.setAttribute("cy","135");
}


/* =====================================================
ÇİZİM
===================================================== */

function animatePath(
  path,
  dot,
  duration
){

  return new Promise(resolve=>{

    const length =
      path.getTotalLength();

    path.style.strokeDasharray =
      length;

    path.style.strokeDashoffset =
      length;

    const start =
      performance.now();


    function frame(now){

      const progress =
        Math.min(
          (now-start)/duration,
          1
        );

      const current =
        length * progress;

      path.style.strokeDashoffset =
        length-current;

      const point =
        path.getPointAtLength(current);

      dot.setAttribute(
        "cx",
        point.x
      );

      dot.setAttribute(
        "cy",
        point.y
      );

      if(progress < 1){

        requestAnimationFrame(frame);

      }else{

        resolve();

      }
    }

    requestAnimationFrame(frame);

  });
}


/* =====================================================
SES + ARI
===================================================== */

async function startSoundActivity(){

  if(running) return;

  running = true;

  stopAllAudio();

  /*
    iPhone Safari:
    sesi doğrudan buton tıklamasından
    başlatıyoruz.
  */

  const audioPromise =
    playAudio("introAudio");

  startBee();

  await audioPromise;

  await new Promise(resolve=>{
    setTimeout(resolve,2500);
  });

  stopBee();

  running = false;
}


/* =====================================================
KÜÇÜK a
===================================================== */

async function startSmall(){

  if(running) return;

  running = true;

  stopAllAudio();
  resetSmall();


  const c =
    document.getElementById("smallC");

  const straight =
    document.getElementById("smallStraight");

  const dot =
    document.getElementById("smallDot");

  const info =
    document.getElementById("smallInfo");


  /* 1 — C */

  info.textContent =
    "1️⃣ Önce c çizgisini çiz. Sarı okları takip et.";

  await Promise.all([

    playAudio("small1"),

    animatePath(
      c,
      dot,
      4200
    )

  ]);


  /* 2 — DÜZ */

  info.textContent =
    "2️⃣ Şimdi düz çizgiyi yukarıdan aşağı doğru çiz.";

  dot.setAttribute("cx","525");
  dot.setAttribute("cy","292");

  await Promise.all([

    playAudio("small2"),

    animatePath(
      straight,
      dot,
      3000
    )

  ]);


  /* BİR KEZ DAHA */

  info.textContent =
    "🌟 Harika! Bir kez daha yazalım.";

  await playAudio("small3");

  resetSmall();

  await animatePath(
    c,
    dot,
    3500
  );

  dot.setAttribute("cx","525");
  dot.setAttribute("cy","292");

  await animatePath(
    straight,
    dot,
    2500
  );


  /* BİTİŞ */

  info.textContent =
    "✏️ Şimdi sıra sende!";

  await playAudio("small4");

  running = false;
}
