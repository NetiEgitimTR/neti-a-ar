<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #harfCanvas,
    #tekHarfCanvas {
      display: none;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(255, 248, 225, 0.96);
    }

    #startButton {
      border: none;
      border-radius: 25px;
      padding: 18px 28px;
      font-size: 22px;
      font-weight: bold;
      background: #ff8a3d;
      color: white;
      box-shadow: 0 6px 16px rgba(0,0,0,0.20);
    }

    #startText {
      margin-top: 15px;
      font-size: 16px;
      color: #555;
      text-align: center;
      padding: 0 30px;
    }
  </style>

  <script>

    let sesHazir = false;
    let audioContext = null;
    let fonTimer = null;
    let fonAktif = false;


    /* =========================
       SES SİSTEMİ
       ========================= */

    function sesSisteminiAc() {

      if (!audioContext) {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        audioContext =
          new AudioContext();
      }

      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }


    /* =========================
       PIT SESİ
       ========================= */

    function popSesiCal() {

      if (!audioContext) return;

      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = 'sine';

      oscillator.frequency.setValueAtTime(
        720,
        now
      );

      oscillator.frequency.exponentialRampToValueAtTime(
        980,
        now + 0.07
      );

      gain.gain.setValueAtTime(
        0.0001,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        0.13,
        now + 0.015
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.16
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(now);
      oscillator.stop(now + 0.18);
    }


    /* =========================
       GÖZ EGZERSİZİ FON SESİ
       ========================= */

    function fonNotasiCal(
      frequency,
      duration = 0.55
    ) {

      if (!audioContext) return;

      const now =
        audioContext.currentTime;

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type = 'sine';

      oscillator.frequency.setValueAtTime(
        frequency,
        now
      );

      gain.gain.setValueAtTime(
        0.0001,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        0.018,
        now + 0.08
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(now);

      oscillator.stop(
        now + duration + 0.05
      );
    }


    function fonBaslat() {

      fonDurdur();

      if (!audioContext) return;

      fonAktif = true;

      const notalar = [
        261.63,
        329.63,
        392.00,
        329.63,
        293.66,
        349.23,
        392.00,
        329.63
      ];

      let notaIndex = 0;


      function notaCal() {

        if (!fonAktif) return;

        fonNotasiCal(
          notalar[notaIndex],
          0.55
        );

        notaIndex =
          (notaIndex + 1) %
          notalar.length;

        fonTimer =
          setTimeout(
            notaCal,
            750
          );
      }

      notaCal();
    }


    function fonDurdur() {

      fonAktif = false;

      if (fonTimer) {

        clearTimeout(fonTimer);

        fonTimer = null;
      }
    }


    /* =========================
       BAŞLANGIÇ
       ========================= */

    window.addEventListener(
      'DOMContentLoaded',
      () => {

        const startButton =
          document.querySelector(
            '#startButton'
          );

        const startScreen =
          document.querySelector(
            '#startScreen'
          );

        const tamSes =
          document.querySelector(
            '#tamSes'
          );


        tamSes.load();


        startButton.addEventListener(
          'click',
          async () => {

            sesSisteminiAc();


            /*
              iPHONE / SAFARI:
              TEK SES DOSYASININ
              KİLİDİNİ AÇIYORUZ
            */

            try {

              tamSes.muted = true;
              tamSes.volume = 1;
              tamSes.currentTime = 0;

              await tamSes.play();

              tamSes.pause();

              tamSes.currentTime = 0;
              tamSes.muted = false;

              sesHazir = true;

            } catch(e) {

              tamSes.muted = false;
              sesHazir = true;
            }


            startScreen.style.display =
              'none';
          }
        );
      }
    );


    /* =========================
       ARI UÇUŞU
       ========================= */

    AFRAME.registerComponent(
      'smooth-bee-flight',
      {

        init: function () {

          this.active = false;
          this.startTime = 0;
          this.duration = 3700;

          this.points = [

            {x:-0.48, y:-0.30},
            {x:-0.40, y:-0.18},
            {x:-0.32, y:-0.03},
            {x:-0.25, y:0.08},
            {x:-0.17, y:0.03},
            {x:-0.08, y:-0.13},
            {x:0.02, y:-0.23},
            {x:0.14, y:-0.22},
            {x:0.25, y:-0.12},
            {x:0.35, y:0.02},
            {x:0.43, y:0.18},
            {x:0.45, y:0.35},
            {x:0.40, y:0.50},
            {x:0.30, y:0.62},
            {x:0.17, y:0.70},
            {x:0.02, y:0.75},
            {x:-0.15, y:0.78},
            {x:-0.27, y:0.79}

          ];
        },


        startFlight: function () {

          this.startTime =
            performance.now();

          this.active = true;

          this.el.setAttribute(
            'visible',
            true
          );

          this.el.object3D.scale.set(
            1,1,1
          );

          this.el.object3D.rotation.set(
            0,0,0
          );
        },


        catmull: function(
          p0,p1,p2,p3,t
        ) {

          const t2 = t*t;
          const t3 = t2*t;

          return {

            x:0.5*(

              (2*p1.x)+

              (-p0.x+p2.x)*t+

              (
                2*p0.x-
                5*p1.x+
                4*p2.x-
                p3.x
              )*t2+

              (
                -p0.x+
                3*p1.x-
                3*p2.x+
                p3.x
              )*t3
            ),

            y:0.5*(

              (2*p1.y)+

              (-p0.y+p2.y)*t+

              (
                2*p0.y-
                5*p1.y+
                4*p2.y-
                p3.y
              )*t2+

              (
                -p0.y+
                3*p1.y-
                3*p2.y+
                p3.y
              )*t3
            )
          };
        },


        tick: function () {

          if (!this.active) return;

          const elapsed =
            performance.now() -
            this.startTime;

          let progress =
            elapsed /
            this.duration;

          if (progress >= 1) {
            progress = 1;
          }

          const segmentCount =
            this.points.length - 1;

          let position =
            progress *
            segmentCount;

          let index =
            Math.floor(position);

          let localT =
            position - index;


          if (index >= segmentCount) {

            index =
              segmentCount - 1;

            localT = 1;
          }


          const p0 =
            this.points[
              Math.max(
                0,
                index-1
              )
            ];

          const p1 =
            this.points[index];

          const p2 =
            this.points[
              Math.min(
                this.points.length-1,
                index+1
              )
            ];

          const p3 =
            this.points[
              Math.min(
                this.points.length-1,
                index+2
              )
            ];


          const pos =
            this.catmull(
              p0,
              p1,
              p2,
              p3,
              localT
            );


          this.el.object3D.position.set(
            pos.x,
            pos.y,
            0.09
          );


          if (progress >= 1) {

            this.active = false;

            this.el.object3D.position.set(
              -0.27,
              0.79,
              0.09
            );
          }
        }
      }
    );


    /* =========================
       GÖZ EGZERSİZİ
       ========================= */

    AFRAME.registerComponent(
      'eye-pop-exercise',
      {

        init: function () {

          this.running = false;
          this.timers = [];


          this.steps = [

            {x:-0.40,y:0.72,letter:'A',show:950,gap:250},
            {x:0.40,y:0.22,letter:'a',show:950,gap:250},
            {x:0.40,y:0.72,letter:'A',show:950,gap:250},
            {x:-0.40,y:0.22,letter:'a',show:950,gap:250},

            {x:0.00,y:0.48,letter:'A',show:900,gap:230},
            {x:-0.46,y:0.48,letter:'a',show:900,gap:230},
            {x:0.46,y:0.48,letter:'A',show:900,gap:230},

            {x:0.00,y:0.80,letter:'a',show:850,gap:220},
            {x:0.00,y:0.16,letter:'A',show:850,gap:220},

            {x:-0.42,y:0.48,letter:'a',show:800,gap:200},

            {x:0.39,y:0.70,letter:'A',show:750,gap:180},
            {x:-0.39,y:0.20,letter:'a',show:750,gap:180},

            {x:0.39,y:0.20,letter:'A',show:700,gap:170},

            {x:0.00,y:0.48,letter:'a',show:900,gap:0}

          ];
        },


        clearTimers: function () {

          this.timers.forEach(
            clearTimeout
          );

          this.timers = [];
        },


        stopExercise: function () {

          this.running = false;

          this.clearTimers();

          fonDurdur();

          this.el.setAttribute(
            'visible',
            'false'
          );
        },


        drawLetter: function(letter) {

          const canvas =
            document.querySelector(
              '#tekHarfCanvas'
            );

          const ctx =
            canvas.getContext('2d');

          canvas.width = 500;
          canvas.height = 500;

          ctx.clearRect(
            0,0,500,500
          );

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';

          ctx.font =
            'bold 360px Arial';

          ctx.lineWidth = 20;

          ctx.strokeStyle =
            '#FFFFFF';

          ctx.fillStyle =
            '#FF6B35';


          if (letter === 'A') {

            ctx.strokeText(
              'A',
              250,
              255
            );

            ctx.fillText(
              'A',
              250,
              255
            );
          }


          if (letter === 'a') {

            ctx.strokeText(
              'ɑ',
              250,
              255
            );

            ctx.fillText(
              'ɑ',
              250,
              255
            );
          }


          const mesh =
            this.el.getObject3D(
              'mesh'
            );

          if (
            mesh &&
            mesh.material &&
            mesh.material.map
          ) {

            mesh.material.map.needsUpdate =
              true;
          }
        },


        startExercise: function () {

          this.stopExercise();

          this.running = true;

          fonBaslat();

          const self = this;

          let currentTime = 0;


          this.steps.forEach(
            (step) => {

              const showTimer =
                setTimeout(
                  () => {

                    if (!self.running) return;

                    self.drawLetter(
                      step.letter
                    );

                    self.el.object3D.position.set(
                      step.x,
                      step.y,
                      0.12
                    );

                    self.el.object3D.scale.set(
                      1,1,1
                    );

                    self.el.setAttribute(
                      'visible',
                      'true'
                    );

                    popSesiCal();

                  },
                  currentTime
                );

              self.timers.push(
                showTimer
              );


              const hideAt =
                currentTime +
                step.show;


              const hideTimer =
                setTimeout(
                  () => {

                    if (!self.running) return;

                    self.el.setAttribute(
                      'visible',
                      'false'
                    );

                  },
                  hideAt
                );

              self.timers.push(
                hideTimer
              );


              currentTime +=
                step.show +
                step.gap;

            }
          );


          /*
            GÖZ EGZERSİZİ BİTİYOR
          */

          const finishTimer =
            setTimeout(
              () => {

                self.running = false;

                self.el.setAttribute(
                  'visible',
                  'false'
                );

                fonDurdur();


                /*
                  NETİ DİKKAT ÇEKSİN.
                  SESİ BURADA BAŞLATMIYORUZ.
                  TEK MP3 ZATEN ÇALIYOR.
                */

                setTimeout(
                  () => {

                    window.dispatchEvent(
                      new Event(
                        'neti-gorev-animasyon'
                      )
                    );

                  },
                  600
                );

              },
              currentTime + 100
            );

          self.timers.push(
            finishTimer
          );
        }
      }
    );


    /* =========================
       ANA NETİ ANİMASYONU
       ========================= */

    AFRAME.registerComponent(
      'neti-animation',
      {

        init: function () {

          const target = this.el;

          const neti =
            document.querySelector(
              '#netiKarakter'
            );

          const harfler =
            document.querySelector(
              '#harfler'
            );

          const tekHarf =
            document.querySelector(
              '#tekHarf'
            );

          const ari =
            document.querySelector(
              '#ariKarakter'
            );

          const tamSes =
            document.querySelector(
              '#tamSes'
            );


          let basladi = false;
          let kayipTimer = null;
          let zamanlayicilar = [];


          function timer(fn,ms) {

            const t =
              setTimeout(fn,ms);

            zamanlayicilar.push(t);

            return t;
          }


          function timerlariTemizle() {

            zamanlayicilar.forEach(
              clearTimeout
            );

            zamanlayicilar = [];
          }


          /* =========================
             SONDA NETİ HAREKETİ
             ========================= */

          window.addEventListener(
            'neti-gorev-animasyon',
            () => {

              neti.removeAttribute(
                'animation__gorev'
              );

              neti.setAttribute(
                'scale',
                '1 1 1'
              );

              neti.setAttribute(
                'animation__gorev',
                'property: scale;' +
                'from: 1 1 1;' +
                'to: 1.12 1.12 1.12;' +
                'dir: alternate;' +
                'loop: 2;' +
                'dur: 350;' +
                'easing: easeInOutQuad'
              );

            }
          );


          function baslat() {

            if (basladi) return;

            basladi = true;

            timerlariTemizle();

            fonDurdur();


            if (
              tekHarf.components[
                'eye-pop-exercise'
              ]
            ) {

              tekHarf.components[
                'eye-pop-exercise'
              ].stopExercise();
            }


            try {

              tamSes.pause();

              tamSes.currentTime = 0;

              tamSes.muted = false;

              tamSes.volume = 1;

            } catch(e) {}


            neti.removeAttribute(
              'animation__buyume'
            );

            neti.removeAttribute(
              'animation__yuksel'
            );

            neti.removeAttribute(
              'animation__gorev'
            );

            neti.setAttribute(
              'scale',
              '0.05 0.05 0.05'
            );

            neti.setAttribute(
              'position',
              '0 -0.25 0.03'
            );


            /* =========================
               NETİ GELİR + TEK MP3 BAŞLAR
               ========================= */

            timer(
              () => {

                neti.setAttribute(
                  'animation__buyume',
                  'property: scale;' +
                  'from: 0.05 0.05 0.05;' +
                  'to: 1 1 1;' +
                  'dur: 1100;' +
                  'easing: easeOutBack'
                );

                neti.setAttribute(
                  'animation__yuksel',
                  'property: position;' +
                  'from: 0 -0.25 0.03;' +
                  'to: 0 0.08 0.03;' +
                  'dur: 1100;' +
                  'easing: easeOutQuad'
                );


                if (sesHazir) {

                  try {

                    tamSes.pause();

                    tamSes.currentTime = 0;

                    tamSes.muted = false;

                    tamSes.volume = 1;

                    const oynat =
                      tamSes.play();

                    if (
                      oynat !== undefined
                    ) {

                      oynat.catch(
                        err => {

                          console.log(
                            'Neti sesi oynatılamadı:',
                            err
                          );

                        }
                      );
                    }

                  } catch(e) {}
                }

              },
              100
            );


            /* =========================
               A / a
               ========================= */

            harfler.removeAttribute(
              'animation__harf'
            );

            harfler.setAttribute(
              'visible',
              'false'
            );

            harfler.setAttribute(
              'position',
              '0 0.55 0.04'
            );

            harfler.setAttribute(
              'scale',
              '0.01 0.01 0.01'
            );


            timer(
              () => {

                harfler.setAttribute(
                  'visible',
                  'true'
                );

                harfler.setAttribute(
                  'animation__harf',
                  'property: scale;' +
                  'from: 0.01 0.01 0.01;' +
                  'to: 1 1 1;' +
                  'dur: 550;' +
                  'easing: easeOutBack'
                );

              },
              1500
            );


            /* =========================
               ARI
               ========================= */

            ari.setAttribute(
              'visible',
              'false'
            );

            ari.object3D.position.set(
              -0.48,
              -0.30,
              0.09
            );

            ari.object3D.scale.set(
              1,1,1
            );

            ari.object3D.rotation.set(
              0,0,0
            );


            if (
              ari.components[
                'smooth-bee-flight'
              ]
            ) {

              ari.components[
                'smooth-bee-flight'
              ].active = false;
            }


            timer(
              () => {

                const flight =
                  ari.components[
                    'smooth-bee-flight'
                  ];

                if (flight) {
                  flight.startFlight();
                }

              },
              1700
            );


            /* =========================
               ARI + A/a KAYBOLUR
               ========================= */

            timer(
              () => {

                ari.setAttribute(
                  'visible',
                  'false'
                );

                harfler.setAttribute(
                  'visible',
                  'false'
                );

              },
              6400
            );


            /* =========================
               GÖZ EGZERSİZİ
               ========================= */

            timer(
              () => {

                const exercise =
                  tekHarf.components[
                    'eye-pop-exercise'
                  ];

                if (exercise) {
                  exercise.startExercise();
                }

              },
              6700
            );
          }


          /* =========================
             HEDEF BULUNDU
             ========================= */

          target.addEventListener(
            'targetFound',
            () => {

              if (kayipTimer) {

                clearTimeout(
                  kayipTimer
                );

                kayipTimer = null;
              }

              baslat();
            }
          );


          /* =========================
             HEDEF KAYBOLDU
             ========================= */

          target.addEventListener(
            'targetLost',
            () => {

              if (kayipTimer) {

                clearTimeout(
                  kayipTimer
                );
              }


              kayipTimer =
                setTimeout(
                  () => {

                    basladi = false;

                    timerlariTemizle();

                    fonDurdur();


                    try {

                      tamSes.pause();

                      tamSes.currentTime = 0;

                    } catch(e) {}


                    if (
                      ari.components[
                        'smooth-bee-flight'
                      ]
                    ) {

                      ari.components[
                        'smooth-bee-flight'
                      ].active = false;
                    }


                    if (
                      tekHarf.components[
                        'eye-pop-exercise'
                      ]
                    ) {

                      tekHarf.components[
                        'eye-pop-exercise'
                      ].stopExercise();
                    }


                    ari.setAttribute(
                      'visible',
                      'false'
                    );

                    tekHarf.setAttribute(
                      'visible',
                      'false'
                    );

                  },
                  2000
                );
            }
          );
        }
      }
    );


    /* =========================
       A / a ÇİZİMİ
       ========================= */

    window.addEventListener(
      'DOMContentLoaded',
      () => {

        const canvas =
          document.querySelector(
            '#harfCanvas'
          );

        const ctx =
          canvas.getContext('2d');

        canvas.width = 1200;
        canvas.height = 600;

        ctx.clearRect(
          0,0,1200,600
        );

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';


        /* BÜYÜK A */

        ctx.font =
          'bold 390px Arial';

        ctx.lineWidth = 22;
        ctx.strokeStyle = '#FFFFFF';

        ctx.strokeText(
          'A',
          420,
          300
        );

        ctx.fillStyle = '#FF6B35';

        ctx.fillText(
          'A',
          420,
          300
        );


        /* KÜÇÜK a */

        ctx.font =
          'bold 390px Arial';

        ctx.lineWidth = 22;
        ctx.strokeStyle = '#FFFFFF';

        ctx.strokeText(
          'ɑ',
          790,
          300
        );

        ctx.fillStyle = '#FF6B35';

        ctx.fillText(
          'ɑ',
          790,
          300
        );
      }
    );

  </script>
</head>


<body>


<!-- TEK BİRLEŞİK NETİ SES DOSYASI -->

<audio
  id="tamSes"
  src="./neti-a-tam-ses.mp3"
  preload="auto"
  playsinline>
</audio>


<div id="startScreen">

  <button id="startButton">
    🔊 Neti ile Başla
  </button>

  <div id="startText">
    Dokun ve A sayfasını kameraya göster.
  </div>

</div>


<canvas id="harfCanvas"></canvas>
<canvas id="tekHarfCanvas"></canvas>


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets>

    <img
      id="neti"
      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
      crossorigin="anonymous"
    >
