<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>

  <script>
    AFRAME.registerComponent('neti-animation', {
      init: function () {

        const target = this.el;
        const neti = document.querySelector('#netiKarakter');

        target.addEventListener('targetFound', () => {

          neti.setAttribute('scale', '0.05 0.05 0.05');
          neti.setAttribute('position', '0 -0.25 0.03');
          neti.setAttribute('rotation', '0 0 0');

          neti.removeAttribute('animation__buyume');
          neti.removeAttribute('animation__yuksel');

          setTimeout(() => {

            neti.setAttribute(
              'animation__buyume',
              'property: scale; from: 0.05 0.05 0.05; to: 1 1 1; dur: 1800; easing: easeOutBack'
            );

            neti.setAttribute(
              'animation__yuksel',
              'property: position; from: 0 -0.25 0.03; to: 0 0.08 0.03; dur: 1800; easing: easeOutQuad'
            );

          }, 100);
        });

        target.addEventListener('targetLost', () => {
          neti.removeAttribute('animation__buyume');
          neti.removeAttribute('animation__yuksel');
          neti.setAttribute('scale', '0.05 0.05 0.05');
          neti.setAttribute('position', '0 -0.25 0.03');
        });
      }
    });
  </script>

</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img
      id="neti"
      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
      crossorigin="anonymous">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    mindar-image-target="targetIndex: 0"
    neti-animation>

    <a-image
      id="netiKarakter"
      src="#neti"
      position="0 -0.25 0.03"
      width="0.75"
      height="0.75"
      scale="0.05 0.05 0.05"
      material="shader: flat; transparent: true; alphaTest: 0.01">
    </a-image>

  </a-entity>

</a-scene>

</body>
</html>
