<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #harfCanvas {
      display: none;
    }
  </style>

  <script>
    AFRAME.registerComponent('neti-animation', {
      init: function () {

        const target = this.el;
        const neti = document.querySelector('#netiKarakter');
        const harfler = document.querySelector('#harfler');

        target.addEventListener('targetFound', () => {

          // Animasyonları temizle
          neti.removeAttribute('animation__buyume');
          neti.removeAttribute('animation__yuksel');
          harfler.removeAttribute('animation__harf');

          // Başlangıç konumları
          neti.setAttribute('scale', '0.05 0.05 0.05');
          neti.setAttribute('position', '0 -0.25 0.03');

          harfler.setAttribute('scale', '0.01 0.01 0.01');
          harfler.setAttribute('visible', 'false');

          // NETİ ÇIKIYOR
          setTimeout(() => {

            neti.setAttribute(
              'animation__buyume',
              'property: scale; from: 0.05 0.05 0.05; to: 1 1 1; dur: 1500; easing: easeOutBack'
            );

            neti.setAttribute(
              'animation__yuksel',
              'property: position; from: 0 -0.25 0.03; to: 0 0.08 0.03; dur: 1500; easing: easeOutQuad'
            );

          }, 100);

          // A a HARFLERİ ÇIKIYOR
          setTimeout(() => {

            harfler.setAttribute('visible', 'true');

            harfler.setAttribute(
              'animation__harf',
              'property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 900; easing: easeOutBack'
            );

          }, 1700);

        });

        target.addEventListener('targetLost', () => {

          neti.removeAttribute('animation__buyume');
          neti.removeAttribute('animation__yuksel');
          harfler.removeAttribute('animation__harf');

          neti.setAttribute('scale', '0.05 0.05 0.05');
          neti.setAttribute('position', '0 -0.25 0.03');

          harfler.setAttribute('scale', '0.01 0.01 0.01');
          harfler.setAttribute('visible', 'false');

        });

      }
    });

    window.addEventListener('DOMContentLoaded', () => {

      // A ve a harflerini canvas üzerine çiz
      const canvas = document.querySelector('#harfCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = 1024;
      canvas.height = 512;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = 'bold 330px Arial';
      ctx.lineWidth = 18;

      // Beyaz dış çizgi
      ctx.strokeStyle = '#FFFFFF';
      ctx.strokeText('A a', 512, 255);

      // Turuncu harf
      ctx.fillStyle = '#FF6B35';
      ctx.fillText('A a', 512, 255);

      // A-Frame dokusunu yenile
      setTimeout(() => {
        const material = document.querySelector('#harfler').getObject3D('mesh');
        if (
          material &&
          material.material &&
          material.material.map
        ) {
          material.material.map.needsUpdate = true;
        }
      }, 1000);

    });
  </script>

</head>

<body>

<canvas id="harfCanvas"></canvas>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>

    <img
      id="neti"
      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
      crossorigin="anonymous">

    <canvas id="harfTexture"></canvas>

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    mindar-image-target="targetIndex: 0"
    neti-animation>

    <!-- NETİ -->
    <a-image
      id="netiKarakter"
      src="#neti"
      position="0 -0.25 0.03"
      width="0.75"
      height="0.75"
      scale="0.05 0.05 0.05"
      material="shader: flat; transparent: true; alphaTest: 0.01">
    </a-image>

    <!-- A a -->
    <a-plane
      id="harfler"
      position="0 0.55 0.04"
      width="0.9"
      height="0.45"
      scale="0.01 0.01 0.01"
      visible="false"
      material="src: #harfCanvas; transparent: true; shader: flat;">
    </a-plane>

  </a-entity>

</a-scene>

</body>
</html>
