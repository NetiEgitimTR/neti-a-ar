<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #harfCanvas {
      display: none;
    }
  </style>

  <script>

    /* =========================================
       ARININ AKICI UÇUŞU
       - Tek tur
       - Büyüyüp küçülme YOK
       - Sallanma YOK
       - Dur-kalk YOK
       ========================================= */

    AFRAME.registerComponent('smooth-bee-flight', {

      init: function () {

        this.active = false;
        this.startTime = 0;

        /* Normal hız: yaklaşık 6 saniye */
        this.duration = 6000;

        /*
          SENİN ÇİZDİĞİN YOLA BENZER ROTA

          Sol alt →
          hafif yukarı →
          aşağı →
          sağa →
          sağdan yukarı →
          A'nın üstü
        */

        this.points = [

          {x:-0.48, y:-0.30},

          {x:-0.40, y:-0.18},

          {x:-0.32, y:-0.03},

          {x:-0.25, y: 0.08},

          {x:-0.17, y: 0.03},

          {x:-0.08, y:-0.13},

          {x: 0.02, y:-0.23},

          {x: 0.14, y:-0.22},

          {x: 0.25, y:-0.12},

          {x: 0.35, y: 0.02},

          {x: 0.43, y: 0.18},

          {x: 0.45, y: 0.35},

          {x: 0.40, y: 0.50},

          {x: 0.30, y: 0.62},

          {x: 0.17, y: 0.70},

          {x: 0.02, y: 0.75},

          {x:-0.15, y: 0.78},

          {x:-0.27, y: 0.79}

        ];

      },


      /* =========================================
         UÇUŞU BAŞLAT
         ========================================= */

      startFlight: function () {

        this.startTime = performance.now();

        this.active = true;

        this.el.setAttribute(
          'visible',
          true
        );

        /*
          ARININ BOYUTU SABİT
        */

        this.el.setAttribute(
          'scale',
          '1 1 1'
        );

        /*
          ARI SABİT AÇIDA
          KENDİSİ SALLANMAYACAK
        */

        this.el.setAttribute(
          'rotation',
          '0 0 0'
        );

      },


      /* =========================================
         YUMUŞAK EĞRİ HESABI
         ========================================= */

      catmull: function(p0, p1, p2, p3, t) {

        const t2 = t * t;
        const t3 = t2 * t;

        return {

          x: 0.5 * (

            (2 * p1.x) +

            (-p0.x + p2.x) * t +

            (
              2 * p0.x -
              5 * p1.x +
              4 * p2.x -
              p3.x
            ) * t2 +

            (
              -p0.x +
              3 * p1.x -
              3 * p2.x +
              p3.x
            ) * t3

          ),


          y: 0.5 * (

            (2 * p1.y) +

            (-p0.y + p2.y) * t +

            (
              2 * p0.y -
              5 * p1.y +
              4 * p2.y -
              p3.y
            ) * t2 +

            (
              -p0.y +
              3 * p1.y -
              3 * p2.y +
              p3.y
            ) * t3

          )

        };

      },


      /* =========================================
         HER KAREDE POZİSYONU HESAPLA
         ========================================= */

      tick: function () {

        if (!this.active) return;


        const elapsed =
          performance.now() - this.startTime;


        let progress =
          elapsed / this.duration;


        if (progress >= 1) {

          progress = 1;

        }


        /*
          DİKKAT:

          Burada ekstra sağ-sol sallanma,
          büyüyüp küçülme veya zıplama YOK.

          Arı yalnızca rota üzerinde ilerliyor.
        */


        const segmentCount =
          this.points.length - 1;


        let position =
          progress * segmentCount;


        let index =
          Math.floor(position);


        let localT =
          position - index;


        if (index >= segmentCount) {

          index =
            segmentCount - 1;

          localT = 1;

        }


        const p0 =
          this.points[
            Math.max(
              0,
              index - 1
            )
          ];


        const p1 =
          this.points[index];


        const p2 =
          this.points[
            Math.min(
              this.points.length - 1,
              index + 1
            )
          ];


        const p3 =
          this.points[
            Math.min(
              this.points.length - 1,
              index + 2
            )
          ];


        const pos =
          this.catmull(
            p0,
            p1,
            p2,
            p3,
            localT
          );


        /*
          SADECE KONUM DEĞİŞİYOR.
          Rotation ve scale değişmiyor.
        */

        this.el.object3D.position.set(
          pos.x,
          pos.y,
          0.09
        );


        /* =====================================
           UÇUŞ BİTTİ
           Büyük A'nın üstünde dur.
           A'yı kapatma.
           ===================================== */

        if (progress >= 1) {

          this.active = false;


          this.el.object3D.position.set(
            -0.27,
            0.79,
            0.09
          );


          this.el.object3D.rotation.set(
            0,
            0,
            0
          );


          this.el.object3D.scale.set(
            1,
            1,
            1
          );

        }

      }

    });



    /* =========================================
       ANA SAHNE
       ========================================= */

    AFRAME.registerComponent('neti-animation', {

      init: function () {

        const target = this.el;


        const neti =
          document.querySelector(
            '#netiKarakter'
          );


        const harfler =
          document.querySelector(
            '#harfler'
          );


        const ari =
          document.querySelector(
            '#ariKarakter'
          );


        let basladi = false;

        let kayipTimer = null;


        function baslat() {

          if (basladi) return;

          basladi = true;


          /* ==============================
             NETİ
             ============================== */

          neti.removeAttribute(
            'animation__buyume'
          );

          neti.removeAttribute(
            'animation__yuksel'
          );


          neti.setAttribute(
            'scale',
            '0.05 0.05 0.05'
          );


          neti.setAttribute(
            'position',
            '0 -0.25 0.03'
          );


          setTimeout(() => {

            neti.setAttribute(

              'animation__buyume',

              'property: scale;' +
              'from: 0.05 0.05 0.05;' +
              'to: 1 1 1;' +
              'dur: 1400;' +
              'easing: easeOutBack'

            );


            neti.setAttribute(

              'animation__yuksel',

              'property: position;' +
              'from: 0 -0.25 0.03;' +
              'to: 0 0.08 0.03;' +
              'dur: 1400;' +
              'easing: easeOutQuad'

            );

          }, 100);



          /* ==============================
             A a
             ============================== */

          harfler.removeAttribute(
            'animation__harf'
          );


          harfler.setAttribute(
            'visible',
            'false'
          );


          harfler.setAttribute(
            'scale',
            '0.01 0.01 0.01'
          );


          setTimeout(() => {

            harfler.setAttribute(
              'visible',
              'true'
            );


            harfler.setAttribute(

              'animation__harf',

              'property: scale;' +
              'from: 0.01 0.01 0.01;' +
              'to: 1 1 1;' +
              'dur: 700;' +
              'easing: easeOutBack'

            );

          }, 1600);



          /* ==============================
             ARI
             ============================== */

          ari.setAttribute(
            'visible',
            'false'
          );


          ari.setAttribute(
            'position',
            '-0.48 -0.30 0.09'
          );


          ari.setAttribute(
            'rotation',
            '0 0 0'
          );


          ari.setAttribute(
            'scale',
            '1 1 1'
          );


          /*
            A/a çıktıktan sonra
            arı uçmaya başlıyor.
          */

          setTimeout(() => {

            const flight =
              ari.components[
                'smooth-bee-flight'
              ];


            if (flight) {

              flight.startFlight();

            }

          }, 2600);

        }



        /* ==============================
           SAYFA BULUNDU
           ============================== */

        target.addEventListener(

          'targetFound',

          () => {

            if (kayipTimer) {

              clearTimeout(
                kayipTimer
              );

              kayipTimer = null;

            }


            baslat();

          }

        );



        /* ==============================
           SAYFA KAYBOLDU
           ============================== */

        target.addEventListener(

          'targetLost',

          () => {

            if (kayipTimer) {

              clearTimeout(
                kayipTimer
              );

            }


            /*
              Kamera hedefi anlık kaybederse
              hemen yeniden başlamasın.
            */

            kayipTimer =
              setTimeout(() => {

                basladi = false;

              }, 2000);

          }

        );

      }

    });



    /* =========================================
       A ve küçük a
       ========================================= */

    window.addEventListener(

      'DOMContentLoaded',

      () => {

        const canvas =
          document.querySelector(
            '#harfCanvas'
          );


        const ctx =
          canvas.getContext('2d');


        canvas.width = 1200;

        canvas.height = 600;


        ctx.clearRect(
          0,
          0,
          1200,
          600
        );


        ctx.textAlign =
          'center';


        ctx.textBaseline =
          'middle';


        ctx.lineJoin =
          'round';


        ctx.lineCap =
          'round';



        /* BÜYÜK A */

        ctx.font =
          'bold 390px Arial';


        ctx.lineWidth =
          22;


        ctx.strokeStyle =
          '#FFFFFF';


        ctx.strokeText(
          'A',
          420,
          300
        );


        ctx.fillStyle =
          '#FF6B35';


        ctx.fillText(
          'A',
          420,
          300
        );



        /* KÜÇÜK a */

        ctx.font =
          'bold 390px Arial';


        ctx.lineWidth =
          22;


        ctx.strokeStyle =
          '#FFFFFF';


        ctx.strokeText(
          'ɑ',
          790,
          300
        );


        ctx.fillStyle =
          '#FF6B35';


        ctx.fillText(
          'ɑ',
          790,
          300
        );

      }

    );

  </script>

</head>


<body>


<canvas id="harfCanvas"></canvas>


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets>


    <!-- NETİ -->

    <img

      id="neti"

      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"

      crossorigin="anonymous"

    >



    <!-- ARI -->

    <img

      id="ariPNG"

      src="./831FD224-0476-409E-B2D5-24D2A8AD424E.png"

      crossorigin="anonymous"

    >


  </a-assets>



  <a-camera

    position="0 0 0"

    look-controls="
      enabled: false
    ">

  </a-camera>



  <a-entity

    mindar-image-target="
      targetIndex: 0
    "

    neti-animation>


    <!-- NETİ -->

    <a-image

      id="netiKarakter"

      src="#neti"

      position="
        0 -0.25 0.03
      "

      width="0.75"

      height="0.75"

      scale="
        0.05 0.05 0.05
      "

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>



    <!-- A a -->

    <a-plane

      id="harfler"

      position="
        0 0.55 0.04
      "

      width="0.90"

      height="0.45"

      scale="
        0.01 0.01 0.01
      "

      visible="false"

      material="
        src: #harfCanvas;
        transparent: true;
        shader: flat;
      ">

    </a-plane>



    <!-- ARI -->

    <a-image

      id="ariKarakter"

      src="#ariPNG"

      position="
        -0.48 -0.30 0.09
      "

      width="0.22"

      height="0.22"

      scale="
        1 1 1
      "

      rotation="
        0 0 0
      "

      visible="false"

      smooth-bee-flight

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>


  </a-entity>


</a-scene>


</body>
</html>
