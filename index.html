<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #harfCanvas,
    #tekHarfCanvas {
      display: none;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(255, 248, 225, 0.96);
    }

    #startButton {
      border: none;
      border-radius: 25px;
      padding: 18px 28px;
      font-size: 22px;
      font-weight: bold;
      background: #ff8a3d;
      color: white;
      box-shadow: 0 6px 16px rgba(0,0,0,0.20);
    }

    #startText {
      margin-top: 15px;
      font-size: 16px;
      color: #555;
      text-align: center;
      padding: 0 30px;
    }
  </style>


  <script>

    let sesHazir = false;


    /* ==========================================
       iPHONE / SAFARI SES İZNİ
       ========================================== */

    window.addEventListener('DOMContentLoaded', () => {

      const startButton =
        document.querySelector('#startButton');

      const startScreen =
        document.querySelector('#startScreen');

      const netiSes =
        document.querySelector('#netiSes');


      startButton.addEventListener('click', async () => {

        try {

          netiSes.volume = 0;

          await netiSes.play();

          netiSes.pause();

          netiSes.currentTime = 0;

          netiSes.volume = 1;

          sesHazir = true;

        } catch (e) {

          netiSes.volume = 1;

          sesHazir = true;

        }

        startScreen.style.display = 'none';

      });

    });



    /* ==========================================
       ARI UÇUŞU
       ========================================== */

    AFRAME.registerComponent('smooth-bee-flight', {

      init: function () {

        this.active = false;

        this.startTime = 0;

        this.duration = 3700;


        /* AYNI BEĞENDİĞİMİZ ROTA */

        this.points = [

          {x:-0.48, y:-0.30},

          {x:-0.40, y:-0.18},

          {x:-0.32, y:-0.03},

          {x:-0.25, y: 0.08},

          {x:-0.17, y: 0.03},

          {x:-0.08, y:-0.13},

          {x: 0.02, y:-0.23},

          {x: 0.14, y:-0.22},

          {x: 0.25, y:-0.12},

          {x: 0.35, y: 0.02},

          {x: 0.43, y: 0.18},

          {x: 0.45, y: 0.35},

          {x: 0.40, y: 0.50},

          {x: 0.30, y: 0.62},

          {x: 0.17, y: 0.70},

          {x: 0.02, y: 0.75},

          {x:-0.15, y: 0.78},

          {x:-0.27, y: 0.79}

        ];

      },


      startFlight: function () {

        this.startTime = performance.now();

        this.active = true;

        this.el.setAttribute(
          'visible',
          true
        );

        this.el.object3D.scale.set(
          1, 1, 1
        );

        this.el.object3D.rotation.set(
          0, 0, 0
        );

      },


      catmull: function(p0, p1, p2, p3, t) {

        const t2 = t * t;
        const t3 = t2 * t;

        return {

          x: 0.5 * (

            (2 * p1.x) +

            (-p0.x + p2.x) * t +

            (
              2*p0.x -
              5*p1.x +
              4*p2.x -
              p3.x
            ) * t2 +

            (
              -p0.x +
              3*p1.x -
              3*p2.x +
              p3.x
            ) * t3
          ),

          y: 0.5 * (

            (2 * p1.y) +

            (-p0.y + p2.y) * t +

            (
              2*p0.y -
              5*p1.y +
              4*p2.y -
              p3.y
            ) * t2 +

            (
              -p0.y +
              3*p1.y -
              3*p2.y +
              p3.y
            ) * t3
          )

        };

      },


      tick: function () {

        if (!this.active) return;


        const elapsed =
          performance.now() - this.startTime;


        let progress =
          elapsed / this.duration;


        if (progress >= 1) {

          progress = 1;

        }


        const segmentCount =
          this.points.length - 1;


        let position =
          progress * segmentCount;


        let index =
          Math.floor(position);


        let localT =
          position - index;


        if (index >= segmentCount) {

          index =
            segmentCount - 1;

          localT = 1;

        }


        const p0 =
          this.points[
            Math.max(0, index - 1)
          ];


        const p1 =
          this.points[index];


        const p2 =
          this.points[
            Math.min(
              this.points.length - 1,
              index + 1
            )
          ];


        const p3 =
          this.points[
            Math.min(
              this.points.length - 1,
              index + 2
            )
          ];


        const pos =
          this.catmull(
            p0,
            p1,
            p2,
            p3,
            localT
          );


        this.el.object3D.position.set(
          pos.x,
          pos.y,
          0.09
        );


        if (progress >= 1) {

          this.active = false;


          this.el.object3D.position.set(
            -0.27,
            0.79,
            0.09
          );

        }

      }

    });



    /* ==========================================
       YENİ GÖZ EGZERSİZİ

       Harfler hareket etmiyor.
       Farklı noktalarda belirip kayboluyor.
       ========================================== */

    AFRAME.registerComponent('eye-pop-exercise', {

      init: function () {

        this.running = false;

        this.timers = [];


        /*
          HARFLERİN ÇIKACAĞI NOKTALAR

          Sol üst
          Sağ üst
          Sol alt
          Sağ alt
          Orta
          Üst orta
          Alt orta
        */

        this.steps = [

          {
            x:-0.38,
            y: 0.67,
            letter:'A'
          },

          {
            x: 0.38,
            y: 0.67,
            letter:'a'
          },

          {
            x:-0.38,
            y: 0.25,
            letter:'A'
          },

          {
            x: 0.38,
            y: 0.25,
            letter:'a'
          },

          {
            x: 0.00,
            y: 0.48,
            letter:'A'
          },

          {
            x: 0.00,
            y: 0.78,
            letter:'a'
          },

          {
            x: 0.00,
            y: 0.18,
            letter:'A'
          }

        ];

      },


      clearTimers: function () {

        this.timers.forEach(
          clearTimeout
        );

        this.timers = [];

      },


      stopExercise: function () {

        this.running = false;

        this.clearTimers();

        this.el.setAttribute(
          'visible',
          'false'
        );

      },


      drawLetter: function(letter) {

        const canvas =
          document.querySelector(
            '#tekHarfCanvas'
          );


        const ctx =
          canvas.getContext('2d');


        canvas.width = 500;

        canvas.height = 500;


        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        ctx.textAlign =
          'center';


        ctx.textBaseline =
          'middle';


        ctx.lineJoin =
          'round';


        ctx.lineCap =
          'round';


        /*
          BÜYÜK A
        */

        if (letter === 'A') {

          ctx.font =
            'bold 360px Arial';

          ctx.lineWidth = 20;

          ctx.strokeStyle =
            '#FFFFFF';

          ctx.strokeText(
            'A',
            250,
            255
          );

          ctx.fillStyle =
            '#FF6B35';

          ctx.fillText(
            'A',
            250,
            255
          );

        }


        /*
          KÜÇÜK a

          İlkokul tipi tek katlı a için
          kullandığımız karakter.
        */

        if (letter === 'a') {

          ctx.font =
            'bold 360px Arial';

          ctx.lineWidth = 20;

          ctx.strokeStyle =
            '#FFFFFF';

          ctx.strokeText(
            'ɑ',
            250,
            255
          );

          ctx.fillStyle =
            '#FF6B35';

          ctx.fillText(
            'ɑ',
            250,
            255
          );

        }


        /*
          Canvas dokusunu yenile
        */

        const mesh =
          this.el.getObject3D('mesh');


        if (
          mesh &&
          mesh.material &&
          mesh.material.map
        ) {

          mesh.material.map.needsUpdate =
            true;

        }

      },


      startExercise: function () {

        this.stopExercise();

        this.running = true;


        const self = this;


        /*
          Her harf yaklaşık
          0.9 saniye görünecek.

          Arada 0.25 saniye boşluk.
        */

        const gorunmeSuresi = 900;

        const bosluk = 250;

        const adimSuresi =
          gorunmeSuresi + bosluk;


        this.steps.forEach(
          (step, index) => {


            /*
              HARF BELİRİR
            */

            const showTimer =
              setTimeout(() => {

                if (!self.running) return;


                self.drawLetter(
                  step.letter
                );


                self.el.object3D.position.set(
                  step.x,
                  step.y,
                  0.12
                );


                self.el.object3D.scale.set(
                  1,
                  1,
                  1
                );


                self.el.setAttribute(
                  'visible',
                  'true'
                );


              }, index * adimSuresi);


            self.timers.push(
              showTimer
            );



            /*
              HARF KAYBOLUR
            */

            const hideTimer =
              setTimeout(() => {

                if (!self.running) return;


                self.el.setAttribute(
                  'visible',
                  'false'
                );


              },

              index * adimSuresi +
              gorunmeSuresi
            );


            self.timers.push(
              hideTimer
            );

          }
        );



        /*
          EGZERSİZ BİTİŞ
        */

        const finishTimer =
          setTimeout(() => {

            self.running = false;

            self.el.setAttribute(
              'visible',
              'false'
            );


          },

          this.steps.length *
          adimSuresi
        );


        this.timers.push(
          finishTimer
        );

      }

    });



    /* ==========================================
       ANA NETİ ANİMASYONU
       ========================================== */

    AFRAME.registerComponent('neti-animation', {

      init: function () {

        const target =
          this.el;


        const neti =
          document.querySelector(
            '#netiKarakter'
          );


        const harfler =
          document.querySelector(
            '#harfler'
          );


        const tekHarf =
          document.querySelector(
            '#tekHarf'
          );


        const ari =
          document.querySelector(
            '#ariKarakter'
          );


        const netiSes =
          document.querySelector(
            '#netiSes'
          );


        let basladi = false;

        let kayipTimer = null;

        let zamanlayicilar = [];


        function timer(fn, ms) {

          const t =
            setTimeout(fn, ms);

          zamanlayicilar.push(t);

          return t;

        }


        function timerlariTemizle() {

          zamanlayicilar.forEach(
            clearTimeout
          );

          zamanlayicilar = [];

        }



        function baslat() {

          if (basladi) return;

          basladi = true;


          timerlariTemizle();


          /* GÖZ EGZERSİZİNİ SIFIRLA */

          if (
            tekHarf.components[
              'eye-pop-exercise'
            ]
          ) {

            tekHarf.components[
              'eye-pop-exercise'
            ].stopExercise();

          }



          /* SESİ BAŞA AL */

          try {

            netiSes.pause();

            netiSes.currentTime = 0;

            netiSes.volume = 1;

          } catch(e) {}



          /* =====================================
             NETİ BAŞLANGIÇ
             ===================================== */

          neti.removeAttribute(
            'animation__buyume'
          );

          neti.removeAttribute(
            'animation__yuksel'
          );


          neti.setAttribute(
            'scale',
            '0.05 0.05 0.05'
          );


          neti.setAttribute(
            'position',
            '0 -0.25 0.03'
          );



          /* =====================================
             NETİ ÇIKIYOR + SES BAŞLIYOR
             ===================================== */

          timer(() => {

            neti.setAttribute(

              'animation__buyume',

              'property: scale;' +
              'from: 0.05 0.05 0.05;' +
              'to: 1 1 1;' +
              'dur: 1100;' +
              'easing: easeOutBack'

            );


            neti.setAttribute(

              'animation__yuksel',

              'property: position;' +
              'from: 0 -0.25 0.03;' +
              'to: 0 0.08 0.03;' +
              'dur: 1100;' +
              'easing: easeOutQuad'

            );


            /*
              NETİ SESİ
            */

            if (sesHazir) {

              try {

                netiSes.pause();

                netiSes.currentTime = 0;

                netiSes.volume = 1;


                const oynat =
                  netiSes.play();


                if (oynat !== undefined) {

                  oynat.catch(
                    err => {

                      console.log(
                        'Neti sesi oynatılamadı:',
                        err
                      );

                    }
                  );

                }

              } catch(e) {

                console.log(e);

              }

            }

          }, 100);



          /* =====================================
             A / a BİRLİKTE GELİYOR
             ===================================== */

          harfler.removeAttribute(
            'animation__harf'
          );


          harfler.setAttribute(
            'visible',
            'false'
          );


          harfler.setAttribute(
            'position',
            '0 0.55 0.04'
          );


          harfler.setAttribute(
            'scale',
            '0.01 0.01 0.01'
          );


          timer(() => {

            harfler.setAttribute(
              'visible',
              'true'
            );


            harfler.setAttribute(

              'animation__harf',

              'property: scale;' +
              'from: 0.01 0.01 0.01;' +
              'to: 1 1 1;' +
              'dur: 550;' +
              'easing: easeOutBack'

            );

          }, 1500);



          /* =====================================
             ARI
             ===================================== */

          ari.setAttribute(
            'visible',
            'false'
          );


          ari.object3D.position.set(
            -0.48,
            -0.30,
            0.09
          );


          ari.object3D.scale.set(
            1,
            1,
            1
          );


          ari.object3D.rotation.set(
            0,
            0,
            0
          );


          if (
            ari.components[
              'smooth-bee-flight'
            ]
          ) {

            ari.components[
              'smooth-bee-flight'
            ].active = false;

          }



          /* 1.7 SN → ARI UÇUYOR */

          timer(() => {

            const flight =
              ari.components[
                'smooth-bee-flight'
              ];


            if (flight) {

              flight.startFlight();

            }

          }, 1700);



          /* =====================================
             6.4 SN

             ARI KAYBOLUYOR
             İLK A/a DA KAYBOLUYOR
             ===================================== */

          timer(() => {

            ari.setAttribute(
              'visible',
              'false'
            );


            harfler.setAttribute(
              'visible',
              'false'
            );

          }, 6400);



          /* =====================================
             6.7 SN

             YENİ GÖZ EGZERSİZİ BAŞLIYOR
             ===================================== */

          timer(() => {

            const exercise =
              tekHarf.components[
                'eye-pop-exercise'
              ];


            if (exercise) {

              exercise.startExercise();

            }

          }, 6700);

        }



        /* =====================================
           HEDEF BULUNDU
           ===================================== */

        target.addEventListener(
          'targetFound',
          () => {

            if (kayipTimer) {

              clearTimeout(
                kayipTimer
              );

              kayipTimer = null;

            }


            baslat();

          }
        );



        /* =====================================
           HEDEF KAYBOLDU
           ===================================== */

        target.addEventListener(
          'targetLost',
          () => {

            if (kayipTimer) {

              clearTimeout(
                kayipTimer
              );

            }


            kayipTimer =
              setTimeout(() => {

                basladi = false;

                timerlariTemizle();


                try {

                  netiSes.pause();

                  netiSes.currentTime = 0;

                } catch(e) {}


                if (
                  ari.components[
                    'smooth-bee-flight'
                  ]
                ) {

                  ari.components[
                    'smooth-bee-flight'
                  ].active = false;

                }


                if (
                  tekHarf.components[
                    'eye-pop-exercise'
                  ]
                ) {

                  tekHarf.components[
                    'eye-pop-exercise'
                  ].stopExercise();

                }


                ari.setAttribute(
                  'visible',
                  'false'
                );


                tekHarf.setAttribute(
                  'visible',
                  'false'
                );


              }, 2000);

          }
        );

      }

    });



    /* ==========================================
       A / a ANA GÖRSELİ
       ========================================== */

    window.addEventListener(
      'DOMContentLoaded',
      () => {

        const canvas =
          document.querySelector(
            '#harfCanvas'
          );


        const ctx =
          canvas.getContext('2d');


        canvas.width = 1200;

        canvas.height = 600;


        ctx.clearRect(
          0,
          0,
          1200,
          600
        );


        ctx.textAlign =
          'center';


        ctx.textBaseline =
          'middle';


        ctx.lineJoin =
          'round';


        ctx.lineCap =
          'round';



        /* BÜYÜK A */

        ctx.font =
          'bold 390px Arial';


        ctx.lineWidth =
          22;


        ctx.strokeStyle =
          '#FFFFFF';


        ctx.strokeText(
          'A',
          420,
          300
        );


        ctx.fillStyle =
          '#FF6B35';


        ctx.fillText(
          'A',
          420,
          300
        );



        /* KÜÇÜK a */

        ctx.font =
          'bold 390px Arial';


        ctx.lineWidth =
          22;


        ctx.strokeStyle =
          '#FFFFFF';


        ctx.strokeText(
          'ɑ',
          790,
          300
        );


        ctx.fillStyle =
          '#FF6B35';


        ctx.fillText(
          'ɑ',
          790,
          300
        );

      }
    );

  </script>

</head>


<body>


<!-- ==========================================
     NETİ SES DOSYASI
     ========================================== -->

<audio
  id="netiSes"
  src="./Merhaba%20Ben%20Neti%20A%20s.mp3"
  preload="auto"
  playsinline>
</audio>



<!-- ==========================================
     BAŞLAT BUTONU
     ========================================== -->

<div id="startScreen">

  <button id="startButton">
    🔊 Neti ile Başla
  </button>

  <div id="startText">
    Dokun ve A sayfasını kameraya göster.
  </div>

</div>



<!-- ANA A/a -->

<canvas id="harfCanvas"></canvas>


<!-- GÖZ EGZERSİZİNDE TEK HARF -->

<canvas id="tekHarfCanvas"></canvas>



<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets>


    <!-- NETİ -->

    <img
      id="neti"
      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
      crossorigin="anonymous"
    >


    <!-- ARI -->

    <img
      id="ariPNG"
      src="./831FD224-0476-409E-B2D5-24D2A8AD424E.png"
      crossorigin="anonymous"
    >


  </a-assets>



  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>



  <a-entity
    mindar-image-target="targetIndex: 0"
    neti-animation>


    <!-- NETİ -->

    <a-image

      id="netiKarakter"

      src="#neti"

      position="0 -0.25 0.03"

      width="0.75"

      height="0.75"

      scale="0.05 0.05 0.05"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>



    <!-- BAŞTA GÖRÜNEN A / a -->

    <a-plane

      id="harfler"

      position="0 0.55 0.04"

      width="0.90"

      height="0.45"

      scale="0.01 0.01 0.01"

      visible="false"

      material="
        src: #harfCanvas;
        transparent: true;
        shader: flat;
      ">

    </a-plane>



    <!-- ======================================
         GÖZ EGZERSİZİNDEKİ TEK HARF
         ====================================== -->

    <a-plane

      id="tekHarf"

      position="0 0.48 0.12"

      width="0.33"

      height="0.33"

      visible="false"

      eye-pop-exercise

      material="
        src: #tekHarfCanvas;
        transparent: true;
        shader: flat;
      ">

    </a-plane>



    <!-- ARI -->

    <a-image

      id="ariKarakter"

      src="#ariPNG"

      position="-0.48 -0.30 0.09"

      width="0.22"

      height="0.22"

      scale="1 1 1"

      rotation="0 0 0"

      visible="false"

      smooth-bee-flight

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>


  </a-entity>


</a-scene>


</body>
</html>
