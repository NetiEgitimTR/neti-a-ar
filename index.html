<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #harfCanvas {
      display: none;
    }
  </style>

  <script>

    AFRAME.registerComponent('neti-animation', {

      init: function () {

        const target = this.el;
        const neti = document.querySelector('#netiKarakter');
        const harfler = document.querySelector('#harfler');
        const ari = document.querySelector('#ariKarakter');

        let basladi = false;
        let kayipTimer = null;
        let timers = [];

        function timer(fn, ms) {
          const t = setTimeout(fn, ms);
          timers.push(t);
        }

        function temizle() {

          timers.forEach(clearTimeout);
          timers = [];

          neti.removeAttribute('animation__buyume');
          neti.removeAttribute('animation__yuksel');

          harfler.removeAttribute('animation__harf');

          ari.removeAttribute('animation__yol');
          ari.removeAttribute('animation__donus');
          ari.removeAttribute('animation__buyume');
        }


        /*
        ARININ TEK HAREKETİ
        */

        function ariGit(
          fromX, fromY,
          toX, toY,
          sure,
          basAci,
          sonAci
        ) {

          ari.removeAttribute('animation__yol');
          ari.removeAttribute('animation__donus');

          ari.setAttribute(
            'animation__yol',
            `property: position;
             from: ${fromX} ${fromY} 0.09;
             to: ${toX} ${toY} 0.09;
             dur: ${sure};
             easing: easeInOutSine`
          );

          ari.setAttribute(
            'animation__donus',
            `property: rotation;
             from: 0 0 ${basAci};
             to: 0 0 ${sonAci};
             dur: ${sure};
             easing: easeInOutSine`
          );
        }


        /*
        BİR TUR UÇUŞ

        Yaklaşık 2.8 saniye.
        */

        function tur(baslangic) {

          /*
          SOL ALT → YUKARI
          */

          timer(() => {

            ariGit(
              -0.48, -0.30,
              -0.28, -0.02,
              400,
              -25, -35
            );

          }, baslangic);


          /*
          → AŞAĞI
          */

          timer(() => {

            ariGit(
              -0.28, -0.02,
              -0.05, -0.26,
              380,
              -35, 30
            );

          }, baslangic + 400);


          /*
          → YUKARI
          */

          timer(() => {

            ariGit(
              -0.05, -0.26,
              0.18, -0.07,
              380,
              30, -30
            );

          }, baslangic + 780);


          /*
          → SAĞ ALT
          */

          timer(() => {

            ariGit(
              0.18, -0.07,
              0.39, -0.22,
              350,
              -30, 20
            );

          }, baslangic + 1160);


          /*
          → SAĞ YUKARI
          */

          timer(() => {

            ariGit(
              0.39, -0.22,
              0.48, 0.18,
              420,
              20, -45
            );

          }, baslangic + 1510);


          /*
          → ÜST SAĞ
          */

          timer(() => {

            ariGit(
              0.48, 0.18,
              0.35, 0.55,
              400,
              -45, -80
            );

          }, baslangic + 1930);


          /*
          → ÜST SOL
          */

          timer(() => {

            ariGit(
              0.35, 0.55,
              -0.18, 0.60,
              450,
              -80, -110
            );

          }, baslangic + 2330);

        }


        function baslat() {

          if (basladi) return;

          basladi = true;

          temizle();


          /*
          BAŞLANGIÇ
          */

          neti.setAttribute(
            'scale',
            '0.05 0.05 0.05'
          );

          neti.setAttribute(
            'position',
            '0 -0.25 0.03'
          );


          harfler.setAttribute(
            'visible',
            'false'
          );

          harfler.setAttribute(
            'scale',
            '0.01 0.01 0.01'
          );


          ari.setAttribute(
            'visible',
            'false'
          );

          ari.setAttribute(
            'scale',
            '0.01 0.01 0.01'
          );

          ari.setAttribute(
            'position',
            '-0.48 -0.30 0.09'
          );


          /*
          NETİ ÇIKIYOR
          */

          timer(() => {

            neti.setAttribute(
              'animation__buyume',
              'property: scale; from: 0.05 0.05 0.05; to: 1 1 1; dur: 1100; easing: easeOutBack'
            );

            neti.setAttribute(
              'animation__yuksel',
              'property: position; from: 0 -0.25 0.03; to: 0 0.08 0.03; dur: 1100; easing: easeOutQuad'
            );

          }, 100);


          /*
          A a GELİYOR
          */

          timer(() => {

            harfler.setAttribute(
              'visible',
              'true'
            );

            harfler.setAttribute(
              'animation__harf',
              'property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 600; easing: easeOutBack'
            );

          }, 1250);


          /*
          ARI GELİYOR
          */

          timer(() => {

            ari.setAttribute(
              'visible',
              'true'
            );

            ari.setAttribute(
              'animation__buyume',
              'property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 250; easing: easeOutBack'
            );

          }, 2000);


          /*
          1. TUR
          */

          tur(2250);


          /*
          ARIYI TEKRAR SOL ALTA AL
          2. TUR BAŞLASIN
          */

          timer(() => {

            ari.removeAttribute('animation__yol');
            ari.removeAttribute('animation__donus');

            ari.setAttribute(
              'position',
              '-0.48 -0.30 0.09'
            );

            ari.setAttribute(
              'rotation',
              '0 0 -25'
            );

          }, 5030);


          /*
          2. TUR
          */

          tur(5100);


          /*
          2. TURDAN SONRA
          BÜYÜK A'NIN ÜSTÜNE GİDİYOR

          A'YI KAPATMIYOR.
          */

          timer(() => {

            ariGit(
              -0.18, 0.60,
              -0.25, 0.78,
              450,
              -110, 0
            );

          }, 7880);


          /*
          SON KONUM
          */

          timer(() => {

            ari.removeAttribute('animation__yol');
            ari.removeAttribute('animation__donus');

            ari.setAttribute(
              'position',
              '-0.25 0.78 0.09'
            );

            ari.setAttribute(
              'rotation',
              '0 0 0'
            );

          }, 8330);

        }


        /*
        SAYFA BULUNDU
        */

        target.addEventListener(
          'targetFound',
          () => {

            if (kayipTimer) {
              clearTimeout(kayipTimer);
              kayipTimer = null;
            }

            baslat();

          }
        );


        /*
        SAYFA KAYBOLDU

        Titremeyi azaltmak için
        hemen sıfırlamıyoruz.
        */

        target.addEventListener(
          'targetLost',
          () => {

            if (kayipTimer) {
              clearTimeout(kayipTimer);
            }

            kayipTimer = setTimeout(() => {

              basladi = false;

              temizle();

              harfler.setAttribute(
                'visible',
                'false'
              );

              ari.setAttribute(
                'visible',
                'false'
              );

            }, 2000);

          }
        );

      }

    });


    /*
    A ve KÜÇÜK a
    */

    window.addEventListener(
      'DOMContentLoaded',
      () => {

        const canvas =
          document.querySelector('#harfCanvas');

        const ctx =
          canvas.getContext('2d');

        canvas.width = 1200;
        canvas.height = 600;

        ctx.clearRect(
          0, 0, 1200, 600
        );

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';


        /*
        BÜYÜK A
        */

        ctx.font = 'bold 390px Arial';

        ctx.lineWidth = 22;
        ctx.strokeStyle = '#FFFFFF';

        ctx.strokeText(
          'A',
          420,
          300
        );

        ctx.fillStyle = '#FF6B35';

        ctx.fillText(
          'A',
          420,
          300
        );


        /*
        KÜÇÜK a
        TEK KATLI
        */

        ctx.font = 'bold 390px Arial';

        ctx.lineWidth = 22;
        ctx.strokeStyle = '#FFFFFF';

        ctx.strokeText(
          'ɑ',
          790,
          300
        );

        ctx.fillStyle = '#FF6B35';

        ctx.fillText(
          'ɑ',
          790,
          300
        );

      }
    );

  </script>
</head>


<body>

<canvas id="harfCanvas"></canvas>


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets>

    <!-- NETİ -->

    <img
      id="neti"
      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
      crossorigin="anonymous"
    >


    <!-- ARI -->

    <img
      id="ariPNG"
      src="./831FD224-0476-409E-B2D5-24D2A8AD424E.png"
      crossorigin="anonymous"
    >

  </a-assets>


  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <a-entity
    mindar-image-target="targetIndex: 0"
    neti-animation>


    <!-- NETİ -->

    <a-image

      id="netiKarakter"

      src="#neti"

      position="0 -0.25 0.03"

      width="0.75"
      height="0.75"

      scale="0.05 0.05 0.05"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>


    <!-- A a -->

    <a-plane

      id="harfler"

      position="0 0.55 0.04"

      width="0.90"
      height="0.45"

      scale="0.01 0.01 0.01"

      visible="false"

      material="
        src: #harfCanvas;
        transparent: true;
        shader: flat;
      ">

    </a-plane>


    <!-- ARI -->

    <a-image

      id="ariKarakter"

      src="#ariPNG"

      position="-0.48 -0.30 0.09"

      width="0.22"
      height="0.22"

      scale="0.01 0.01 0.01"

      rotation="0 0 -25"

      visible="false"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>


  </a-entity>

</a-scene>

</body>
</html>
