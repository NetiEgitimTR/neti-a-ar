<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #harfCanvas {
      display: none;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(255, 248, 225, 0.96);
    }

    #startButton {
      border: none;
      border-radius: 25px;
      padding: 18px 28px;
      font-size: 22px;
      font-weight: bold;
      background: #ff8a3d;
      color: white;
      box-shadow: 0 6px 16px rgba(0,0,0,0.20);
    }

    #startText {
      margin-top: 15px;
      font-size: 16px;
      color: #555;
      text-align: center;
      padding: 0 30px;
    }
  </style>


  <script>

    let sesHazir = false;


    /* =====================================
       SESİ iPHONE'DA AKTİF ET
       ===================================== */

    window.addEventListener('DOMContentLoaded', () => {

      const startButton =
        document.querySelector('#startButton');

      const startScreen =
        document.querySelector('#startScreen');

      const netiSes =
        document.querySelector('#netiSes');


      startButton.addEventListener('click', async () => {

        try {

          netiSes.volume = 0;

          await netiSes.play();

          netiSes.pause();

          netiSes.currentTime = 0;

          netiSes.volume = 1;

          sesHazir = true;

        } catch (e) {

          netiSes.volume = 1;

          sesHazir = true;

        }

        startScreen.style.display = 'none';

      });

    });



    /* =====================================
       ARININ AKICI UÇUŞU
       ===================================== */

    AFRAME.registerComponent('smooth-bee-flight', {

      init: function () {

        this.active = false;

        this.startTime = 0;

        this.duration = 3700;


        this.points = [

          {x:-0.48, y:-0.30},

          {x:-0.40, y:-0.18},

          {x:-0.32, y:-0.03},

          {x:-0.25, y: 0.08},

          {x:-0.17, y: 0.03},

          {x:-0.08, y:-0.13},

          {x: 0.02, y:-0.23},

          {x: 0.14, y:-0.22},

          {x: 0.25, y:-0.12},

          {x: 0.35, y: 0.02},

          {x: 0.43, y: 0.18},

          {x: 0.45, y: 0.35},

          {x: 0.40, y: 0.50},

          {x: 0.30, y: 0.62},

          {x: 0.17, y: 0.70},

          {x: 0.02, y: 0.75},

          {x:-0.15, y: 0.78},

          {x:-0.27, y: 0.79}

        ];

      },


      startFlight: function () {

        this.startTime = performance.now();

        this.active = true;

        this.el.setAttribute('visible', true);

        this.el.object3D.scale.set(1, 1, 1);

        this.el.object3D.rotation.set(0, 0, 0);

      },


      catmull: function(p0, p1, p2, p3, t) {

        const t2 = t * t;
        const t3 = t2 * t;

        return {

          x: 0.5 * (

            (2 * p1.x) +

            (-p0.x + p2.x) * t +

            (
              2*p0.x -
              5*p1.x +
              4*p2.x -
              p3.x
            ) * t2 +

            (
              -p0.x +
              3*p1.x -
              3*p2.x +
              p3.x
            ) * t3
          ),

          y: 0.5 * (

            (2 * p1.y) +

            (-p0.y + p2.y) * t +

            (
              2*p0.y -
              5*p1.y +
              4*p2.y -
              p3.y
            ) * t2 +

            (
              -p0.y +
              3*p1.y -
              3*p2.y +
              p3.y
            ) * t3
          )

        };

      },


      tick: function () {

        if (!this.active) return;


        const elapsed =
          performance.now() - this.startTime;


        let progress =
          elapsed / this.duration;


        if (progress >= 1) {

          progress = 1;

        }


        const segmentCount =
          this.points.length - 1;


        let position =
          progress * segmentCount;


        let index =
          Math.floor(position);


        let localT =
          position - index;


        if (index >= segmentCount) {

          index =
            segmentCount - 1;

          localT = 1;

        }


        const p0 =
          this.points[
            Math.max(0, index - 1)
          ];


        const p1 =
          this.points[index];


        const p2 =
          this.points[
            Math.min(
              this.points.length - 1,
              index + 1
            )
          ];


        const p3 =
          this.points[
            Math.min(
              this.points.length - 1,
              index + 2
            )
          ];


        const pos =
          this.catmull(
            p0,
            p1,
            p2,
            p3,
            localT
          );


        this.el.object3D.position.set(
          pos.x,
          pos.y,
          0.09
        );


        if (progress >= 1) {

          this.active = false;


          this.el.object3D.position.set(
            -0.27,
            0.79,
            0.09
          );


          this.el.object3D.rotation.set(
            0,
            0,
            0
          );


          this.el.object3D.scale.set(
            1,
            1,
            1
          );

        }

      }

    });



    /* =========================================
       GÖZ EGZERSİZİ
       ========================================= */

    AFRAME.registerComponent('eye-exercise', {

      init: function () {

        this.active = false;

        this.startTime = 0;


        /*
          GÖZ EGZERSİZİNİN TOPLAM SÜRESİ

          10 SANİYE
        */

        this.duration = 10000;


        /*
          A/a'NIN İZLEYECEĞİ YOL

          ORTA
          SAĞ
          SOL
          ORTA
          YUKARI
          AŞAĞI
          ORTA
        */

        this.points = [

          {x: 0.00, y: 0.55},

          {x: 0.38, y: 0.55},

          {x:-0.38, y: 0.55},

          {x: 0.00, y: 0.55},

          {x: 0.00, y: 0.82},

          {x: 0.00, y: 0.28},

          {x: 0.00, y: 0.55}

        ];

      },


      startExercise: function () {

        this.startTime =
          performance.now();

        this.active = true;


        this.el.setAttribute(
          'visible',
          true
        );


        /*
          BOYUT SABİT
        */

        this.el.object3D.scale.set(
          1,
          1,
          1
        );

      },


      /*
        YUMUŞAK HAREKET
      */

      ease: function(t) {

        return t * t * (3 - 2 * t);

      },


      tick: function () {

        if (!this.active) return;


        const elapsed =
          performance.now() -
          this.startTime;


        let progress =
          elapsed / this.duration;


        if (progress >= 1) {

          progress = 1;

        }


        const segmentCount =
          this.points.length - 1;


        let segmentPosition =
          progress * segmentCount;


        let index =
          Math.floor(segmentPosition);


        let localT =
          segmentPosition - index;


        if (index >= segmentCount) {

          index =
            segmentCount - 1;

          localT = 1;

        }


        /*
          HIZLANIP YAVAŞLAYAN
          AKICI GEÇİŞ
        */

        localT =
          this.ease(localT);


        const start =
          this.points[index];


        const end =
          this.points[index + 1];


        const x =
          start.x +
          (end.x - start.x) *
          localT;


        const y =
          start.y +
          (end.y - start.y) *
          localT;


        this.el.object3D.position.set(
          x,
          y,
          0.04
        );


        /*
          EGZERSİZ BİTTİ
        */

        if (progress >= 1) {

          this.active = false;


          /*
            HARFLER TEKRAR ORTADA
          */

          this.el.object3D.position.set(
            0,
            0.55,
            0.04
          );

        }

      }

    });



    /* =====================================
       ANA AR ANİMASYONU
       ===================================== */

    AFRAME.registerComponent('neti-animation', {

      init: function () {

        const target =
          this.el;


        const neti =
          document.querySelector(
            '#netiKarakter'
          );


        const harfler =
          document.querySelector(
            '#harfler'
          );


        const ari =
          document.querySelector(
            '#ariKarakter'
          );


        const netiSes =
          document.querySelector(
            '#netiSes'
          );


        let basladi = false;

        let kayipTimer = null;

        let zamanlayicilar = [];


        function timer(fn, ms) {

          const t =
            setTimeout(fn, ms);

          zamanlayicilar.push(t);

          return t;

        }


        function timerlariTemizle() {

          zamanlayicilar.forEach(
            clearTimeout
          );

          zamanlayicilar = [];

        }



        function baslat() {

          if (basladi) return;

          basladi = true;


          timerlariTemizle();



          /* =====================================
             SESİ BAŞA AL
             ===================================== */

          try {

            netiSes.pause();

            netiSes.currentTime = 0;

          } catch(e) {}



          /* =====================================
             NETİ BAŞLANGIÇ
             ===================================== */

          neti.removeAttribute(
            'animation__buyume'
          );

          neti.removeAttribute(
            'animation__yuksel'
          );


          neti.setAttribute(
            'scale',
            '0.05 0.05 0.05'
          );


          neti.setAttribute(
            'position',
            '0 -0.25 0.03'
          );



          /* =====================================
             NETİ + SES
             ===================================== */

          timer(() => {

            neti.setAttribute(

              'animation__buyume',

              'property: scale;' +
              'from: 0.05 0.05 0.05;' +
              'to: 1 1 1;' +
              'dur: 1100;' +
              'easing: easeOutBack'

            );


            neti.setAttribute(

              'animation__yuksel',

              'property: position;' +
              'from: 0 -0.25 0.03;' +
              'to: 0 0.08 0.03;' +
              'dur: 1100;' +
              'easing: easeOutQuad'

            );


            if (sesHazir) {

              netiSes.currentTime = 0;


              const oynat =
                netiSes.play();


              if (oynat !== undefined) {

                oynat.catch(
                  err => {
                    console.log(
                      'Ses oynatılamadı:',
                      err
                    );
                  }
                );

              }

            }

          }, 100);



          /* =====================================
             A a GELİYOR
             ===================================== */

          harfler.removeAttribute(
            'animation__harf'
          );


          /*
            Göz egzersizi eski bir çalışmadan
            aktif kaldıysa durdur.
          */

          if (
            harfler.components[
              'eye-exercise'
            ]
          ) {

            harfler.components[
              'eye-exercise'
            ].active = false;

          }


          harfler.setAttribute(
            'visible',
            'false'
          );


          harfler.setAttribute(
            'position',
            '0 0.55 0.04'
          );


          harfler.setAttribute(
            'scale',
            '0.01 0.01 0.01'
          );


          timer(() => {

            harfler.setAttribute(
              'visible',
              'true'
            );


            harfler.setAttribute(

              'animation__harf',

              'property: scale;' +
              'from: 0.01 0.01 0.01;' +
              'to: 1 1 1;' +
              'dur: 550;' +
              'easing: easeOutBack'

            );

          }, 1500);



          /* =====================================
             ARI BAŞLANGIÇ
             ===================================== */

          ari.setAttribute(
            'visible',
            'false'
          );


          ari.object3D.position.set(
            -0.48,
            -0.30,
            0.09
          );


          ari.object3D.rotation.set(
            0,
            0,
            0
          );


          ari.object3D.scale.set(
            1,
            1,
            1
          );


          if (
            ari.components[
              'smooth-bee-flight'
            ]
          ) {

            ari.components[
              'smooth-bee-flight'
            ].active = false;

          }



          /* =====================================
             1.7 SN → ARI UÇUYOR
             ===================================== */

          timer(() => {

            const flight =
              ari.components[
                'smooth-bee-flight'
              ];


            if (flight) {

              flight.startFlight();

            }

          }, 1700);



          /* =====================================
             ARI 5.4 SN'DE A'YA ULAŞIYOR.

             1 SANİYE A'NIN ÜSTÜNDE
             BEKLİYOR.

             6.4 SN → ARI KAYBOLUYOR.
             ===================================== */

          timer(() => {

            ari.setAttribute(
              'visible',
              'false'
            );

          }, 6400);



          /* =====================================
             6.6 SN → GÖZ EGZERSİZİ BAŞLIYOR
             ===================================== */

          timer(() => {

            const exercise =
              harfler.components[
                'eye-exercise'
              ];


            if (exercise) {

              exercise.startExercise();

            }

          }, 6600);

        }



        /* =====================================
           HEDEF BULUNDU
           ===================================== */

        target.addEventListener(
          'targetFound',
          () => {

            if (kayipTimer) {

              clearTimeout(
                kayipTimer
              );

              kayipTimer = null;

            }

            baslat();

          }
        );



        /* =====================================
           HEDEF KAYBOLDU
           ===================================== */

        target.addEventListener(
          'targetLost',
          () => {

            if (kayipTimer) {

              clearTimeout(
                kayipTimer
              );

            }


            /*
              KISA KAMERA KAYIPLARINDA
              HER ŞEYİ YENİDEN BAŞLATMIYORUZ.
            */

            kayipTimer =
              setTimeout(() => {

                basladi = false;

                timerlariTemizle();


                try {

                  netiSes.pause();

                  netiSes.currentTime = 0;

                } catch(e) {}


                if (
                  ari.components[
                    'smooth-bee-flight'
                  ]
                ) {

                  ari.components[
                    'smooth-bee-flight'
                  ].active = false;

                }


                if (
                  harfler.components[
                    'eye-exercise'
                  ]
                ) {

                  harfler.components[
                    'eye-exercise'
                  ].active = false;

                }


                ari.setAttribute(
                  'visible',
                  'false'
                );


                harfler.object3D.position.set(
                  0,
                  0.55,
                  0.04
                );

              }, 2000);

          }
        );

      }

    });



    /* =====================================
       A ve küçük a
       ===================================== */

    window.addEventListener(
      'DOMContentLoaded',
      () => {

        const canvas =
          document.querySelector(
            '#harfCanvas'
          );


        const ctx =
          canvas.getContext('2d');


        canvas.width = 1200;

        canvas.height = 600;


        ctx.clearRect(
          0,
          0,
          1200,
          600
        );


        ctx.textAlign =
          'center';


        ctx.textBaseline =
          'middle';


        ctx.lineJoin =
          'round';


        ctx.lineCap =
          'round';



        /* BÜYÜK A */

        ctx.font =
          'bold 390px Arial';


        ctx.lineWidth =
          22;


        ctx.strokeStyle =
          '#FFFFFF';


        ctx.strokeText(
          'A',
          420,
          300
        );


        ctx.fillStyle =
          '#FF6B35';


        ctx.fillText(
          'A',
          420,
          300
        );



        /* KÜÇÜK a */

        ctx.font =
          'bold 390px Arial';


        ctx.lineWidth =
          22;


        ctx.strokeStyle =
          '#FFFFFF';


        ctx.strokeText(
          'ɑ',
          790,
          300
        );


        ctx.fillStyle =
          '#FF6B35';


        ctx.fillText(
          'ɑ',
          790,
          300
        );

      }
    );

  </script>

</head>


<body>


<!-- NETİ SESİ -->

<audio
  id="netiSes"
  src="./Merhaba%20Ben%20Neti%20A%20s.mp3"
  preload="auto"
  playsinline>
</audio>



<!-- BAŞLAT EKRANI -->

<div id="startScreen">

  <button id="startButton">
    🔊 Neti ile Başla
  </button>

  <div id="startText">
    Dokun ve A sayfasını kameraya göster.
  </div>

</div>



<canvas id="harfCanvas"></canvas>



<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets>


    <!-- NETİ -->

    <img
      id="neti"
      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
      crossorigin="anonymous"
    >



    <!-- ARI -->

    <img
      id="ariPNG"
      src="./831FD224-0476-409E-B2D5-24D2A8AD424E.png"
      crossorigin="anonymous"
    >


  </a-assets>



  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>



  <a-entity
    mindar-image-target="targetIndex: 0"
    neti-animation>


    <!-- NETİ -->

    <a-image

      id="netiKarakter"

      src="#neti"

      position="0 -0.25 0.03"

      width="0.75"

      height="0.75"

      scale="0.05 0.05 0.05"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>



    <!-- A a -->

    <a-plane

      id="harfler"

      position="0 0.55 0.04"

      width="0.90"

      height="0.45"

      scale="0.01 0.01 0.01"

      visible="false"

      eye-exercise

      material="
        src: #harfCanvas;
        transparent: true;
        shader: flat;
      ">

    </a-plane>



    <!-- ARI -->

    <a-image

      id="ariKarakter"

      src="#ariPNG"

      position="-0.48 -0.30 0.09"

      width="0.22"

      height="0.22"

      scale="1 1 1"

      rotation="0 0 0"

      visible="false"

      smooth-bee-flight

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>


  </a-entity>


</a-scene>


</body>
</html>
