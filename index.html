<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #harfCanvas {
      display: none;
    }
  </style>

  <script>
    AFRAME.registerComponent('neti-animation', {
      init: function () {

        const target = this.el;
        const neti = document.querySelector('#netiKarakter');
        const harfler = document.querySelector('#harfler');
        const ari = document.querySelector('#ariKarakter');

        let timerNeti;
        let timerHarf;
        let timerAri;

        target.addEventListener('targetFound', () => {

          clearTimeout(timerNeti);
          clearTimeout(timerHarf);
          clearTimeout(timerAri);

          neti.removeAttribute('animation__buyume');
          neti.removeAttribute('animation__yuksel');

          harfler.removeAttribute('animation__harf');

          ari.removeAttribute('animation__buyume');
          ari.removeAttribute('animation__ucus');

          // BAŞLANGIÇ
          neti.setAttribute('scale', '0.05 0.05 0.05');
          neti.setAttribute('position', '0 -0.25 0.03');

          harfler.setAttribute('scale', '0.01 0.01 0.01');
          harfler.setAttribute('visible', 'false');

          ari.setAttribute('scale', '0.01 0.01 0.01');
          ari.setAttribute('position', '-0.38 0.28 0.07');
          ari.setAttribute('visible', 'false');

          // 1 — NETİ
          timerNeti = setTimeout(() => {

            neti.setAttribute(
              'animation__buyume',
              'property: scale; from: 0.05 0.05 0.05; to: 1 1 1; dur: 1500; easing: easeOutBack'
            );

            neti.setAttribute(
              'animation__yuksel',
              'property: position; from: 0 -0.25 0.03; to: 0 0.08 0.03; dur: 1500; easing: easeOutQuad'
            );

          }, 100);

          // 2 — A a
          timerHarf = setTimeout(() => {

            harfler.setAttribute('visible', 'true');

            harfler.setAttribute(
              'animation__harf',
              'property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 800; easing: easeOutBack'
            );

          }, 1700);

          // 3 — ARI
          timerAri = setTimeout(() => {

            ari.setAttribute('visible', 'true');

            ari.setAttribute(
              'animation__buyume',
              'property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 600; easing: easeOutBack'
            );

            ari.setAttribute(
              'animation__ucus',
              'property: position; from: -0.38 0.28 0.07; to: 0.38 0.28 0.07; dur: 2300; easing: easeInOutSine'
            );

          }, 2800);

        });


        target.addEventListener('targetLost', () => {

          clearTimeout(timerNeti);
          clearTimeout(timerHarf);
          clearTimeout(timerAri);

          neti.removeAttribute('animation__buyume');
          neti.removeAttribute('animation__yuksel');

          harfler.removeAttribute('animation__harf');

          ari.removeAttribute('animation__buyume');
          ari.removeAttribute('animation__ucus');

          neti.setAttribute('scale', '0.05 0.05 0.05');
          neti.setAttribute('position', '0 -0.25 0.03');

          harfler.setAttribute('scale', '0.01 0.01 0.01');
          harfler.setAttribute('visible', 'false');

          ari.setAttribute('scale', '0.01 0.01 0.01');
          ari.setAttribute('position', '-0.38 0.28 0.07');
          ari.setAttribute('visible', 'false');

        });

      }
    });


    window.addEventListener('DOMContentLoaded', () => {

      const canvas = document.querySelector('#harfCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = 1024;
      canvas.height = 512;

      ctx.clearRect(0, 0, 1024, 512);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = 'bold 330px Arial';
      ctx.lineWidth = 18;

      ctx.strokeStyle = '#FFFFFF';
      ctx.strokeText('A a', 512, 255);

      ctx.fillStyle = '#FF6B35';
      ctx.fillText('A a', 512, 255);

    });
  </script>

</head>

<body>

<canvas id="harfCanvas"></canvas>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>

    <!-- NETİ -->
    <img
      id="neti"
      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
      crossorigin="anonymous">

    <!-- ARI -->
    <img
      id="ariPNG"
      src="./831FD224-0476-409E-B2D5-24D2A8AD424E.png"
      crossorigin="anonymous">

  </a-assets>


  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <a-entity
    mindar-image-target="targetIndex: 0"
    neti-animation>


    <!-- NETİ -->
    <a-image
      id="netiKarakter"
      src="#neti"
      position="0 -0.25 0.03"
      width="0.75"
      height="0.75"
      scale="0.05 0.05 0.05"
      material="shader: flat; transparent: true; alphaTest: 0.01">
    </a-image>


    <!-- A a -->
    <a-plane
      id="harfler"
      position="0 0.55 0.04"
      width="0.9"
      height="0.45"
      scale="0.01 0.01 0.01"
      visible="false"
      material="src: #harfCanvas; transparent: true; shader: flat;">
    </a-plane>


    <!-- ARI -->
    <a-image
      id="ariKarakter"
      src="#ariPNG"
      position="-0.38 0.28 0.07"
      width="0.30"
      height="0.30"
      scale="0.01 0.01 0.01"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01">
    </a-image>


  </a-entity>

</a-scene>

</body>
</html>
