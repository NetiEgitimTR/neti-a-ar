<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #harfCanvas {
      display: none;
    }
  </style>

  <script>
    AFRAME.registerComponent('neti-animation', {
      init: function () {

        const target = this.el;
        const neti = document.querySelector('#netiKarakter');
        const harfler = document.querySelector('#harfler');
        const ari = document.querySelector('#ariKarakter');

        let basladi = false;
        let kayipTimer = null;
        let timers = [];

        function timer(fn, ms) {
          const t = setTimeout(fn, ms);
          timers.push(t);
        }

        function animasyonlariTemizle() {
          timers.forEach(clearTimeout);
          timers = [];

          neti.removeAttribute('animation__buyume');
          neti.removeAttribute('animation__yuksel');

          harfler.removeAttribute('animation__harf');

          ari.removeAttribute('animation__buyume');
          ari.removeAttribute('animation__yol');
          ari.removeAttribute('animation__egim');
        }

        function ariHareket(
          from,
          to,
          sure,
          baslangicAci,
          bitisAci
        ) {

          ari.removeAttribute('animation__yol');
          ari.removeAttribute('animation__egim');

          ari.setAttribute(
            'animation__yol',
            `property: position;
             from: ${from};
             to: ${to};
             dur: ${sure};
             easing: easeInOutSine`
          );

          ari.setAttribute(
            'animation__egim',
            `property: rotation;
             from: 0 0 ${baslangicAci};
             to: 0 0 ${bitisAci};
             dur: ${sure};
             easing: easeInOutSine`
          );
        }

        function sahneyiBaslat() {

          if (basladi) return;

          basladi = true;

          animasyonlariTemizle();

          /* NETİ BAŞLANGIÇ */

          neti.setAttribute(
            'scale',
            '0.05 0.05 0.05'
          );

          neti.setAttribute(
            'position',
            '0 -0.25 0.03'
          );


          /* HARFLER */

          harfler.setAttribute(
            'scale',
            '0.01 0.01 0.01'
          );

          harfler.setAttribute(
            'visible',
            'false'
          );


          /* ARI */

          ari.setAttribute(
            'visible',
            'false'
          );

          ari.setAttribute(
            'scale',
            '0.01 0.01 0.01'
          );

          ari.setAttribute(
            'position',
            '-0.47 -0.32 0.08'
          );

          ari.setAttribute(
            'rotation',
            '0 0 -20'
          );


          /* 1 — NETİ ÇIKIYOR */

          timer(() => {

            neti.setAttribute(
              'animation__buyume',
              'property: scale; from: 0.05 0.05 0.05; to: 1 1 1; dur: 1400; easing: easeOutBack'
            );

            neti.setAttribute(
              'animation__yuksel',
              'property: position; from: 0 -0.25 0.03; to: 0 0.08 0.03; dur: 1400; easing: easeOutQuad'
            );

          }, 100);


          /* 2 — A ɑ GELİYOR */

          timer(() => {

            harfler.setAttribute(
              'visible',
              'true'
            );

            harfler.setAttribute(
              'animation__harf',
              'property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 700; easing: easeOutBack'
            );

          }, 1600);


          /* 3 — ARI BAŞLIYOR */

          timer(() => {

            ari.setAttribute(
              'visible',
              'true'
            );

            ari.setAttribute(
              'animation__buyume',
              'property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 450; easing: easeOutBack'
            );

            /*
              SOL ALT → İLK TEPE
            */

            ariHareket(
              '-0.47 -0.32 0.08',
              '-0.28 -0.05 0.08',
              700,
              -20,
              -35
            );

          }, 2600);


          /*
            İLK TEPE → AŞAĞI
          */

          timer(() => {

            ariHareket(
              '-0.28 -0.05 0.08',
              '-0.05 -0.27 0.08',
              650,
              -35,
              25
            );

          }, 3300);


          /*
            AŞAĞI → İKİNCİ TEPE
          */

          timer(() => {

            ariHareket(
              '-0.05 -0.27 0.08',
              '0.16 -0.08 0.08',
              650,
              25,
              -30
            );

          }, 3950);


          /*
            İKİNCİ TEPE → AŞAĞI
          */

          timer(() => {

            ariHareket(
              '0.16 -0.08 0.08',
              '0.31 -0.25 0.08',
              600,
              -30,
              20
            );

          }, 4600);


          /*
            SAĞ TARAFTAN YUKARI
          */

          timer(() => {

            ariHareket(
              '0.31 -0.25 0.08',
              '0.46 0.08 0.08',
              700,
              20,
              -35
            );

          }, 5200);


          /*
            YUKARI KIVRILIYOR
          */

          timer(() => {

            ariHareket(
              '0.46 0.08 0.08',
              '0.36 0.42 0.08',
              700,
              -35,
              -60
            );

          }, 5900);


          /*
            A ɑ'NIN ÜSTÜNE GELİYOR
          */

          timer(() => {

            ariHareket(
              '0.36 0.42 0.08',
              '0.10 0.62 0.08',
              650,
              -60,
              -90
            );

          }, 6600);


          /*
            HARFLERİN ETRAFINDA
            SOLA DOĞRU KIVRILIYOR
          */

          timer(() => {

            ariHareket(
              '0.10 0.62 0.08',
              '-0.20 0.60 0.08',
              600,
              -90,
              -140
            );

          }, 7250);


          /*
            SON KONUM
          */

          timer(() => {

            ariHareket(
              '-0.20 0.60 0.08',
              '-0.05 0.48 0.08',
              550,
              -140,
              0
            );

          }, 7850);

        }


        target.addEventListener(
          'targetFound',
          () => {

            if (kayipTimer) {
              clearTimeout(kayipTimer);
              kayipTimer = null;
            }

            sahneyiBaslat();

          }
        );


        /*
          TİTREMEYİ AZALTMAK İÇİN
          HEDEF KAYBOLUNCA 2 SANİYE BEKLE
        */

        target.addEventListener(
          'targetLost',
          () => {

            if (kayipTimer) {
              clearTimeout(kayipTimer);
            }

            kayipTimer = setTimeout(() => {

              basladi = false;

              animasyonlariTemizle();

              neti.setAttribute(
                'scale',
                '0.05 0.05 0.05'
              );

              harfler.setAttribute(
                'visible',
                'false'
              );

              ari.setAttribute(
                'visible',
                'false'
              );

            }, 2000);

          }
        );

      }
    });


    /*
      A ve KÜÇÜK a
    */

    window.addEventListener(
      'DOMContentLoaded',
      () => {

        const canvas =
          document.querySelector('#harfCanvas');

        const ctx =
          canvas.getContext('2d');

        canvas.width = 1200;
        canvas.height = 600;

        ctx.clearRect(
          0,
          0,
          1200,
          600
        );

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        /*
          BÜYÜK A
        */

        ctx.font =
          'bold 390px Arial';

        ctx.lineWidth = 22;

        ctx.strokeStyle =
          '#FFFFFF';

        ctx.strokeText(
          'A',
          420,
          300
        );

        ctx.fillStyle =
          '#FF6B35';

        ctx.fillText(
          'A',
          420,
          300
        );


        /*
          KÜÇÜK a

          Tek katlı "ɑ" kullanıyoruz.
          Böylece okulda öğretilen
          küçük a görünümüne daha yakın.
        */

        ctx.font =
          'bold 390px Arial';

        ctx.lineWidth = 22;

        ctx.strokeStyle =
          '#FFFFFF';

        ctx.strokeText(
          'ɑ',
          790,
          300
        );

        ctx.fillStyle =
          '#FF6B35';

        ctx.fillText(
          'ɑ',
          790,
          300
        );

      }
    );

  </script>

</head>


<body>

<canvas id="harfCanvas"></canvas>


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets>


    <!-- NETİ -->

    <img
      id="neti"
      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
      crossorigin="anonymous"
    >


    <!-- ARI -->

    <img
      id="ariPNG"
      src="./831FD224-0476-409E-B2D5-24D2A8AD424E.png"
      crossorigin="anonymous"
    >


  </a-assets>


  <a-camera

    position="0 0 0"

    look-controls="
      enabled: false
    ">

  </a-camera>


  <a-entity

    mindar-image-target="
      targetIndex: 0
    "

    neti-animation>


    <!-- NETİ -->

    <a-image

      id="netiKarakter"

      src="#neti"

      position="
        0 -0.25 0.03
      "

      width="0.75"

      height="0.75"

      scale="
        0.05 0.05 0.05
      "

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>


    <!-- A ɑ -->

    <a-plane

      id="harfler"

      position="
        0 0.55 0.04
      "

      width="0.90"

      height="0.45"

      scale="
        0.01 0.01 0.01
      "

      visible="false"

      material="
        src: #harfCanvas;
        transparent: true;
        shader: flat;
      ">

    </a-plane>


    <!-- ARI -->

    <a-image

      id="ariKarakter"

      src="#ariPNG"

      position="
        -0.47 -0.32 0.08
      "

      width="0.25"

      height="0.25"

      scale="
        0.01 0.01 0.01
      "

      rotation="
        0 0 -20
      "

      visible="false"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>


  </a-entity>


</a-scene>

</body>
</html>
