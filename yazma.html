<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(255,248,225,.97);
}

#startButton{
  border:0;
  border-radius:26px;
  padding:18px 28px;
  background:#ff8a3d;
  color:white;
  font-size:22px;
  font-weight:700;
  box-shadow:0 6px 18px rgba(0,0,0,.2);
}

#startText{
  margin-top:15px;
  font-size:16px;
  color:#555;
}

#drawCanvas{
  display:none;
}
</style>
</head>

<body>

<div id="startScreen">
  <button id="startButton">
    ✏️ Neti ile küçük a yazalım
  </button>

  <div id="startText">
    Yazma sayfasını kameraya göster.
  </div>
</div>

<canvas id="drawCanvas" width="1200" height="1200"></canvas>

<script>

let userStarted = false;

window.addEventListener("DOMContentLoaded",()=>{

  document.querySelector("#startButton")
  .addEventListener("click",()=>{

    userStarted = true;

    document.querySelector("#startScreen")
      .style.display="none";

    window.dispatchEvent(
      new Event("neti-start")
    );

  });

});


AFRAME.registerComponent("neti-writing",{

init:function(){

  const target=this.el;

  const canvas=document.querySelector("#drawCanvas");
  const ctx=canvas.getContext("2d");

  const plane=document.querySelector("#drawPlane");
  const neti=document.querySelector("#neti");

  let targetVisible=false;
  let started=false;

  let timers=[];
  let raf=null;

  let round=1;


  /* ==============================
     TEXTURE UPDATE
  ============================== */

  function update(){

    const mesh=plane.getObject3D("mesh");

    if(
      mesh &&
      mesh.material &&
      mesh.material.map
    ){
      mesh.material.map.needsUpdate=true;
    }
  }


  function later(fn,ms){

    const id=setTimeout(fn,ms);
    timers.push(id);

    return id;
  }


  /* ==============================
     CANVAS
  ============================== */

  function clearAll(){

    ctx.clearRect(
      0,0,
      canvas.width,
      canvas.height
    );

    update();
  }


  /* ==============================
     a GEOMETRİSİ
  ============================== */

  /*
     DİK ÇİZGİ ARTIK
     c'DEN DAHA YUKARIDAN BAŞLIYOR.
  */

  const STEM_X = 760;

  const STEM_TOP = 270;
  const JOIN_TOP = 390;
  const JOIN_BOTTOM = 790;
  const STEM_BOTTOM = 850;


  function bezier(p0,p1,p2,count){

    const arr=[];

    for(let i=0;i<=count;i++){

      const t=i/count;
      const m=1-t;

      arr.push({

        x:
          m*m*p0.x+
          2*m*t*p1.x+
          t*t*p2.x,

        y:
          m*m*p0.y+
          2*m*t*p1.y+
          t*t*p2.y

      });

    }

    return arr;
  }


  function cPath(){

    const p=[];

    /*
       Başlangıç sağ üst birleşme noktası.
    */

    p.push(
      ...bezier(
        {x:760,y:390},
        {x:650,y:295},
        {x:525,y:300},
        45
      )
    );

    p.push(
      ...bezier(
        {x:525,y:300},
        {x:300,y:300},
        {x:300,y:560},
        60
      )
    );

    p.push(
      ...bezier(
        {x:300,y:560},
        {x:300,y:830},
        {x:535,y:830},
        60
      )
    );

    p.push(
      ...bezier(
        {x:535,y:830},
        {x:675,y:830},
        {x:760,y:790},
        45
      )
    );

    return p;
  }


  function stemPath(){

    const p=[];

    for(let i=0;i<=100;i++){

      const t=i/100;

      p.push({
        x:STEM_X,
        y:
          STEM_TOP+
          (STEM_BOTTOM-STEM_TOP)*t
      });

    }

    return p;
  }


  /* ==============================
     PATH DRAW
  ============================== */

  function strokePath(
    points,
    color,
    width,
    dash=[]
  ){

    ctx.save();

    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.setLineDash(dash);

    ctx.beginPath();

    ctx.moveTo(
      points[0].x,
      points[0].y
    );

    for(let i=1;i<points.length;i++){

      ctx.lineTo(
        points[i].x,
        points[i].y
      );

    }

    ctx.stroke();

    ctx.restore();
  }


  /* ==============================
     GRİ KILAVUZ
  ============================== */

  function drawGuide(){

    strokePath(
      cPath(),
      "rgba(125,135,145,.48)",
      92
    );

    strokePath(
      stemPath(),
      "rgba(125,135,145,.48)",
      92
    );

    update();
  }


  /* ==============================
     OK
  ============================== */

  function arrow(x,y,angle){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    /*
      SARI OK
      BEYAZ KENAR
    */

    ctx.beginPath();

    ctx.moveTo(-36,-18);
    ctx.lineTo(5,-18);
    ctx.lineTo(5,-34);
    ctx.lineTo(45,0);
    ctx.lineTo(5,34);
    ctx.lineTo(5,18);
    ctx.lineTo(-36,18);

    ctx.closePath();

    ctx.lineWidth=8;
    ctx.strokeStyle="white";
    ctx.fillStyle="#ffd400";

    ctx.stroke();
    ctx.fill();

    ctx.restore();
  }


  /* ==============================
     NUMARA
  ============================== */

  function numberCircle(
    x,y,text,color
  ){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      x,y,
      43,
      0,
      Math.PI*2
    );

    ctx.fillStyle=color;
    ctx.fill();

    ctx.lineWidth=8;
    ctx.strokeStyle="white";
    ctx.stroke();

    ctx.fillStyle="white";

    ctx.font="bold 48px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      text,
      x,
      y+2
    );

    ctx.restore();
  }


  /* ==============================
     KESİK YOL + OKLAR
  ============================== */

  function drawDirections(){

    /*
      BEYAZ KESİK YOL
    */

    strokePath(
      cPath(),
      "rgba(255,255,255,.95)",
      8,
      [22,18]
    );

    strokePath(
      stemPath(),
      "rgba(255,255,255,.95)",
      8,
      [22,18]
    );


    /*
      C YÖN OKLARI
    */

    arrow(
      570,295,
      Math.PI
    );

    arrow(
      300,505,
      Math.PI/2
    );

    arrow(
      405,805,
      .55
    );

    arrow(
      635,820,
      -.35
    );


    /*
      DİK ÇİZGİ
    */

    arrow(
      760,505,
      Math.PI/2
    );

    arrow(
      760,680,
      Math.PI/2
    );


    numberCircle(
      760,
      215,
      "1",
      "#168cff"
    );


    numberCircle(
      845,
      850,
      "2",
      "#ff2f2f"
    );

    update();
  }


  /* ==============================
     YÖNERGE PANELİ
  ============================== */

  function instruction(
    title,
    subtitle
  ){

    /*
      ESKİ YAZI ALANINI
      TAMAMEN TEMİZLE.
      ARTIK YAZILAR ÜST ÜSTE
      BİNMEYECEK.
    */

    ctx.clearRect(
      110,
      20,
      980,
      215
    );


    ctx.save();

    ctx.fillStyle=
      "rgba(255,255,255,.97)";

    ctx.strokeStyle="#ff991f";
    ctx.lineWidth=9;

    ctx.beginPath();

    ctx.roundRect(
      135,
      35,
      930,
      165,
      40
    );

    ctx.fill();
    ctx.stroke();


    ctx.textAlign="center";

    ctx.fillStyle="#143d73";

    ctx.font=
      "bold 48px Arial";

    ctx.fillText(
      title,
      600,
      105
    );


    ctx.fillStyle="#555";

    ctx.font=
      "bold 29px Arial";

    ctx.fillText(
      subtitle,
      600,
      157
    );

    ctx.restore();

    update();
  }


  /* ==============================
     ANİMASYON
  ============================== */

  function animatePath(
    points,
    duration,
    done
  ){

    let start=null;
    let last=0;


    function frame(time){

      if(start===null){
        start=time;
      }

      const progress=
        Math.min(
          (time-start)/duration,
          1
        );


      const end=
        Math.min(
          points.length-1,
          Math.floor(
            progress*
            (points.length-1)
          )
        );


      ctx.save();

      ctx.strokeStyle="#ff3030";
      ctx.lineWidth=62;

      ctx.lineCap="round";
      ctx.lineJoin="round";


      while(last<end){

        ctx.beginPath();

        ctx.moveTo(
          points[last].x,
          points[last].y
        );

        ctx.lineTo(
          points[last+1].x,
          points[last+1].y
        );

        ctx.stroke();

        last++;
      }

      ctx.restore();


      /*
        KIRMIZININ ÜZERİNDE
        BEYAZ KESİK YOL
      */

      const partial=
        points.slice(
          0,
          end+1
        );

      if(partial.length>1){

        strokePath(
          partial,
          "rgba(255,255,255,.92)",
          7,
          [20,17]
        );

      }


      /*
        PARLAYAN KALEM NOKTASI
      */

      const p=points[end];

      ctx.save();

      ctx.shadowColor="#ffd400";
      ctx.shadowBlur=25;

      ctx.beginPath();

      ctx.arc(
        p.x,p.y,
        19,
        0,
        Math.PI*2
      );

      ctx.fillStyle="#fff200";
      ctx.fill();

      ctx.lineWidth=6;
      ctx.strokeStyle="white";
      ctx.stroke();

      ctx.restore();


      update();


      if(progress<1){

        raf=
          requestAnimationFrame(
            frame
          );

      }else{

        raf=null;

        if(done){
          done();
        }

      }

    }


    raf=
      requestAnimationFrame(
        frame
      );

  }


  /* ==============================
     TUR BAŞLAT
  ============================== */

  function startRound(){

    clearAll();

    drawGuide();
    drawDirections();


    if(round===1){

      instruction(
        "1. Önce c çizgisini takip et.",
        "Okları takip ederek yavaşça ilerle."
      );

    }else{

      instruction(
        "Tekrar yazıyoruz...",
        "Aynı hareketi bir kez daha izle."
      );

    }


    later(()=>{

      animatePath(
        cPath(),
        6000,
        startStem
      );

    },1800);

  }


  /* ==============================
     DİK ÇİZGİ
  ============================== */

  function startStem(){

    instruction(
      "2. Şimdi düz çizgiyi çiz.",
      "Yukarıdan aşağı doğru ilerle."
    );


    /*
      c BİTTİKTEN SONRA
      KALEM KALKMIŞ GİBİ
      KISA BEKLEME
    */

    later(()=>{

      animatePath(
        stemPath(),
        4000,
        finished
      );

    },1500);

  }


  /* ==============================
     TUR BİTTİ
  ============================== */

  function finished(){

    if(round===1){

      instruction(
        "Harika! Bir kez daha.",
        "Küçük a harfini tekrar izleyelim."
      );

      round=2;

      later(
        startRound,
        2300
      );

    }else{

      finalScreen();

    }

  }


  /* ==============================
     SON EKRAN
  ============================== */

  function finalScreen(){

    instruction(
      "Şimdi sen de yaz! ✏️",
      "Kitabındaki küçük a harflerini tamamla."
    );


    neti.removeAttribute(
      "animation__finish"
    );


    neti.setAttribute(
      "animation__finish",

      "property: scale;"+
      "from:1 1 1;"+
      "to:1.13 1.13 1.13;"+
      "dir:alternate;"+
      "loop:3;"+
      "dur:320;"+
      "easing:easeInOutQuad"
    );

  }


  /* ==============================
     START
  ============================== */

  function begin(){

    if(started) return;
    if(!targetVisible) return;
    if(!userStarted) return;

    started=true;
    round=1;


    plane.setAttribute(
      "visible",
      "true"
    );


    neti.setAttribute(
      "visible",
      "true"
    );


    neti.setAttribute(
      "scale",
      ".05 .05 .05"
    );


    neti.setAttribute(
      "position",
      "-0.43 0.61 0.07"
    );


    neti.setAttribute(
      "animation__enter",

      "property:scale;"+
      "from:.05 .05 .05;"+
      "to:1 1 1;"+
      "dur:900;"+
      "easing:easeOutBack"
    );


    later(
      startRound,
      1100
    );

  }


  target.addEventListener(
    "targetFound",
    ()=>{

      targetVisible=true;
      begin();

    }
  );


  target.addEventListener(
    "targetLost",
    ()=>{

      targetVisible=false;

    }
  );


  window.addEventListener(
    "neti-start",
    begin
  );

}

});

</script>


<a-scene

mindar-image="
imageTargetSrc: ./targets%202.mind;
filterMinCF:0.0001;
filterBeta:0.01;
"

renderer="
colorManagement:true;
alpha:true;
antialias:true;
"

color-space="sRGB"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false">


<a-assets>

<img
id="netiAsset"
src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
crossorigin="anonymous">

</a-assets>


<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>


<a-entity
mindar-image-target="targetIndex:0"
neti-writing>


<a-image
id="neti"
src="#netiAsset"
position="-0.43 0.61 0.07"
width=".29"
height=".29"
visible="false"
material="
shader:flat;
transparent:true;
alphaTest:.01;
">
</a-image>


<a-plane
id="drawPlane"
position="0 .02 .08"
width="1.15"
height="1.15"
visible="false"
material="
src:#drawCanvas;
transparent:true;
shader:flat;
">
</a-plane>


</a-entity>

</a-scene>

</body>
</html>
