<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:99999;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:rgba(255,248,225,0.97);
}

#startButton{
  border:none;
  border-radius:25px;

  padding:18px 28px;

  font-size:22px;
  font-weight:bold;

  background:#ff8a3d;
  color:white;

  box-shadow:0 6px 16px rgba(0,0,0,0.20);
}

#startText{
  margin-top:15px;
  padding:0 30px;

  font-size:16px;
  color:#555;

  text-align:center;
}

</style>


<script>

/* =========================================
   BAŞLANGIÇ
========================================= */

let kullaniciBaslatti = false;


window.addEventListener(
  "DOMContentLoaded",
  () => {

    const button =
      document.querySelector("#startButton");

    const screen =
      document.querySelector("#startScreen");


    button.addEventListener(
      "click",
      () => {

        kullaniciBaslatti = true;

        screen.style.display = "none";

        window.dispatchEvent(
          new Event("yazma-baslat")
        );

      }
    );

  }
);



/* =========================================
   KÜÇÜK a YAZMA ANİMASYONU
========================================= */

AFRAME.registerComponent(
  "kucuk-a-yazma",
  {

    init:function(){

      const target = this.el;

      const canvas =
        document.querySelector("#yazmaCanvas");

      const ctx =
        canvas.getContext("2d");

      const plane =
        document.querySelector("#yazmaPlane");

      const neti =
        document.querySelector("#netiYazma");


      canvas.width = 800;
      canvas.height = 800;


      let hedefGorunuyor = false;
      let basladi = false;

      let animationFrame = null;
      let timers = [];


      /* =====================================
         YARDIMCI
      ===================================== */

      function timer(fn,ms){

        const id =
          setTimeout(fn,ms);

        timers.push(id);

        return id;
      }


      function temizle(){

        timers.forEach(clearTimeout);
        timers = [];

        if(animationFrame){

          cancelAnimationFrame(
            animationFrame
          );

          animationFrame = null;
        }

      }


      function textureGuncelle(){

        const mesh =
          plane.getObject3D("mesh");

        if(
          mesh &&
          mesh.material &&
          mesh.material.map
        ){

          mesh.material.map.needsUpdate =
            true;
        }
      }


      function canvasTemizle(){

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        textureGuncelle();
      }



      /* =====================================
         KALICI ÇİZGİ ÇİZİMİ

         Önceki sürümde çizim her karede
         tekrar tekrar oluşturuluyordu.

         Şimdi sadece bir önceki noktadan
         yeni noktaya çiziyoruz.
         Böylece c net biçimde kalıyor.
      ===================================== */

      function yoluCiz(
        noktalar,
        sure,
        tamamlandi
      ){

        let baslangicZamani = null;

        let sonCizilenIndex = 0;


        ctx.strokeStyle = "#ff3b30";

        ctx.lineWidth = 34;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";


        function frame(zaman){

          if(!baslangicZamani){

            baslangicZamani = zaman;
          }


          const gecen =
            zaman - baslangicZamani;


          let progress =
            gecen / sure;


          if(progress > 1){

            progress = 1;
          }


          const hedefIndex =
            Math.floor(
              progress *
              (noktalar.length - 1)
            );


          /*
             SADECE YENİ KISMI ÇİZ
          */

          while(
            sonCizilenIndex <
            hedefIndex
          ){

            const p1 =
              noktalar[
                sonCizilenIndex
              ];

            const p2 =
              noktalar[
                sonCizilenIndex + 1
              ];


            ctx.beginPath();

            ctx.moveTo(
              p1.x,
              p1.y
            );

            ctx.lineTo(
              p2.x,
              p2.y
            );

            ctx.stroke();


            sonCizilenIndex++;

          }


          textureGuncelle();


          if(progress < 1){

            animationFrame =
              requestAnimationFrame(
                frame
              );

          }else{

            animationFrame = null;

            if(tamamlandi){

              tamamlandi();
            }
          }
        }


        animationFrame =
          requestAnimationFrame(frame);
      }



      /* =====================================
         1. HAREKET

               c

         BAŞLANGIÇ:
         SAĞ ÜST

         SONRA:
         SOL ÜST
         SOL
         SOL ALT
         ALT
         SAĞ ALT

         ÖNEMLİ:
         ÇEMBERİ KAPATMIYORUZ.
      ===================================== */

      function cCiz(){

        const noktalar = [];


        const cx = 390;
        const cy = 390;

        const rx = 170;
        const ry = 170;


        /*
          Sağ üstten başlıyoruz.

          315° → 45°

          Fakat uzun yoldan:
          315 → 270 → 180 →
          90 → 45

          Canvas koordinatında
          bu bize açık bir c verir.
        */


        const baslangicDerece = -45;

        const bitisDerece = -315;

        const toplamNokta = 100;


        for(
          let i=0;
          i<=toplamNokta;
          i++
        ){

          const t =
            i / toplamNokta;


          const derece =
            baslangicDerece +
            (
              bitisDerece -
              baslangicDerece
            ) * t;


          const aci =
            derece *
            Math.PI / 180;


          noktalar.push({

            x:
              cx +
              Math.cos(aci) *
              rx,

            y:
              cy +
              Math.sin(aci) *
              ry

          });
        }


        yoluCiz(
          noktalar,
          2200,
          () => {

            /*
              c TAMAMLANDI.

              KALEM KALKIYOR.

              700 ms BEKLE.
            */

            timer(
              duzCizgi,
              700
            );

          }
        );
      }



      /* =====================================
         2. HAREKET

         SAĞ TARAFTA

                ↓

         YUKARIDAN AŞAĞIYA
         DÜZ ÇİZGİ
      ===================================== */

      function duzCizgi(){

        const noktalar = [

          {x:560,y:220},

          {x:560,y:260},

          {x:560,y:300},

          {x:560,y:340},

          {x:560,y:380},

          {x:560,y:420},

          {x:560,y:460},

          {x:560,y:500},

          {x:560,y:540},

          {x:560,y:560}

        ];


        yoluCiz(
          noktalar,
          1200,
          () => {

            /*
              KÜÇÜK a TAMAMLANDI
            */

            neti.removeAttribute(
              "animation__tebrik"
            );


            neti.setAttribute(
              "animation__tebrik",

              "property: scale;" +
              "from: 1 1 1;" +
              "to: 1.12 1.12 1.12;" +
              "dir: alternate;" +
              "loop: 2;" +
              "dur: 350;" +
              "easing: easeInOutQuad"
            );

          }
        );
      }



      /* =====================================
         BAŞLAT
      ===================================== */

      function baslat(){

        if(basladi) return;

        if(!hedefGorunuyor) return;

        if(!kullaniciBaslatti) return;


        basladi = true;

        temizle();

        canvasTemizle();


        plane.setAttribute(
          "visible",
          "true"
        );


        /* NETİ */

        neti.removeAttribute(
          "animation__buyume"
        );

        neti.removeAttribute(
          "animation__yuksel"
        );

        neti.removeAttribute(
          "animation__tebrik"
        );


        neti.setAttribute(
          "visible",
          "true"
        );


        neti.setAttribute(
          "scale",
          "0.05 0.05 0.05"
        );


        neti.setAttribute(
          "position",
          "-0.38 0.58 0.05"
        );


        neti.setAttribute(
          "animation__buyume",

          "property: scale;" +
          "from: 0.05 0.05 0.05;" +
          "to: 1 1 1;" +
          "dur: 900;" +
          "easing: easeOutBack"
        );


        neti.setAttribute(
          "animation__yuksel",

          "property: position;" +
          "from: -0.38 0.40 0.05;" +
          "to: -0.38 0.58 0.05;" +
          "dur: 900;" +
          "easing: easeOutQuad"
        );


        /*
          NETİ GELDİKTEN SONRA
          c ÇİZİMİ BAŞLASIN
        */

        timer(
          cCiz,
          1400
        );

      }



      /* =====================================
         TARGET FOUND
      ===================================== */

      target.addEventListener(
        "targetFound",
        () => {

          hedefGorunuyor = true;

          baslat();

        }
      );



      /* =====================================
         TARGET LOST
      ===================================== */

      target.addEventListener(
        "targetLost",
        () => {

          hedefGorunuyor = false;

        }
      );



      /* =====================================
         BUTON
      ===================================== */

      window.addEventListener(
        "yazma-baslat",
        () => {

          baslat();

        }
      );

    }

  }
);

</script>

</head>


<body>


<!-- BAŞLANGIÇ EKRANI -->

<div id="startScreen">

  <button id="startButton">
    ✏️ Neti ile küçük a yazalım
  </button>

  <div id="startText">
    Dokun ve yazma sayfasını kameraya göster.
  </div>

</div>



<!-- ÇİZİM CANVASI -->

<canvas
  id="yazmaCanvas"
  style="display:none;">
</canvas>



<!-- AR -->

<a-scene

  mindar-image="
    imageTargetSrc: ./targets%202.mind;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  ">


  <a-assets>

    <img
      id="netiAsset"
      src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
      crossorigin="anonymous"
    >

  </a-assets>



  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>



  <a-entity

    mindar-image-target="
      targetIndex: 0
    "

    kucuk-a-yazma>


    <!-- NETİ -->

    <a-image

      id="netiYazma"

      src="#netiAsset"

      position="-0.38 0.58 0.05"

      width="0.36"
      height="0.36"

      visible="false"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
      ">

    </a-image>



    <!-- KÜÇÜK a ÇİZİM ALANI -->

    <a-plane

      id="yazmaPlane"

      position="0 0.08 0.08"

      width="1.15"
      height="1.15"

      visible="false"

      material="
        src: #yazmaCanvas;
        transparent: true;
        shader: flat;
      ">

    </a-plane>


  </a-entity>


</a-scene>


</body>
</html>
