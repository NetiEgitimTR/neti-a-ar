<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:10000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(255,248,225,.97);
}

#startButton{
  border:0;
  border-radius:28px;
  padding:18px 28px;
  background:#ff8a3d;
  color:white;
  font-size:21px;
  font-weight:800;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}

#startText{
  margin-top:14px;
  padding:0 25px;
  font-size:16px;
  color:#555;
  text-align:center;
}

#instruction{
  position:fixed;
  z-index:9000;
  top:15%;
  left:50%;
  transform:translateX(-50%);
  width:84vw;
  max-width:480px;
  box-sizing:border-box;
  background:rgba(255,255,255,.97);
  border:4px solid #ff981f;
  border-radius:23px;
  padding:11px 15px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.18);
  display:none;
  pointer-events:none;
}

#instructionTitle{
  color:#143b73;
  font-size:21px;
  font-weight:800;
  line-height:1.15;
}

#instructionText{
  margin-top:5px;
  color:#555;
  font-size:14px;
  font-weight:700;
  line-height:1.2;
}

#drawCanvas{
  display:none;
}
</style>
</head>

<body>

<div id="startScreen">
  <button id="startButton">
    🔊 A - a yazımını başlat
  </button>

  <div id="startText">
    Dokun ve yazma sayfasını kameraya göster.
  </div>
</div>

<div id="instruction">
  <div id="instructionTitle"></div>
  <div id="instructionText"></div>
</div>


<!-- KÜÇÜK a SESLERİ -->
<audio id="sound1" src="./1-c-cizgisi.mp3.mp3" preload="auto" playsinline></audio>
<audio id="sound2" src="./2-duz-cizgi.mp3.mp3" preload="auto" playsinline></audio>
<audio id="sound3" src="./3-bir-kez-daha.mp3.mp3" preload="auto" playsinline></audio>
<audio id="sound4" src="./4-simdi-sen.mp3.mp3" preload="auto" playsinline></audio>

<!-- BÜYÜK A SESLERİ -->
<audio id="sound5" src="./5-buyuk-a-sol.mp3" preload="auto" playsinline></audio>
<audio id="sound6" src="./6-buyuk-a-sag.mp3" preload="auto" playsinline></audio>
<audio id="sound7" src="./7-buyuk-a-orta.mp3" preload="auto" playsinline></audio>
<audio id="sound8" src="./8-buyuk-a-bitti.mp3" preload="auto" playsinline></audio>


<canvas id="drawCanvas" width="1200" height="1200"></canvas>


<script>

/* =====================================================
   GENEL
===================================================== */

let userStarted = false;
let targetVisible = false;

const sounds = [];

for(let i=1;i<=8;i++){
  sounds.push(
    document.getElementById("sound"+i)
  );
}

const sound1 = sounds[0];
const sound2 = sounds[1];
const sound3 = sounds[2];
const sound4 = sounds[3];
const sound5 = sounds[4];
const sound6 = sounds[5];
const sound7 = sounds[6];
const sound8 = sounds[7];


/* =====================================================
   YÖNERGE
===================================================== */

function showMessage(title,text){

  document.getElementById(
    "instructionTitle"
  ).textContent = title;

  document.getElementById(
    "instructionText"
  ).textContent = text;

  document.getElementById(
    "instruction"
  ).style.display = "block";
}


/* =====================================================
   SES
===================================================== */

function stopAllSounds(){

  sounds.forEach(audio=>{

    try{
      audio.pause();
      audio.currentTime=0;
    }catch(e){}

  });
}


async function playSound(audio){

  if(!audio) return;

  stopAllSounds();

  try{

    audio.muted=false;
    audio.volume=1;
    audio.currentTime=0;

    await audio.play();

  }catch(e){

    console.log("Ses hatası:",e);

  }
}


/* =====================================================
   BAŞLATMA BUTONU

   iPHONE SAFARI:
   İLK SES DOĞRUDAN KULLANICI
   DOKUNUŞUYLA BAŞLIYOR.
===================================================== */

document
.getElementById("startButton")
.addEventListener("click",function(){

  userStarted=true;

  document
  .getElementById("startScreen")
  .style.display="none";

  showMessage(
    "1. Önce c çizgisini çiz.",
    "Sarı okları takip et."
  );

  /*
    İLK SESİ DOĞRUDAN
    DOKUNUŞLA BAŞLAT
  */

  sound1.muted=false;
  sound1.volume=1;
  sound1.currentTime=0;

  sound1.play().catch(
    e=>console.log("İlk ses:",e)
  );

  /*
    DİĞER DOSYALARI HAZIRLA
  */

  for(let i=1;i<sounds.length;i++){
    sounds[i].load();
  }

  window.dispatchEvent(
    new Event("user-started")
  );

});


/* =====================================================
   AR
===================================================== */

AFRAME.registerComponent(
"school-a-writing",
{

init:function(){

const target=this.el;

const canvas=
document.getElementById("drawCanvas");

const ctx=
canvas.getContext("2d");

const plane=
document.getElementById("drawPlane");

let animationStarted=false;

let smallRound=1;

let completedSmallC=false;

let bigLeftDone=false;
let bigRightDone=false;
let bigMiddleDone=false;


/* =====================================================
   TEXTURE
===================================================== */

function updateTexture(){

  const mesh=
  plane.getObject3D("mesh");

  if(
    mesh &&
    mesh.material &&
    mesh.material.map
  ){
    mesh.material.map.needsUpdate=true;
  }
}


function clearCanvas(){

  ctx.clearRect(
    0,0,
    canvas.width,
    canvas.height
  );
}


/* =====================================================
   ORTAK PATH
===================================================== */

function drawPath(
points,
color,
width,
dash=[]
){

  if(!points || points.length<2)
    return;

  ctx.save();

  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.setLineDash(dash);

  ctx.beginPath();

  ctx.moveTo(
    points[0].x,
    points[0].y
  );

  for(let i=1;i<points.length;i++){

    ctx.lineTo(
      points[i].x,
      points[i].y
    );
  }

  ctx.stroke();

  ctx.restore();
}


/* =====================================================
   NUMARA
===================================================== */

function numberCircle(
x,y,number,color
){

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    x,y,
    43,
    0,
    Math.PI*2
  );

  ctx.fillStyle=color;
  ctx.fill();

  ctx.strokeStyle="white";
  ctx.lineWidth=7;
  ctx.stroke();

  ctx.fillStyle="white";
  ctx.font="bold 49px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    number,
    x,
    y+2
  );

  ctx.restore();
}


/* =====================================================
   OK
===================================================== */

function arrow(
x,y,rotation
){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(rotation);

  ctx.beginPath();

  ctx.moveTo(-34,-16);
  ctx.lineTo(5,-16);
  ctx.lineTo(5,-29);
  ctx.lineTo(42,0);
  ctx.lineTo(5,29);
  ctx.lineTo(5,16);
  ctx.lineTo(-34,16);

  ctx.closePath();

  ctx.fillStyle="#ffd600";
  ctx.strokeStyle="white";
  ctx.lineWidth=7;

  ctx.stroke();
  ctx.fill();

  ctx.restore();
}


/* =====================================================
   SARI HAREKET NOKTASI
===================================================== */

function drawPoint(points){

  if(!points || !points.length)
    return;

  const p=
  points[points.length-1];

  ctx.save();

  ctx.shadowColor="#ffe600";
  ctx.shadowBlur=25;

  ctx.beginPath();

  ctx.arc(
    p.x,p.y,
    18,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#fff000";
  ctx.fill();

  ctx.strokeStyle="white";
  ctx.lineWidth=5;
  ctx.stroke();

  ctx.restore();
}


/* =====================================================
   ÇİZGİ NOKTALARI OLUŞTUR
===================================================== */

function linePoints(
x1,y1,x2,y2,count=200
){

  const points=[];

  for(let i=0;i<=count;i++){

    const t=i/count;

    points.push({
      x:x1+(x2-x1)*t,
      y:y1+(y2-y1)*t
    });
  }

  return points;
}


/* =====================================================
   KÜÇÜK a
===================================================== */

const CX=520;
const CY=600;
const R=250;

const START_DEG=-40;
const END_DEG=40;


function makeC(){

  const points=[];

  const travel=
  360-(END_DEG-START_DEG);

  const count=400;

  for(let i=0;i<=count;i++){

    const t=i/count;

    const degree=
    START_DEG-(travel*t);

    const angle=
    degree*Math.PI/180;

    points.push({
      x:CX+R*Math.cos(angle),
      y:CY+R*Math.sin(angle)
    });
  }

  return points;
}


const cPoints=makeC();

const joinPoint=cPoints[0];

const STEM_X=joinPoint.x;

const STEM_TOP=
joinPoint.y-95;

const STEM_BOTTOM=
CY+R;

const stemPoints=
linePoints(
  STEM_X,
  STEM_TOP,
  STEM_X,
  STEM_BOTTOM
);


/* =====================================================
   KÜÇÜK a KILAVUZ
===================================================== */

function drawSmallGuide(){

  drawPath(
    cPoints,
    "rgba(120,125,130,.55)",
    112
  );

  drawPath(
    stemPoints,
    "rgba(120,125,130,.55)",
    112
  );

  drawPath(
    cPoints,
    "rgba(225,227,230,.98)",
    78
  );

  drawPath(
    stemPoints,
    "rgba(225,227,230,.98)",
    78
  );

  drawPath(
    cPoints,
    "white",
    8,
    [24,20]
  );

  drawPath(
    stemPoints,
    "white",
    8,
    [24,20]
  );
}


function drawSmallDirections(){

  numberCircle(
    STEM_X+5,
    STEM_TOP-58,
    "1",
    "#1976ff"
  );

  arrow(
    510,340,
    Math.PI
  );

  arrow(
    280,520,
    Math.PI/2
  );

  arrow(
    330,790,
    .65
  );

  arrow(
    570,845,
    -.30
  );

  numberCircle(
    STEM_X+88,
    STEM_BOTTOM,
    "2",
    "#ff2d2d"
  );

  arrow(
    STEM_X,
    530,
    Math.PI/2
  );

  arrow(
    STEM_X,
    710,
    Math.PI/2
  );
}


function drawSmallScene(
active=null
){

  clearCanvas();

  drawSmallGuide();

  if(completedSmallC){

    drawPath(
      cPoints,
      "#ff3030",
      74
    );

    drawPath(
      cPoints,
      "white",
      8,
      [24,20]
    );
  }

  if(active){

    drawPath(
      active,
      "#ff3030",
      74
    );

    drawPath(
      active,
      "white",
      8,
      [24,20]
    );

    drawPoint(active);
  }

  drawSmallDirections();

  updateTexture();
}


/* =====================================================
   ANİMASYON MOTORU
===================================================== */

function animate(
points,
duration,
drawFunction,
callback
){

  let start=null;

  function frame(time){

    if(start===null)
      start=time;

    const progress=
    Math.min(
      (time-start)/duration,
      1
    );

    const index=
    Math.max(
      1,
      Math.floor(
        progress*
        (points.length-1)
      )
    );

    const partial=
    points.slice(
      0,
      index+1
    );

    drawFunction(partial);

    if(progress<1){

      requestAnimationFrame(frame);

    }else{

      if(callback)
        callback();
    }
  }

  requestAnimationFrame(frame);
}


/* =====================================================
   KÜÇÜK a AKIŞI
===================================================== */

function startSmallC(){

  completedSmallC=false;

  drawSmallScene();

  showMessage(
    "1. Önce c çizgisini çiz.",
    "Sarı okları takip et."
  );

  /*
    2. TURDA SESİ
    TEKRAR ÇAL
  */

  if(smallRound===2){
    playSound(sound1);
  }

  setTimeout(()=>{

    animate(
      cPoints,
      6500,
      drawSmallScene,
      startSmallStem
    );

  },700);
}


function startSmallStem(){

  completedSmallC=true;

  drawSmallScene();

  showMessage(
    "2. Şimdi düz çizgiyi çiz.",
    "Yukarıdan aşağı doğru ilerle."
  );

  playSound(sound2);

  setTimeout(()=>{

    animate(
      stemPoints,
      4000,
      drawSmallScene,
      smallRoundFinished
    );

  },700);
}


function smallRoundFinished(){

  completedSmallC=true;

  drawSmallScene(
    stemPoints
  );

  if(smallRound===1){

    showMessage(
      "Harika! Bir kez daha yazalım.",
      "Aynı hareketleri tekrar izle."
    );

    playSound(sound3);

    smallRound=2;

    let moved=false;

    function next(){

      if(moved) return;

      moved=true;

      setTimeout(
        startSmallC,
        500
      );
    }

    sound3.onended=next;

    setTimeout(
      next,
      6000
    );

  }else{

    finishSmallA();
  }
}


/* =====================================================
   KÜÇÜK a BİTTİ
===================================================== */

function finishSmallA(){

  completedSmallC=true;

  drawSmallScene(
    stemPoints
  );

  showMessage(
    "Harika! Küçük a tamamlandı.",
    "Şimdi büyük A harfine geçiyoruz."
  );

  /*
    4. SES:
    ŞİMDİ SIRA SENDE
  */

  playSound(sound4);

  let moved=false;

  function goBig(){

    if(moved) return;

    moved=true;

    setTimeout(
      startBigA,
      700
    );
  }

  sound4.onended=goBig;

  setTimeout(
    goBig,
    6500
  );
}


/* =====================================================
   BÜYÜK A GEOMETRİSİ

              TEPE
               /\
              /  \
             /----\
            /      \

   1 = tepeden sol alta
   2 = tepeden sağ alta
   3 = soldan sağa orta
===================================================== */

const A_TOP_X=600;
const A_TOP_Y=255;

const A_LEFT_X=345;
const A_LEFT_Y=875;

const A_RIGHT_X=855;
const A_RIGHT_Y=875;


/*
   ORTA ÇİZGİYİ
   İKİ EĞİK ÇİZGİYE
   TAM BAĞLIYORUZ.
*/

const BAR_Y=635;


/*
   SOL EĞİK ÜZERİNDE
   BAR_Y NOKTASI
*/

const leftRatio=
(BAR_Y-A_TOP_Y)/
(A_LEFT_Y-A_TOP_Y);

const BAR_LEFT_X=
A_TOP_X+
(A_LEFT_X-A_TOP_X)*
leftRatio;


/*
   SAĞ EĞİK ÜZERİNDE
*/

const rightRatio=
(BAR_Y-A_TOP_Y)/
(A_RIGHT_Y-A_TOP_Y);

const BAR_RIGHT_X=
A_TOP_X+
(A_RIGHT_X-A_TOP_X)*
rightRatio;


const bigLeft=
linePoints(
  A_TOP_X,
  A_TOP_Y,
  A_LEFT_X,
  A_LEFT_Y,
  240
);

const bigRight=
linePoints(
  A_TOP_X,
  A_TOP_Y,
  A_RIGHT_X,
  A_RIGHT_Y,
  240
);

const bigMiddle=
linePoints(
  BAR_LEFT_X,
  BAR_Y,
  BAR_RIGHT_X,
  BAR_Y,
  180
);


/* =====================================================
   BÜYÜK A KILAVUZ
===================================================== */

function drawBigGuide(){

  /*
    DIŞ GRİ
  */

  drawPath(
    bigLeft,
    "rgba(120,125,130,.55)",
    108
  );

  drawPath(
    bigRight,
    "rgba(120,125,130,.55)",
    108
  );

  drawPath(
    bigMiddle,
    "rgba(120,125,130,.55)",
    108
  );


  /*
    İÇ AÇIK GRİ
  */

  drawPath(
    bigLeft,
    "rgba(225,227,230,.98)",
    75
  );

  drawPath(
    bigRight,
    "rgba(225,227,230,.98)",
    75
  );

  drawPath(
    bigMiddle,
    "rgba(225,227,230,.98)",
    75
  );


  /*
    BEYAZ KESİKLİ ORTA
  */

  drawPath(
    bigLeft,
    "white",
    8,
    [24,20]
  );

  drawPath(
    bigRight,
    "white",
    8,
    [24,20]
  );

  drawPath(
    bigMiddle,
    "white",
    8,
    [24,20]
  );
}


/* =====================================================
   BÜYÜK A YÖNLERİ
===================================================== */

function drawBigDirections(){

  /*
    1
  */

  numberCircle(
    A_TOP_X-85,
    A_TOP_Y-45,
    "1",
    "#1976ff"
  );

  /*
    SOL ALTA OKLAR
  */

  arrow(
    505,
    455,
    1.96
  );

  arrow(
    415,
    700,
    1.96
  );


  /*
    2
  */

  numberCircle(
    A_TOP_X+85,
    A_TOP_Y-45,
    "2",
    "#ff2d2d"
  );

  /*
    SAĞ ALTA OKLAR
  */

  arrow(
    695,
    455,
    1.18
  );

  arrow(
    790,
    700,
    1.18
  );


  /*
    3
  */

  numberCircle(
    BAR_LEFT_X-75,
    BAR_Y,
    "3",
    "#7b4dff"
  );

  /*
    SOLDAN SAĞA
  */

  arrow(
    600,
    BAR_Y,
    0
  );
}


/* =====================================================
   BÜYÜK A SAHNESİ
===================================================== */

function drawBigScene(
active=null
){

  clearCanvas();

  drawBigGuide();


  /*
    TAMAMLANMIŞ ÇİZGİLER
  */

  if(bigLeftDone){

    drawPath(
      bigLeft,
      "#ff3030",
      72
    );

    drawPath(
      bigLeft,
      "white",
      8,
      [24,20]
    );
  }


  if(bigRightDone){

    drawPath(
      bigRight,
      "#ff3030",
      72
    );

    drawPath(
      bigRight,
      "white",
      8,
      [24,20]
    );
  }


  if(bigMiddleDone){

    drawPath(
      bigMiddle,
      "#ff3030",
      72
    );

    drawPath(
      bigMiddle,
      "white",
      8,
      [24,20]
    );
  }


  /*
    ŞU ANDA ÇİZİLEN
  */

  if(active){

    drawPath(
      active,
      "#ff3030",
      72
    );

    drawPath(
      active,
      "white",
      8,
      [24,20]
    );

    drawPoint(active);
  }


  drawBigDirections();

  updateTexture();
}


/* =====================================================
   BÜYÜK A BAŞLA
===================================================== */

function startBigA(){

  bigLeftDone=false;
  bigRightDone=false;
  bigMiddleDone=false;

  drawBigScene();

  showMessage(
    "Şimdi büyük A harfini yazalım.",
    "1. Yukarıdan başlayıp sol alta doğru eğik çiz."
  );

  playSound(sound5);

  setTimeout(()=>{

    animate(
      bigLeft,
      4200,
      drawBigScene,
      startBigRight
    );

  },900);
}


/* =====================================================
   BÜYÜK A - 2
===================================================== */

function startBigRight(){

  bigLeftDone=true;

  drawBigScene();

  showMessage(
    "2. Tekrar yukarıdan başla.",
    "Bu kez sağ alta doğru eğik çiz."
  );

  playSound(sound6);

  setTimeout(()=>{

    animate(
      bigRight,
      4200,
      drawBigScene,
      startBigMiddle
    );

  },900);
}


/* =====================================================
   BÜYÜK A - 3
===================================================== */

function startBigMiddle(){

  bigLeftDone=true;
  bigRightDone=true;

  drawBigScene();

  showMessage(
    "3. Şimdi ortadaki çizgiyi çiz.",
    "Soldan sağa doğru ilerle."
  );

  playSound(sound7);

  setTimeout(()=>{

    animate(
      bigMiddle,
      3200,
      drawBigScene,
      finishBigA
    );

  },900);
}


/* =====================================================
   BÜYÜK A BİTTİ
===================================================== */

function finishBigA(){

  bigLeftDone=true;
  bigRightDone=true;
  bigMiddleDone=true;

  drawBigScene();

  showMessage(
    "Harika! Büyük A harfini de tamamladın.",
    "Şimdi sıra sende!"
  );

  playSound(sound8);
}


/* =====================================================
   AR BAŞLAT
===================================================== */

function tryStart(){

  if(animationStarted)
    return;

  if(!userStarted)
    return;

  if(!targetVisible)
    return;

  animationStarted=true;

  plane.setAttribute(
    "visible",
    "true"
  );

  setTimeout(
    startSmallC,
    400
  );
}


/* =====================================================
   TARGET
===================================================== */

target.addEventListener(
"targetFound",
function(){

  targetVisible=true;

  tryStart();
});


target.addEventListener(
"targetLost",
function(){

  targetVisible=false;
});


window.addEventListener(
"user-started",
tryStart
);

}

});
</script>


<a-scene

mindar-image="
imageTargetSrc: ./targets%202.mind;
filterMinCF:0.0001;
filterBeta:0.01;
"

renderer="
colorManagement:true;
alpha:true;
antialias:true;
"

color-space="sRGB"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false">


<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>


<a-entity
mindar-image-target="targetIndex:0"
school-a-writing>
