<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:10000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(255,248,225,.97);
}

#startButton{
  border:0;
  border-radius:28px;
  padding:18px 28px;
  background:#ff8a3d;
  color:white;
  font-size:21px;
  font-weight:800;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}

#startText{
  margin-top:14px;
  padding:0 25px;
  font-size:16px;
  color:#555;
  text-align:center;
}

#instruction{
  position:fixed;
  z-index:9000;
  top:15%;
  left:50%;
  transform:translateX(-50%);
  width:82vw;
  max-width:470px;
  box-sizing:border-box;
  background:rgba(255,255,255,.97);
  border:4px solid #ff981f;
  border-radius:23px;
  padding:11px 15px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.18);
  display:none;
  pointer-events:none;
}

#instructionTitle{
  color:#143b73;
  font-size:21px;
  font-weight:800;
}

#instructionText{
  margin-top:5px;
  color:#555;
  font-size:14px;
  font-weight:700;
}

#drawCanvas{
  display:none;
}
</style>
</head>

<body>

<div id="startScreen">

  <button id="startButton">
    🔊 Küçük a yazımını başlat
  </button>

  <div id="startText">
    Dokun ve yazma sayfasını kameraya göster.
  </div>

</div>


<div id="instruction">

  <div id="instructionTitle"></div>

  <div id="instructionText"></div>

</div>


<!-- SES DOSYALARI -->

<audio
id="sound1"
src="./1-c-cizgisi.mp3.mp3"
preload="auto"
playsinline>
</audio>

<audio
id="sound2"
src="./2-duz-cizgi.mp3.mp3"
preload="auto"
playsinline>
</audio>

<audio
id="sound3"
src="./3-bir-kez-daha.mp3.mp3"
preload="auto"
playsinline>
</audio>

<audio
id="sound4"
src="./4-simdi-sen.mp3.mp3"
preload="auto"
playsinline>
</audio>


<canvas
id="drawCanvas"
width="1200"
height="1200">
</canvas>


<script>

/* =====================================================
   GENEL
===================================================== */

let userStarted = false;

let firstSoundStarted = false;

let firstSoundFinished = false;

let targetVisible = false;


const sound1 =
document.getElementById("sound1");

const sound2 =
document.getElementById("sound2");

const sound3 =
document.getElementById("sound3");

const sound4 =
document.getElementById("sound4");


const sounds =
[
  sound1,
  sound2,
  sound3,
  sound4
];


/* =====================================================
   YÖNERGE
===================================================== */

function showMessage(title,text){

  const box =
  document.getElementById("instruction");

  document.getElementById(
    "instructionTitle"
  ).textContent = title;

  document.getElementById(
    "instructionText"
  ).textContent = text;

  box.style.display = "block";

}


/* =====================================================
   SES OYNAT
===================================================== */

function stopAllSounds(){

  sounds.forEach(audio=>{

    try{

      audio.pause();

      audio.currentTime = 0;

    }catch(e){}

  });

}


async function playSound(audio){

  if(!audio) return;

  stopAllSounds();

  try{

    audio.muted = false;

    audio.volume = 1;

    audio.currentTime = 0;

    await audio.play();

  }

  catch(error){

    console.log(
      "SES HATASI:",
      error
    );

  }

}


/* =====================================================
   BAŞLAT BUTONU

   ÖNEMLİ:
   1. SES DOĞRUDAN KULLANICI
   DOKUNUŞUNDA ÇALIYOR.
===================================================== */

document
.getElementById("startButton")
.addEventListener("click",function(){

  userStarted = true;


  /*
    ÖNCE EKRANI KAPAT
  */

  document
  .getElementById("startScreen")
  .style.display = "none";


  /*
    YÖNERGEYİ HEMEN GÖSTER
  */

  showMessage(
    "1. Önce c çizgisini çiz.",
    "Sarı okları takip et."
  );


  /*
    SAFARI İÇİN:

    SESİ DOĞRUDAN
    BU DOKUNUŞLA BAŞLATIYORUZ.
  */

  sound1.muted = false;

  sound1.volume = 1;

  sound1.currentTime = 0;


  const promise =
  sound1.play();


  firstSoundStarted = true;


  if(promise){

    promise
    .then(()=>{

      console.log(
        "1. ses başladı."
      );

    })

    .catch(error=>{

      console.log(
        "1. ses açılamadı:",
        error
      );

    });

  }


  /*
    DİĞER SESLERİ DE
    SAFARI'YE TANITIYORUZ.
  */

  sound2.load();

  sound3.load();

  sound4.load();


  window.dispatchEvent(
    new Event("user-started")
  );

});


/* =====================================================
   1. SES BİTTİĞİNDE
===================================================== */

sound1.addEventListener(
"ended",
function(){

  firstSoundFinished = true;

  window.dispatchEvent(
    new Event("first-sound-finished")
  );

});


/* =====================================================
   AR BİLEŞENİ
===================================================== */

AFRAME.registerComponent(
"school-a-writing",
{

init:function(){

const target = this.el;

const canvas =
document.getElementById(
  "drawCanvas"
);

const ctx =
canvas.getContext("2d");

const plane =
document.getElementById(
  "drawPlane"
);


let animationStarted = false;

let round = 1;

let completedC = false;


/* =====================================================
   TEXTURE
===================================================== */

function updateTexture(){

  const mesh =
  plane.getObject3D("mesh");

  if(
    mesh &&
    mesh.material &&
    mesh.material.map
  ){

    mesh.material.map.needsUpdate =
    true;

  }

}


function clearCanvas(){

  ctx.clearRect(
    0,
    0,
    1200,
    1200
  );

}


/* =====================================================
   HARF GEOMETRİSİ
===================================================== */

/*

KÜÇÜK a:

1.
SAĞ ÜSTTEN BAŞLAR.

C ŞEKLİNDE SOLA DOĞRU
DÖNER.

2.
AYNI BİRLEŞME NOKTASINDAN
DÜZ ÇİZGİ AŞAĞI İNER.

*/


const CX = 520;

const CY = 600;

const R = 250;


/*
C AÇIKLIĞI
SAĞ TARAFTA.
*/

const START_DEG = -40;

const END_DEG = 40;


function makeC(){

  const points = [];

  const travel =
  360 -
  (
    END_DEG -
    START_DEG
  );

  const count = 400;


  for(
    let i=0;
    i<=count;
    i++
  ){

    const t =
    i/count;

    const degree =
    START_DEG -
    travel*t;

    const angle =
    degree *
    Math.PI/180;


    points.push({

      x:
      CX +
      R *
      Math.cos(angle),

      y:
      CY +
      R *
      Math.sin(angle)

    });

  }


  return points;

}


const cPoints =
makeC();


const joinPoint =
cPoints[0];


/*
DÜZ ÇİZGİ

C'NİN BAŞLADIĞI NOKTAYA
TAM BAĞLANIR.
*/

const STEM_X =
joinPoint.x;


/*
BİRAZ YUKARIDAN
BAŞLIYOR.
*/

const STEM_TOP =
joinPoint.y - 95;


const STEM_BOTTOM =
CY + R;


function makeStem(){

  const points = [];

  const count = 200;


  for(
    let i=0;
    i<=count;
    i++
  ){

    const t =
    i/count;


    points.push({

      x:
      STEM_X,

      y:
      STEM_TOP +
      (
        STEM_BOTTOM -
        STEM_TOP
      ) * t

    });

  }


  return points;

}


const stemPoints =
makeStem();


/* =====================================================
   PATH ÇİZ
===================================================== */

function drawPath(
points,
color,
width,
dash=[]
){

  if(
    !points ||
    points.length<2
  ) return;


  ctx.save();

  ctx.strokeStyle =
  color;

  ctx.lineWidth =
  width;

  ctx.lineCap =
  "round";

  ctx.lineJoin =
  "round";

  ctx.setLineDash(
    dash
  );


  ctx.beginPath();

  ctx.moveTo(
    points[0].x,
    points[0].y
  );


  for(
    let i=1;
    i<points.length;
    i++
  ){

    ctx.lineTo(
      points[i].x,
      points[i].y
    );

  }


  ctx.stroke();

  ctx.restore();

}


/* =====================================================
   GRİ HARF
===================================================== */

function drawGuide(){

  drawPath(
    cPoints,
    "rgba(120,125,130,.55)",
    112
  );

  drawPath(
    stemPoints,
    "rgba(120,125,130,.55)",
    112
  );


  drawPath(
    cPoints,
    "rgba(225,227,230,.98)",
    78
  );

  drawPath(
    stemPoints,
    "rgba(225,227,230,.98)",
    78
  );


  drawPath(
    cPoints,
    "white",
    8,
    [24,20]
  );

  drawPath(
    stemPoints,
    "white",
    8,
    [24,20]
  );

}


/* =====================================================
   NUMARA
===================================================== */

function numberCircle(
x,
y,
number,
color
){

  ctx.save();


  ctx.beginPath();

  ctx.arc(
    x,
    y,
    45,
    0,
    Math.PI*2
  );


  ctx.fillStyle =
  color;

  ctx.fill();


  ctx.strokeStyle =
  "white";

  ctx.lineWidth =
  8;

  ctx.stroke();


  ctx.fillStyle =
  "white";

  ctx.font =
  "bold 52px Arial";

  ctx.textAlign =
  "center";

  ctx.textBaseline =
  "middle";


  ctx.fillText(
    number,
    x,
    y+2
  );


  ctx.restore();

}


/* =====================================================
   SARI OK
===================================================== */

function arrow(
x,
y,
rotation
){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    rotation
  );


  ctx.beginPath();

  ctx.moveTo(
    -36,-17
  );

  ctx.lineTo(
    5,-17
  );

  ctx.lineTo(
    5,-31
  );

  ctx.lineTo(
    44,0
  );

  ctx.lineTo(
    5,31
  );

  ctx.lineTo(
    5,17
  );

  ctx.lineTo(
    -36,17
  );

  ctx.closePath();


  ctx.fillStyle =
  "#ffd600";

  ctx.strokeStyle =
  "white";

  ctx.lineWidth =
  7;

  ctx.stroke();

  ctx.fill();

  ctx.restore();

}


/* =====================================================
   YÖNLER
===================================================== */

function drawDirections(){

  /*
    1 NUMARA
  */

  numberCircle(
    STEM_X + 5,
    STEM_TOP - 58,
    "1",
    "#ff2d2d"
  );


  /*
    C OKLARI
  */

  arrow(
    510,
    340,
    Math.PI
  );

  arrow(
    280,
    520,
    Math.PI/2
  );

  arrow(
    330,
    790,
    .65
  );

  arrow(
    570,
    845,
    -.30
  );


  /*
    2 NUMARA
  */

  numberCircle(
    STEM_X + 88,
    STEM_BOTTOM,
    "2",
    "#ff2d2d"
  );


  /*
    DÜZ ÇİZGİ OKLARI
  */

  arrow(
    STEM_X,
    530,
    Math.PI/2
  );

  arrow(
    STEM_X,
    710,
    Math.PI/2
  );

}


/* =====================================================
   SARI TAKİP NOKTASI
===================================================== */

function drawPoint(points){

  if(
    !points ||
    !points.length
  ) return;


  const p =
  points[
    points.length-1
  ];


  ctx.save();

  ctx.shadowColor =
  "#ffe600";

  ctx.shadowBlur =
  25;


  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    18,
    0,
    Math.PI*2
  );


  ctx.fillStyle =
  "#fff000";

  ctx.fill();


  ctx.strokeStyle =
  "white";

  ctx.lineWidth =
  5;

  ctx.stroke();

  ctx.restore();

}


/* =====================================================
   SAHNE
===================================================== */

function drawScene(
active=null
){

  clearCanvas();

  drawGuide();


  if(completedC){

    drawPath(
      cPoints,
      "#ff3030",
      74
    );

    drawPath(
      cPoints,
      "white",
      8,
      [24,20]
    );

  }


  if(active){

    drawPath(
      active,
      "#ff3030",
      74
    );

    drawPath(
      active,
      "white",
      8,
      [24,20]
    );

    drawPoint(
      active
    );

  }


  drawDirections();

  updateTexture();

}


/* =====================================================
   ANİMASYON
===================================================== */

function animate(
points,
duration,
callback
){

  let start=null;


  function frame(time){

    if(start===null){

      start=time;

    }


    const progress =
    Math.min(
      (time-start)
      /duration,
      1
    );


    const index =
    Math.max(
      1,
      Math.floor(
        progress *
        (points.length-1)
      )
    );


    const partial =
    points.slice(
      0,
      index+1
    );


    drawScene(
      partial
    );


    if(progress<1){

      requestAnimationFrame(
        frame
      );

    }

    else{

      if(callback)
      callback();

    }

  }


  requestAnimationFrame(
    frame
  );

}


/* =====================================================
   C ÇİZ
===================================================== */

function startC(){

  completedC=false;

  drawScene();


  showMessage(
    "1. Önce c çizgisini çiz.",
    "Sarı okları takip et."
  );


  /*
    İLK TURDA SES
    ZATEN BUTONA BASINCA ÇALDI.

    İKİNCİ TURDA
    1. SESİ TEKRAR ÇALIYORUZ.
  */

  if(round===2){

    playSound(
      sound1
    );

  }


  setTimeout(
    ()=>{

      animate(
        cPoints,
        6500,
        startStem
      );

    },
    700
  );

}


/* =====================================================
   DÜZ ÇİZGİ
===================================================== */

function startStem(){

  completedC=true;

  drawScene();


  showMessage(
    "2. Şimdi düz çizgiyi çiz.",
    "Yukarıdan aşağı doğru ilerle."
  );


  playSound(
    sound2
  );


  setTimeout(
    ()=>{

      animate(
        stemPoints,
        4000,
        roundFinished
      );

    },
    700
  );

}


/* =====================================================
   TUR BİTTİ
===================================================== */

function roundFinished(){

  completedC=true;

  drawScene(
    stemPoints
  );


  if(round===1){

    showMessage(
      "Harika! Bir kez daha yazalım.",
      "Aynı hareketleri tekrar izle."
    );


    playSound(
      sound3
    );


    round=2;


    /*
      3. SES BİTİNCE
      İKİNCİ TUR.
    */

    sound3.onended =
    function(){

      setTimeout(
        startC,
        500
      );

    };


    /*
      YEDEK:
      SES BİTME OLAYI
      GELMEZSE ÇOK UZUN
      BEKLEMESİN.
    */

    setTimeout(
      ()=>{

        if(
          round===2 &&
          sound3.paused
        ){

          startC();

        }

      },
      5500
    );

  }

  else{

    finish();

  }

}


/* =====================================================
   SON
===================================================== */

function finish(){

  completedC=true;

  drawScene(
    stemPoints
  );


  showMessage(
    "Harika! Şimdi sıra sende.",
    "Kitabındaki küçük a harflerini yaz."
  );


  playSound(
    sound4
  );

}


/* =====================================================
   AR BAŞLANGICI
===================================================== */

function tryStart(){

  if(animationStarted)
  return;

  if(!userStarted)
  return;

  if(!targetVisible)
  return;


  animationStarted=true;


  plane.setAttribute(
    "visible",
    "true"
  );


  /*
    1. SES BUTONDA
    BAŞLAMIŞTI.

    SAYFA BULUNUNCA
    ÇİZİM BAŞLIYOR.
  */

  setTimeout(
    startC,
    400
  );

}


/* =====================================================
   TARGET
===================================================== */

target.addEventListener(
"targetFound",
function(){

  targetVisible=true;

  tryStart();

});


target.addEventListener(
"targetLost",
function(){

  targetVisible=false;

});


window.addEventListener(
"user-started",
tryStart
);

}

});


</script>


<a-scene

mindar-image="
imageTargetSrc: ./targets%202.mind;
filterMinCF: 0.0001;
filterBeta: 0.01;
"

renderer="
colorManagement:true;
alpha:true;
antialias:true;
"

color-space="sRGB"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false">


<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>


<a-entity
mindar-image-target="targetIndex:0"
school-a-writing>


<a-plane
id="drawPlane"

position="0 0.01 0.08"

width="1.12"
height="1.12"

visible="false"

material="
src:#drawCanvas;
transparent:true;
shader:flat;
">
</a-plane>


</a-entity>

</a-scene>

</body>
</html>
