<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* BAŞLANGIÇ */
#startScreen {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(255,248,225,.97);
}

#startButton {
  border: 0;
  border-radius: 28px;
  padding: 18px 28px;
  background: #ff8a3d;
  color: white;
  font-size: 21px;
  font-weight: 800;
  box-shadow: 0 6px 18px rgba(0,0,0,.22);
}

#startText {
  margin-top: 14px;
  padding: 0 25px;
  font-size: 16px;
  color: #555;
  text-align: center;
}

/* YÖNERGE KUTUSU */
#instruction {
  position: fixed;
  z-index: 9000;

  top: 15%;
  left: 50%;
  transform: translateX(-50%);

  width: 82vw;
  max-width: 470px;

  box-sizing: border-box;

  background: rgba(255,255,255,.97);
  border: 4px solid #ff981f;
  border-radius: 23px;

  padding: 11px 15px;

  text-align: center;

  box-shadow: 0 5px 18px rgba(0,0,0,.18);

  display: none;
  pointer-events: none;
}

#instructionTitle {
  color: #143b73;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.15;
}

#instructionText {
  margin-top: 5px;
  color: #555;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
}

#drawCanvas {
  display: none;
}
</style>
</head>

<body>

<!-- BAŞLANGIÇ -->
<div id="startScreen">
  <button id="startButton">
    🔊 Küçük a yazımını başlat
  </button>

  <div id="startText">
    Dokun ve yazma sayfasını kameraya göster.
  </div>
</div>


<!-- YÖNERGE -->
<div id="instruction">
  <div id="instructionTitle"></div>
  <div id="instructionText"></div>
</div>


<!-- SESLER -->
<audio
  id="sound1"
  src="./1-c-cizgisi.mp3.mp3"
  preload="auto"
  playsinline>
</audio>

<audio
  id="sound2"
  src="./2-duz-cizgi.mp3.mp3"
  preload="auto"
  playsinline>
</audio>

<audio
  id="sound3"
  src="./3-bir-kez-daha.mp3.mp3"
  preload="auto"
  playsinline>
</audio>

<audio
  id="sound4"
  src="./4-simdi-sen.mp3.mp3"
  preload="auto"
  playsinline>
</audio>


<!-- HARF CANVASI -->
<canvas
  id="drawCanvas"
  width="1200"
  height="1200">
</canvas>


<script>

let userStarted = false;
let audioReady = false;


/* =====================================================
   SES SİSTEMİ
===================================================== */

const sounds = [];


window.addEventListener("DOMContentLoaded", () => {

  sounds.push(
    document.querySelector("#sound1"),
    document.querySelector("#sound2"),
    document.querySelector("#sound3"),
    document.querySelector("#sound4")
  );


  const button =
    document.querySelector("#startButton");


  button.addEventListener("click", async () => {

    /*
      iPHONE / SAFARI SES KİLİDİNİ
      KULLANICI DOKUNUŞUYLA AÇIYORUZ
    */

    for (const audio of sounds) {

      try {

        audio.load();

        audio.muted = true;

        await audio.play();

        audio.pause();

        audio.currentTime = 0;

        audio.muted = false;

      } catch(e) {

        console.log("Ses hazırlama:", e);

      }

    }


    audioReady = true;
    userStarted = true;


    document.querySelector("#startScreen")
      .style.display = "none";


    window.dispatchEvent(
      new Event("neti-user-start")
    );

  });

});


async function playSound(number) {

  if (!audioReady) return;


  /*
    ÖNCE DİĞER SESLERİ DURDUR
  */

  sounds.forEach(audio => {

    try {

      audio.pause();
      audio.currentTime = 0;

    } catch(e) {}

  });


  const audio = sounds[number - 1];

  if (!audio) return;


  try {

    audio.muted = false;
    audio.volume = 1;

    await audio.play();

  } catch(e) {

    console.log("Ses oynatılamadı:", e);

  }

}


/* =====================================================
   AR YAZIM BİLEŞENİ
===================================================== */

AFRAME.registerComponent("school-a-writing", {

init: function() {

  const target = this.el;

  const canvas =
    document.querySelector("#drawCanvas");

  const ctx =
    canvas.getContext("2d");

  const plane =
    document.querySelector("#drawPlane");

  const instruction =
    document.querySelector("#instruction");

  const instructionTitle =
    document.querySelector("#instructionTitle");

  const instructionText =
    document.querySelector("#instructionText");


  let targetVisible = false;
  let started = false;
  let round = 1;

  let completedC = false;


  /* =================================================
     TEXTURE GÜNCELLE
  ================================================= */

  function updateTexture() {

    const mesh =
      plane.getObject3D("mesh");


    if (
      mesh &&
      mesh.material &&
      mesh.material.map
    ) {

      mesh.material.map.needsUpdate = true;

    }

  }


  function clearCanvas() {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  /* =================================================
     YÖNERGE
  ================================================= */

  function showMessage(title, text) {

    instructionTitle.textContent = title;
    instructionText.textContent = text;

    instruction.style.display = "block";

  }


  /* =================================================
     KÜÇÜK a GEOMETRİSİ

     1 = c hareketi
     2 = düz çizgi

     C TAM DAİRESEL GEOMETRİDEN ÜRETİLİR.
  ================================================= */


  const CX = 535;
  const CY = 615;

  const R = 245;


  /*
    C'nin açıklığı sağ tarafta.

    Başlangıç:
    sağ üst.

    Bitiş:
    sağ alt.
  */

  const START_DEG = -42;
  const END_DEG = 42;


  function createCPath() {

    const points = [];

    const travel =
      360 - (END_DEG - START_DEG);

    const count = 300;


    for (let i = 0; i <= count; i++) {

      const t = i / count;

      const degree =
        START_DEG - (travel * t);

      const angle =
        degree * Math.PI / 180;


      points.push({

        x:
          CX +
          R * Math.cos(angle),

        y:
          CY +
          R * Math.sin(angle)

      });

    }


    return points;

  }


  const cPoints =
    createCPath();


  /*
    DİK ÇİZGİ

    C'nin sağ tarafına oturur.
  */

  const cStart =
    cPoints[0];


  const STEM_X =
    cStart.x;


  /*
    Çizgi C'nin birleşme
    noktasının biraz üstünden başlar.
  */

  const STEM_TOP =
    cStart.y - 105;


  const STEM_BOTTOM =
    CY + R + 4;


  function createStemPath() {

    const points = [];

    const count = 160;


    for (let i = 0; i <= count; i++) {

      const t =
        i / count;


      points.push({

        x:
          STEM_X,

        y:
          STEM_TOP +
          (
            STEM_BOTTOM -
            STEM_TOP
          ) * t

      });

    }


    return points;

  }


  const stemPoints =
    createStemPath();


  /* =================================================
     ÇİZGİ ÇİZME
  ================================================= */

  function drawPath(
    points,
    color,
    width,
    dash = []
  ) {

    if (!points || points.length < 2)
      return;


    ctx.save();


    ctx.strokeStyle =
      color;

    ctx.lineWidth =
      width;

    ctx.lineCap =
      "round";

    ctx.lineJoin =
      "round";

    ctx.setLineDash(
      dash
    );


    ctx.beginPath();


    ctx.moveTo(
      points[0].x,
      points[0].y
    );


    for (
      let i = 1;
      i < points.length;
      i++
    ) {

      ctx.lineTo(
        points[i].x,
        points[i].y
      );

    }


    ctx.stroke();

    ctx.restore();

  }


  /* =================================================
     GRİ HARF ŞABLONU
  ================================================= */

  function drawGuide() {

    /*
      DIŞ GRİ
    */

    drawPath(
      cPoints,
      "rgba(135,140,145,.58)",
      110
    );


    drawPath(
      stemPoints,
      "rgba(135,140,145,.58)",
      110
    );


    /*
      İÇ AÇIK GRİ
    */

    drawPath(
      cPoints,
      "rgba(222,225,228,.98)",
      76
    );


    drawPath(
      stemPoints,
      "rgba(222,225,228,.98)",
      76
    );


    /*
      ORTA KESİK ÇİZGİ
    */

    drawPath(
      cPoints,
      "white",
      8,
      [24, 20]
    );


    drawPath(
      stemPoints,
      "white",
      8,
      [24, 20]
    );

  }


  /* =================================================
     NUMARA
  ================================================= */

  function numberCircle(
    x,
    y,
    number,
    color
  ) {

    ctx.save();


    ctx.shadowColor =
      "rgba(0,0,0,.22)";

    ctx.shadowBlur =
      10;


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      44,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      color;

    ctx.fill();


    ctx.shadowBlur =
      0;


    ctx.strokeStyle =
      "white";

    ctx.lineWidth =
      8;

    ctx.stroke();


    ctx.fillStyle =
      "white";

    ctx.font =
      "bold 50px Arial";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";


    ctx.fillText(
      number,
      x,
      y + 2
    );


    ctx.restore();

  }


  /* =================================================
     SARI OK
  ================================================= */

  function arrow(
    x,
    y,
    rotation
  ) {

    ctx.save();


    ctx.translate(
      x,
      y
    );


    ctx.rotate(
      rotation
    );


    ctx.beginPath();


    ctx.moveTo(
      -36,
      -17
    );

    ctx.lineTo(
      5,
      -17
    );

    ctx.lineTo(
      5,
      -31
    );

    ctx.lineTo(
      44,
      0
    );

    ctx.lineTo(
      5,
      31
    );

    ctx.lineTo(
      5,
      17
    );

    ctx.lineTo(
      -36,
      17
    );


    ctx.closePath();


    ctx.fillStyle =
      "#ffd600";

    ctx.strokeStyle =
      "white";

    ctx.lineWidth =
      7;


    ctx.stroke();
    ctx.fill();


    ctx.restore();

  }


  /* =================================================
     YÖN İŞARETLERİ
  ================================================= */

  function drawDirections() {

    /*
      1 = C
    */

    numberCircle(
      cStart.x + 20,
      STEM_TOP - 55,
      "1",
      "#1976ff"
    );


    /*
      C ÜZERİNDE OKLAR
    */

    arrow(
      535,
      365,
      Math.PI
    );


    arrow(
      290,
      535,
      Math.PI / 2
    );


    arrow(
      350,
      790,
      .65
    );


    arrow(
      590,
      850,
      -.30
    );


    /*
      2 = DÜZ ÇİZGİ
    */

    numberCircle(
      STEM_X + 90,
      STEM_BOTTOM,
      "2",
      "#ff2d2d"
    );


    arrow(
      STEM_X,
      520,
      Math.PI / 2
    );


    arrow(
      STEM_X,
      700,
      Math.PI / 2
    );

  }


  /* =================================================
     KALEM NOKTASI
  ================================================= */

  function drawPenPoint(points) {

    if (
      !points ||
      points.length === 0
    ) return;


    const p =
      points[
        points.length - 1
      ];


    ctx.save();


    ctx.shadowColor =
      "#ffd600";

    ctx.shadowBlur =
      25;


    ctx.beginPath();


    ctx.arc(
      p.x,
      p.y,
      18,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      "#fff000";

    ctx.fill();


    ctx.lineWidth =
      5;

    ctx.strokeStyle =
      "white";

    ctx.stroke();


    ctx.restore();

  }


  /* =================================================
     SAHNEYİ ÇİZ
  ================================================= */

  function drawScene(
    activePoints = null,
    drawingStem = false
  ) {

    clearCanvas();


    drawGuide();


    /*
      C TAMAMLANDIYSA
      KIRMIZI OLARAK KORU
    */

    if (completedC) {

      drawPath(
        cPoints,
        "#ff3030",
        72
      );


      drawPath(
        cPoints,
        "white",
        8,
        [24,20]
      );

    }


    /*
      AKTİF ÇİZGİ
    */

    if (activePoints) {

      drawPath(
        activePoints,
        "#ff3030",
        72
      );


      drawPath(
        activePoints,
        "white",
        8,
        [24,20]
      );


      drawPenPoint(
        activePoints
      );

    }


    drawDirections();

    updateTexture();

  }


  /* =================================================
     ANİMASYON
  ================================================= */

  function animatePath(
    points,
    duration,
    callback,
    drawingStem = false
  ) {

    let startTime =
      null;


    function frame(time) {

      if (
        startTime === null
      ) {

        startTime =
          time;

      }


      const progress =
        Math.min(
          (time - startTime)
          / duration,
          1
        );


      const index =
        Math.max(
          1,
          Math.floor(
            progress *
            (points.length - 1)
          )
        );


      const partial =
        points.slice(
          0,
          index + 1
        );


      drawScene(
        partial,
        drawingStem
      );


      if (
        progress < 1
      ) {

        requestAnimationFrame(
          frame
        );

      } else {

        if (callback)
          callback();

      }

    }


    requestAnimationFrame(
      frame
    );

  }


  /* =================================================
     1. C HAREKETİ
  ================================================= */

  async function startC() {

    completedC =
      false;


    drawScene();


    if (round === 1) {

      showMessage(
        "1. Önce c çizgisini çiz.",
        "Sarı okları takip et."
      );


      await playSound(1);

    } else {

      showMessage(
        "1. Önce c çizgisini çiz.",
        "Sarı okları takip et."
      );


      await playSound(1);

    }


    /*
      SES BAŞLADIKTAN SONRA
      KISA BEKLEME
    */

    setTimeout(() => {

      animatePath(
        cPoints,
        6500,
        startStem
      );

    }, 700);

  }


  /* =================================================
     2. DÜZ ÇİZGİ
  ================================================= */

  async function startStem() {

    completedC =
      true;


    drawScene();


    showMessage(
      "2. Şimdi düz çizgiyi çiz.",
      "Yukarıdan aşağı doğru ilerle."
    );


    await playSound(2);


    setTimeout(() => {

      animatePath(
        stemPoints,
        4000,
        roundFinished,
        true
      );

    }, 700);

  }


  /* =================================================
     TUR BİTİŞİ
  ================================================= */

  async function roundFinished() {

    completedC =
      true;


    drawScene(
      stemPoints,
      true
    );


    if (round === 1) {

      showMessage(
        "Harika! Bir kez daha yazalım.",
        "Aynı hareketleri tekrar izle."
      );


      await playSound(3);


      round =
        2;


      /*
        SESİN BİTMESİNİ BEKLE
      */

      const audio =
        sounds[2];


      const wait =
        audio &&
        isFinite(audio.duration)
        ?
        audio.duration * 1000 + 500
        :
        2500;


      setTimeout(
        startC,
        wait
      );

    } else {

      finish();

    }

  }


  /* =================================================
     SON
  ================================================= */

  async function finish() {

    /*
      TAMAMLANMIŞ a
      EKRANDA KALSIN
    */

    completedC =
      true;


    drawScene(
      stemPoints,
      true
    );


    showMessage(
      "Harika! Şimdi sıra sende.",
      "Kitabındaki küçük a harflerini yaz."
    );


    await playSound(4);

  }


  /* =================================================
     BAŞLAT
  ================================================= */

  function begin() {

    if (started)
      return;


    if (!targetVisible)
      return;


    if (!userStarted)
      return;


    started =
      true;


    round =
      1;


    plane.setAttribute(
      "visible",
      "true"
    );


    /*
      NETİ YOK.
      DOĞRUDAN HARF BAŞLIYOR.
    */

    setTimeout(
      startC,
      500
    );

  }


  /* =================================================
     TARGET
  ================================================= */

  target.addEventListener(
    "targetFound",
    () => {

      targetVisible =
        true;

      begin();

    }
  );


  target.addEventListener(
    "targetLost",
    () => {

      targetVisible =
        false;

    }
  );


  window.addEventListener(
    "neti-user-start",
    begin
  );

}

});

</script>


<!-- =================================================
     AR SAHNESİ
================================================== -->

<a-scene

mindar-image="
imageTargetSrc: ./targets%202.mind;
filterMinCF: 0.0001;
filterBeta: 0.01;
"

renderer="
colorManagement: true;
alpha: true;
antialias: true;
"

color-space="sRGB"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="enabled: false">


<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>


<a-entity
mindar-image-target="targetIndex: 0"
school-a-writing>


<a-plane
id="drawPlane"

position="0 0.01 0.08"

width="1.12"
height="1.12"

visible="false"

material="
src: #drawCanvas;
transparent: true;
shader: flat;
">
</a-plane>


</a-entity>

</a-scene>

</body>
</html>
