<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:10000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(255,248,225,.97);
}

#startButton{
  border:0;
  border-radius:28px;
  padding:18px 28px;
  background:#ff8a3d;
  color:#fff;
  font-size:21px;
  font-weight:700;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}

#startText{
  margin-top:14px;
  font-size:16px;
  color:#555;
}

/* YÖNERGE ARTIK CANVAS'TA DEĞİL */
#instruction{
  position:fixed;
  z-index:9000;
  top:13%;
  left:50%;
  transform:translateX(-50%);
  width:min(82vw,480px);
  box-sizing:border-box;

  background:rgba(255,255,255,.96);
  border:4px solid #ff9c38;
  border-radius:22px;

  padding:10px 15px;
  text-align:center;

  box-shadow:0 5px 16px rgba(0,0,0,.16);

  display:none;
  pointer-events:none;
}

#instructionTitle{
  font-size:20px;
  line-height:1.15;
  font-weight:800;
  color:#173c68;
}

#instructionText{
  margin-top:4px;
  font-size:14px;
  line-height:1.2;
  font-weight:600;
  color:#555;
}

#drawCanvas{
  display:none;
}
</style>
</head>

<body>

<div id="startScreen">
  <button id="startButton">
    ✏️ Neti ile küçük a yazalım
  </button>

  <div id="startText">
    Dokun ve yazma sayfasını kameraya göster.
  </div>
</div>

<div id="instruction">
  <div id="instructionTitle"></div>
  <div id="instructionText"></div>
</div>

<canvas
  id="drawCanvas"
  width="1200"
  height="1200">
</canvas>

<script>
let userStarted=false;

window.addEventListener("DOMContentLoaded",()=>{

  const startScreen=document.querySelector("#startScreen");
  const startButton=document.querySelector("#startButton");

  startButton.addEventListener("click",()=>{

    userStarted=true;
    startScreen.style.display="none";

    window.dispatchEvent(
      new Event("user-started")
    );

  });

});


AFRAME.registerComponent("perfect-a-writing",{

init:function(){

  const target=this.el;

  const canvas=document.querySelector("#drawCanvas");
  const ctx=canvas.getContext("2d");

  const plane=document.querySelector("#drawPlane");
  const neti=document.querySelector("#neti");

  const instruction=document.querySelector("#instruction");
  const instructionTitle=document.querySelector("#instructionTitle");
  const instructionText=document.querySelector("#instructionText");

  let targetVisible=false;
  let started=false;
  let round=1;

  /* =========================
     TEXTURE
  ========================= */

  function updateTexture(){

    const mesh=plane.getObject3D("mesh");

    if(
      mesh &&
      mesh.material &&
      mesh.material.map
    ){
      mesh.material.map.needsUpdate=true;
    }
  }


  /* =========================
     YÖNERGE
  ========================= */

  function showInstruction(title,text){

    instructionTitle.textContent=title;
    instructionText.textContent=text;

    instruction.style.display="block";
  }


  /* =========================
     TEMİZLE
  ========================= */

  function clear(){

    ctx.clearRect(
      0,0,
      canvas.width,
      canvas.height
    );

    updateTexture();
  }


  /* =====================================================
     KÜÇÜK a'NIN GERÇEK YAPISI
     
     1. hareket:
     sağ üstten başlayıp sola doğru
     TAM C biçiminde döner.

     2. hareket:
     C'nin birleşim yerinin biraz
     üstünden başlayıp aşağı iner.
  ===================================================== */


  const CENTER_X=555;
  const CENTER_Y=610;

  const RX=245;
  const RY=255;

  /*
     C'nin sağ üst ve sağ alt uçları
  */

  const START_ANGLE=-42*Math.PI/180;
  const END_ANGLE=42*Math.PI/180;


  function cPath(){

    const points=[];

    /*
      Saat yönünün tersine:
      sağ üst -> üst -> sol ->
      alt -> sağ alt
    */

    const totalAngle=
      Math.PI*2 -
      (END_ANGLE-START_ANGLE);

    const count=220;

    for(let i=0;i<=count;i++){

      const t=i/count;

      let angle=
        START_ANGLE -
        totalAngle*t;

      points.push({

        x:
          CENTER_X+
          RX*Math.cos(angle),

        y:
          CENTER_Y+
          RY*Math.sin(angle)

      });

    }

    return points;
  }


  const cPoints=cPath();

  /*
     C'nin sağ üst birleşim noktası
  */

  const joinTop=cPoints[0];

  /*
     DİK ÇİZGİ:
     C'nin üst birleşiminden
     yaklaşık 100 px daha yukarıda başlar.
  */

  const STEM_X=joinTop.x;

  const STEM_TOP=joinTop.y-105;
  const STEM_BOTTOM=835;


  function stemPath(){

    const points=[];
    const count=120;

    for(let i=0;i<=count;i++){

      const t=i/count;

      points.push({

        x:STEM_X,

        y:
          STEM_TOP+
          (STEM_BOTTOM-STEM_TOP)*t

      });

    }

    return points;
  }


  const stemPoints=stemPath();


  /* =========================
     YOL ÇİZ
  ========================= */

  function drawPath(
    points,
    color,
    width,
    dash=[]
  ){

    ctx.save();

    ctx.strokeStyle=color;
    ctx.lineWidth=width;

    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.setLineDash(dash);

    ctx.beginPath();

    ctx.moveTo(
      points[0].x,
      points[0].y
    );

    for(let i=1;i<points.length;i++){

      ctx.lineTo(
        points[i].x,
        points[i].y
      );

    }

    ctx.stroke();

    ctx.restore();
  }


  /* =========================
     GRİ HARF ŞABLONU
  ========================= */

  function drawGuide(){

    /*
      DIŞ GRİ KILAVUZ
    */

    drawPath(
      cPoints,
      "rgba(135,140,145,.55)",
      105
    );

    drawPath(
      stemPoints,
      "rgba(135,140,145,.55)",
      105
    );

    /*
      İÇ AÇIK GRİ YOL
    */

    drawPath(
      cPoints,
      "rgba(225,225,225,.92)",
      66
    );

    drawPath(
      stemPoints,
      "rgba(225,225,225,.92)",
      66
    );

    /*
      ORTA KESİK KILAVUZ
    */

    drawPath(
      cPoints,
      "rgba(255,255,255,.96)",
      7,
      [20,18]
    );

    drawPath(
      stemPoints,
      "rgba(255,255,255,.96)",
      7,
      [20,18]
    );

    updateTexture();
  }


  /* =========================
     NUMARA
  ========================= */

  function numberCircle(x,y,text){

    ctx.save();

    ctx.shadowColor="rgba(0,0,0,.18)";
    ctx.shadowBlur=10;

    ctx.beginPath();
    ctx.arc(x,y,43,0,Math.PI*2);

    ctx.fillStyle="#ff2d2d";
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.lineWidth=8;
    ctx.strokeStyle="#fff";
    ctx.stroke();

    ctx.fillStyle="#fff";
    ctx.font="bold 50px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      text,
      x,
      y+2
    );

    ctx.restore();
  }


  /* =========================
     SARI OK
  ========================= */

  function arrow(x,y,angle){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.shadowColor="rgba(0,0,0,.18)";
    ctx.shadowBlur=6;

    ctx.beginPath();

    ctx.moveTo(-35,-17);
    ctx.lineTo(5,-17);

    ctx.lineTo(5,-31);

    ctx.lineTo(43,0);

    ctx.lineTo(5,31);

    ctx.lineTo(5,17);

    ctx.lineTo(-35,17);

    ctx.closePath();

    ctx.fillStyle="#ffd600";

    ctx.lineWidth=7;
    ctx.strokeStyle="#fff";

    ctx.stroke();
    ctx.fill();

    ctx.restore();
  }


  /* =========================
     YÖN OKLARI
  ========================= */

  function drawDirections(){

    /*
      1 = C HAREKETİ
    */

    numberCircle(
      joinTop.x+42,
      joinTop.y-58,
      "1"
    );


    /*
      C ÜZERİNDEKİ OKLAR
    */

    arrow(
      590,
      350,
      Math.PI
    );

    arrow(
      335,
      500,
      Math.PI/2
    );

    arrow(
      390,
      790,
      .45
    );

    arrow(
      620,
      850,
      -.15
    );


    /*
      2 = DİK ÇİZGİ
    */

    numberCircle(
      STEM_X+72,
      STEM_TOP+35,
      "2"
    );


    arrow(
      STEM_X,
      500,
      Math.PI/2
    );

    arrow(
      STEM_X,
      690,
      Math.PI/2
    );

    updateTexture();
  }


  /* =========================
     ANİMASYONLU KIRMIZI ÇİZGİ
  ========================= */

  function animateRed(
    points,
    duration,
    done
  ){

    let startTime=null;


    function frame(time){

      if(startTime===null){
        startTime=time;
      }

      const progress=
        Math.min(
          (time-startTime)/duration,
          1
        );

      const endIndex=
        Math.max(
          1,
          Math.floor(
            progress*
            (points.length-1)
          )
        );


      /*
        O ANA KADAR OLAN YOL
      */

      const partial=
        points.slice(
          0,
          endIndex+1
        );


      /*
        KIRMIZI ÇİZGİ
      */

      drawPath(
        partial,
        "#ff3030",
        68
      );


      /*
        KIRMIZININ ORTASINDA
        BEYAZ KESİK YOL
      */

      drawPath(
        partial,
        "rgba(255,255,255,.95)",
        7,
        [20,18]
      );


      /*
        PARLAYAN KALEM NOKTASI
      */

      const p=
        points[endIndex];

      ctx.save();

      ctx.shadowColor="#ffe000";
      ctx.shadowBlur=25;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        17,
        0,
        Math.PI*2
      );

      ctx.fillStyle="#fff000";
      ctx.fill();

      ctx.lineWidth=5;
      ctx.strokeStyle="#fff";
      ctx.stroke();

      ctx.restore();


      updateTexture();


      if(progress<1){

        requestAnimationFrame(frame);

      }else{

        if(done){
          done();
        }

      }

    }


    requestAnimationFrame(frame);
  }


  /* =========================
     1. HAREKET
  ========================= */

  function startC(){

    clear();

    drawGuide();
    drawDirections();


    if(round===1){

      showInstruction(
        "1. Önce c çizgisini çiz.",
        "Sarı okları takip et."
      );

    }else{

      showInstruction(
        "Tekrar yazıyoruz...",
        "Önce c hareketini bir kez daha izle."
      );

    }


    /*
      KILAVUZU ÖNCE GÖRSÜN
    */

    setTimeout(()=>{

      animateRed(
        cPoints,
        6500,
        startStem
      );

    },1600);

  }


  /* =========================
     2. HAREKET
  ========================= */

  function startStem(){

    showInstruction(
      "2. Şimdi düz çizgiyi çiz.",
      "Yukarıdan aşağı doğru ilerle."
    );


    setTimeout(()=>{

      animateRed(
        stemPoints,
        4000,
        finishRound
      );

    },1300);

  }


  /* =========================
     TUR BİTİŞİ
  ========================= */

  function finishRound(){

    if(round===1){

      showInstruction(
        "Harika! Bir kez daha.",
        "Küçük a harfini tekrar izleyelim."
      );

      round=2;

      setTimeout(
        startC,
        2200
      );

    }else{

      finish();

    }

  }


  /* =========================
     SON
  ========================= */

  function finish(){

    showInstruction(
      "Şimdi sen de yaz! ✏️",
      "Kitabındaki küçük a harflerini yaz."
    );


    neti.removeAttribute(
      "animation__finish"
    );

    neti.setAttribute(
      "animation__finish",

      "property:scale;"+
      "from:1 1 1;"+
      "to:1.12 1.12 1.12;"+
      "dir:alternate;"+
      "loop:3;"+
      "dur:320;"+
      "easing:easeInOutQuad"
    );

  }


  /* =========================
     BAŞLAT
  ========================= */

  function begin(){

    if(started) return;
    if(!targetVisible) return;
    if(!userStarted) return;

    started=true;
    round=1;


    plane.setAttribute(
      "visible",
      "true"
    );


    neti.setAttribute(
      "visible",
      "true"
    );


    neti.setAttribute(
      "scale",
      ".05 .05 .05"
    );


    neti.setAttribute(
      "position",
      "-0.43 0.63 0.09"
    );


    neti.setAttribute(
      "animation__enter",

      "property:scale;"+
      "from:.05 .05 .05;"+
      "to:1 1 1;"+
      "dur:900;"+
      "easing:easeOutBack"
    );


    setTimeout(
      startC,
      1100
    );

  }


  target.addEventListener(
    "targetFound",
    ()=>{

      targetVisible=true;
      begin();

    }
  );


  target.addEventListener(
    "targetLost",
    ()=>{

      targetVisible=false;

    }
  );


  window.addEventListener(
    "user-started",
    begin
  );

}

});

</script>


<a-scene

mindar-image="
imageTargetSrc: ./targets%202.mind;
filterMinCF:0.0001;
filterBeta:0.01;
"

renderer="
colorManagement:true;
alpha:true;
antialias:true;
"

color-space="sRGB"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false">


<a-assets>

<img
id="netiAsset"
src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
crossorigin="anonymous">

</a-assets>


<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>


<a-entity
mindar-image-target="targetIndex:0"
perfect-a-writing>


<a-image
id="neti"
src="#netiAsset"
position="-0.43 0.63 0.09"
width=".28"
height=".28"
visible="false"
material="
shader:flat;
transparent:true;
alphaTest:.01;
">
</a-image>


<a-plane
id="drawPlane"
position="0 0.02 0.08"
width="1.12"
height="1.12"
visible="false"
material="
src:#drawCanvas;
transparent:true;
shader:flat;
">
</a-plane>


</a-entity>

</a-scene>

</body>
</html>
