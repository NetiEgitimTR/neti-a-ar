<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

/* BAŞLANGIÇ */
#startScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(255,248,225,.97);
}

#startButton{
  border:0;
  border-radius:28px;
  padding:18px 28px;
  background:#ff8a3d;
  color:white;
  font-size:21px;
  font-weight:bold;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}

#startText{
  margin-top:14px;
  font-size:16px;
  color:#555;
  text-align:center;
}

/* ÜST YÖNERGE */
#instruction{
  position:fixed;
  z-index:9000;

  top:16%;
  left:50%;

  transform:translateX(-50%);

  width:78vw;
  max-width:470px;

  box-sizing:border-box;

  background:rgba(255,255,255,.97);

  border:4px solid #ff981f;
  border-radius:23px;

  padding:11px 15px;

  text-align:center;

  box-shadow:0 5px 18px rgba(0,0,0,.18);

  display:none;
  pointer-events:none;
}

#instructionTitle{
  color:#143b73;
  font-size:21px;
  font-weight:800;
  line-height:1.15;
}

#instructionText{
  margin-top:4px;
  color:#555;
  font-size:14px;
  font-weight:700;
  line-height:1.2;
}

/* SON BALON */
#speech{
  position:fixed;

  z-index:9001;

  right:4%;
  top:43%;

  width:145px;

  box-sizing:border-box;

  background:#ffd36a;

  border:4px solid white;
  border-radius:45%;

  padding:18px 12px;

  color:#422600;

  font-size:22px;
  font-weight:800;

  text-align:center;

  box-shadow:0 5px 18px rgba(0,0,0,.18);

  display:none;

  pointer-events:none;
}

#speech:after{
  content:"";

  position:absolute;

  bottom:-25px;
  left:42px;

  border-width:26px 14px 0 0;
  border-style:solid;

  border-color:#ffd36a transparent transparent transparent;
}

#drawCanvas{
  display:none;
}
</style>
</head>

<body>

<div id="startScreen">

  <button id="startButton">
    ✏️ Neti ile küçük a yazalım
  </button>

  <div id="startText">
    Dokun ve yazma sayfasını kameraya göster.
  </div>

</div>


<div id="instruction">

  <div id="instructionTitle"></div>

  <div id="instructionText"></div>

</div>


<div id="speech">
  Şimdi<br>
  sen de yaz! ✏️
</div>


<canvas
  id="drawCanvas"
  width="1200"
  height="1200">
</canvas>


<script>

let userStarted=false;


window.addEventListener("DOMContentLoaded",()=>{

  const button=
    document.querySelector("#startButton");

  button.addEventListener("click",()=>{

    userStarted=true;

    document.querySelector("#startScreen")
      .style.display="none";

    window.dispatchEvent(
      new Event("neti-user-start")
    );

  });

});


AFRAME.registerComponent("school-a-writing",{

init:function(){

  const target=this.el;

  const canvas=
    document.querySelector("#drawCanvas");

  const ctx=
    canvas.getContext("2d");

  const plane=
    document.querySelector("#drawPlane");

  const neti=
    document.querySelector("#neti");

  const netiHead=
    document.querySelector("#netiHead");

  const instruction=
    document.querySelector("#instruction");

  const title=
    document.querySelector("#instructionTitle");

  const text=
    document.querySelector("#instructionText");

  const speech=
    document.querySelector("#speech");


  let targetVisible=false;
  let started=false;
  let round=1;


  /* =====================================
     CANVAS GÜNCELLE
  ===================================== */

  function update(){

    const mesh=
      plane.getObject3D("mesh");

    if(
      mesh &&
      mesh.material &&
      mesh.material.map
    ){
      mesh.material.map.needsUpdate=true;
    }

  }


  function clearCanvas(){

    ctx.clearRect(
      0,
      0,
      1200,
      1200
    );

    update();

  }


  /* =====================================
     YÖNERGE
  ===================================== */

  function message(a,b){

    title.textContent=a;
    text.textContent=b;

    instruction.style.display="block";

  }


  /* =====================================
     KÜÇÜK a GEOMETRİSİ
     
     BU KEZ TAM DAİRESEL.
  ===================================== */

  const CX=545;
  const CY=615;

  const R=245;

  /*
     c'nin başlangıcı sağ üst.

     Açıklık yaklaşık 80 derece.
  */

  const START_DEG=-38;
  const END_DEG=38;


  function cPath(){

    const points=[];

    /*
       -38°'den geriye doğru
       bütün daireyi dolaşıyoruz.

       Böylece:
       sağ üst
       -> üst
       -> sol
       -> alt
       -> sağ alt
    */

    const travel=
      360-(END_DEG-START_DEG);

    const count=280;


    for(let i=0;i<=count;i++){

      const t=i/count;

      const degree=
        START_DEG-
        travel*t;

      const angle=
        degree*Math.PI/180;


      points.push({

        x:
          CX+
          R*Math.cos(angle),

        y:
          CY+
          R*Math.sin(angle)

      });

    }

    return points;

  }


  const cPoints=cPath();


  /*
     C'NİN SAĞ ÜST NOKTASI
  */

  const join=cPoints[0];


  /*
     DİK ÇİZGİ
     
     C'nin başlangıcından
     DAHA YUKARIDA başlıyor.
  */

  const STEM_X=join.x;

  const STEM_TOP=join.y-125;

  const STEM_BOTTOM=
    CY+R+8;


  function stemPath(){

    const points=[];

    const count=150;


    for(let i=0;i<=count;i++){

      const t=i/count;

      points.push({

        x:STEM_X,

        y:
          STEM_TOP+
          (
            STEM_BOTTOM-
            STEM_TOP
          )*t

      });

    }

    return points;

  }


  const stemPoints=
    stemPath();


  /* =====================================
     ÇİZGİ
  ===================================== */

  function path(
    points,
    color,
    width,
    dash=[]
  ){

    if(points.length<2) return;

    ctx.save();

    ctx.strokeStyle=color;

    ctx.lineWidth=width;

    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.setLineDash(dash);


    ctx.beginPath();

    ctx.moveTo(
      points[0].x,
      points[0].y
    );


    for(let i=1;i<points.length;i++){

      ctx.lineTo(
        points[i].x,
        points[i].y
      );

    }


    ctx.stroke();

    ctx.restore();

  }


  /* =====================================
     GRİ ŞABLON
  ===================================== */

  function guide(){

    /*
       KOYU GRİ DIŞ ÇERÇEVE
    */

    path(
      cPoints,
      "rgba(125,135,145,.58)",
      108
    );


    path(
      stemPoints,
      "rgba(125,135,145,.58)",
      108
    );


    /*
       AÇIK GRİ İÇ KISIM
    */

    path(
      cPoints,
      "rgba(220,225,228,.98)",
      74
    );


    path(
      stemPoints,
      "rgba(220,225,228,.98)",
      74
    );


    /*
       BEYAZ KESİK KILAVUZ
    */

    path(
      cPoints,
      "white",
      8,
      [24,20]
    );


    path(
      stemPoints,
      "white",
      8,
      [24,20]
    );


    update();

  }


  /* =====================================
     NUMARALAR
  ===================================== */

  function numberCircle(
    x,
    y,
    number,
    color
  ){

    ctx.save();


    ctx.shadowColor=
      "rgba(0,0,0,.25)";

    ctx.shadowBlur=12;


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      45,
      0,
      Math.PI*2
    );


    ctx.fillStyle=color;
    ctx.fill();


    ctx.shadowBlur=0;

    ctx.strokeStyle="white";

    ctx.lineWidth=8;

    ctx.stroke();


    ctx.fillStyle="white";

    ctx.font=
      "bold 52px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    ctx.fillText(
      number,
      x,
      y+2
    );


    ctx.restore();

  }


  /* =====================================
     SARI OK
  ===================================== */

  function arrow(
    x,
    y,
    rotation
  ){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(rotation);


    ctx.beginPath();


    ctx.moveTo(
      -38,
      -18
    );

    ctx.lineTo(
      4,
      -18
    );

    ctx.lineTo(
      4,
      -33
    );

    ctx.lineTo(
      45,
      0
    );

    ctx.lineTo(
      4,
      33
    );

    ctx.lineTo(
      4,
      18
    );

    ctx.lineTo(
      -38,
      18
    );


    ctx.closePath();


    ctx.fillStyle="#ffd500";

    ctx.strokeStyle="white";

    ctx.lineWidth=8;


    ctx.stroke();

    ctx.fill();


    ctx.restore();

  }


  /* =====================================
     OKLAR + 1 / 2
  ===================================== */

  function directions(){

    /*
       1 = C HAREKETİ
    */

    numberCircle(
      join.x+18,
      STEM_TOP-60,
      "1",
      "#1677ff"
    );


    /*
       C OKLARI
    */

    arrow(
      555,
      370,
      Math.PI
    );


    arrow(
      305,
      535,
      Math.PI/2
    );


    arrow(
      365,
      785,
      .62
    );


    arrow(
      610,
      850,
      -.35
    );


    /*
       2 = DİK ÇİZGİ
    */

    numberCircle(
      STEM_X+92,
      STEM_BOTTOM,
      "2",
      "#ff2d2d"
    );


    /*
       DÜZ ÇİZGİ OKLARI
    */

    arrow(
      STEM_X,
      520,
      Math.PI/2
    );


    arrow(
      STEM_X,
      705,
      Math.PI/2
    );


    update();

  }


  /* =====================================
     KIRMIZI ANİMASYON

     Her karede baştan yeniden çiziyoruz.
     Böylece çizgi bozulmuyor.
  ===================================== */

  let completedC=false;


  function drawScene(
    activePoints=null,
    activeIsStem=false
  ){

    clearCanvas();

    guide();


    /*
       C DAHA ÖNCE TAMAMLANDIYSA
       KIRMIZI C'Yİ KORU.
    */

    if(completedC){

      path(
        cPoints,
        "#ff3030",
        70
      );

      path(
        cPoints,
        "white",
        8,
        [24,20]
      );

    }


    /*
       AKTİF ÇİZGİ
    */

    if(activePoints){

      path(
        activePoints,
        "#ff3030",
        70
      );

      path(
        activePoints,
        "white",
        8,
        [24,20]
      );

    }


    directions();


    /*
       KALEM NOKTASI
    */

    if(
      activePoints &&
      activePoints.length
    ){

      const p=
        activePoints[
          activePoints.length-1
        ];


      ctx.save();

      ctx.shadowColor="#ffd500";

      ctx.shadowBlur=25;


      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        18,
        0,
        Math.PI*2
      );


      ctx.fillStyle="#fff000";

      ctx.fill();


      ctx.lineWidth=5;

      ctx.strokeStyle="white";

      ctx.stroke();


      ctx.restore();

    }


    update();

  }


  function animate(
    points,
    duration,
    done,
    isStem=false
  ){

    let start=null;


    function frame(time){

      if(start===null){
        start=time;
      }


      const progress=
        Math.min(
          (time-start)/duration,
          1
        );


      const index=
        Math.max(
          1,
          Math.floor(
            progress*
            (points.length-1)
          )
        );


      const partial=
        points.slice(
          0,
          index+1
        );


      drawScene(
        partial,
        isStem
      );


      if(progress<1){

        requestAnimationFrame(
          frame
        );

      }else{

        if(done){
          done();
        }

      }

    }


    requestAnimationFrame(
      frame
    );

  }


  /* =====================================
     1. C ÇİZİMİ
  ===================================== */

  function firstStroke(){

    completedC=false;

    drawScene();


    if(round===1){

      message(
        "1. Önce c çizgisini takip et.",
        "Okları takip ederek yavaşça ilerle."
      );

    }else{

      message(
        "Tekrar yazıyoruz...",
        "Önce c çizgisini bir kez daha izle."
      );

    }


    setTimeout(()=>{

      animate(
        cPoints,
        6500,
        secondStroke
      );

    },1600);

  }


  /* =====================================
     2. DÜZ ÇİZGİ
  ===================================== */

  function secondStroke(){

    completedC=true;

    drawScene();


    message(
      "2. Şimdi düz çizgiyi çiz.",
      "Yukarıdan aşağı doğru ilerle."
    );


    setTimeout(()=>{

      animate(
        stemPoints,
        4000,
        roundFinished,
        true
      );

    },1300);

  }


  /* =====================================
     TUR TAMAMLANDI
  ===================================== */

  function roundFinished(){

    completedC=true;

    drawScene(
      stemPoints,
      true
    );


    if(round===1){

      message(
        "Harika! Bir kez daha.",
        "Küçük a harfini tekrar izleyelim."
      );


      round=2;


      setTimeout(
        firstStroke,
        2300
      );

    }else{

      finish();

    }

  }


  /* =====================================
     SON EKRAN
  ===================================== */

  function finish(){

    message(
      "Harika! Küçük a tamamlandı.",
      "Şimdi kitabında sen dene."
    );


    /*
       NETİ'NİN KAFASI
    */

    netiHead.setAttribute(
      "visible",
      "true"
    );


    netiHead.setAttribute(
      "scale",
      ".05 .05 .05"
    );


    netiHead.setAttribute(
      "animation__head",

      "property:scale;"+
      "from:.05 .05 .05;"+
      "to:1 1 1;"+
      "dur:650;"+
      "easing:easeOutBack"
    );


    /*
       KONUŞMA BALONU
    */

    speech.style.display="block";


    neti.removeAttribute(
      "animation__finish"
    );


    neti.setAttribute(
      "animation__finish",

      "property:scale;"+
      "from:1 1 1;"+
      "to:1.10 1.10 1.10;"+
      "dir:alternate;"+
      "loop:3;"+
      "dur:300;"+
      "easing:easeInOutQuad"
    );

  }


  /* =====================================
     BAŞLAT
  ===================================== */

  function begin(){

    if(started) return;

    if(!targetVisible) return;

    if(!userStarted) return;


    started=true;
    round=1;


    plane.setAttribute(
      "visible",
      "true"
    );


    neti.setAttribute(
      "visible",
      "true"
    );


    neti.setAttribute(
      "scale",
      ".05 .05 .05"
    );


    neti.setAttribute(
      "animation__enter",

      "property:scale;"+
      "from:.05 .05 .05;"+
      "to:1 1 1;"+
      "dur:850;"+
      "easing:easeOutBack"
    );


    setTimeout(
      firstStroke,
      1000
    );

  }


  target.addEventListener(
    "targetFound",
    ()=>{

      targetVisible=true;

      begin();

    }
  );


  target.addEventListener(
    "targetLost",
    ()=>{

      targetVisible=false;

    }
  );


  window.addEventListener(
    "neti-user-start",
    begin
  );

}

});

</script>


<a-scene

mindar-image="
imageTargetSrc: ./targets%202.mind;
filterMinCF:0.0001;
filterBeta:0.01;
"

renderer="
colorManagement:true;
alpha:true;
antialias:true;
"

color-space="sRGB"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false">


<a-assets>

<img
id="netiAsset"
src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
crossorigin="anonymous">

</a-assets>


<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>


<a-entity
mindar-image-target="targetIndex:0"
school-a-writing>


<!-- SOL ÜST NETİ -->
<a-image
id="neti"
src="#netiAsset"
position="-0.43 0.63 0.10"
width=".29"
height=".29"
visible="false"
material="
shader:flat;
transparent:true;
alphaTest:.01;
">
</a-image>


<!-- SAĞDA SONDA ÇIKAN NETİ -->
<a-image
id="netiHead"
src="#netiAsset"
position=".43 -.03 .11"
width=".22"
height=".22"
visible="false"
material="
shader:flat;
transparent:true;
alphaTest:.01;
">
</a-image>


<!-- HARF -->
<a-plane
id="drawPlane"
position="0 .01 .08"
width="1.12"
height="1.12"
visible="false"
material="
src:#drawCanvas;
transparent:true;
shader:flat;
">
</a-plane>


</a-entity>

</a-scene>

</body>
</html>
