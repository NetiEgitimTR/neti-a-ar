<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(255,248,225,.97);
}

#startButton{
  border:none;
  border-radius:25px;
  padding:18px 28px;
  font-size:22px;
  font-weight:bold;
  background:#ff8a3d;
  color:white;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}

#startText{
  margin-top:15px;
  padding:0 30px;
  text-align:center;
  font-size:16px;
  color:#555;
}

#yazmaCanvas{
  display:none;
}
</style>

<script>

let kullaniciBaslatti=false;

window.addEventListener("DOMContentLoaded",()=>{

  const buton=document.querySelector("#startButton");
  const ekran=document.querySelector("#startScreen");

  buton.addEventListener("click",()=>{

    kullaniciBaslatti=true;
    ekran.style.display="none";

    window.dispatchEvent(
      new Event("yazma-baslat")
    );

  });

});


AFRAME.registerComponent("kucuk-a-v6",{

init:function(){

  const target=this.el;

  const canvas=
    document.querySelector("#yazmaCanvas");

  const ctx=
    canvas.getContext("2d");

  const plane=
    document.querySelector("#yazmaPlane");

  const neti=
    document.querySelector("#netiYazma");


  canvas.width=1200;
  canvas.height=1200;


  let hedefVar=false;
  let basladi=false;
  let tekrar=1;

  let raf=null;
  let timers=[];


  /* =========================
     ZAMANLAYICI
  ========================= */

  function bekle(fn,ms){

    const id=setTimeout(fn,ms);

    timers.push(id);

    return id;
  }


  /* =========================
     TEXTURE
  ========================= */

  function guncelle(){

    const mesh=
      plane.getObject3D("mesh");

    if(
      mesh &&
      mesh.material &&
      mesh.material.map
    ){
      mesh.material.map.needsUpdate=true;
    }
  }


  /* =========================
     CANVAS TEMİZLE
  ========================= */

  function temizle(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    guncelle();
  }


  /* =========================
     YÖNERGE KUTUSU
  ========================= */

  function yonerge(
    baslik,
    aciklama
  ){

    ctx.save();

    ctx.fillStyle=
      "rgba(255,255,255,.96)";

    ctx.strokeStyle=
      "#ff9f43";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.roundRect(
      150,
      45,
      900,
      150,
      35
    );

    ctx.fill();
    ctx.stroke();


    ctx.textAlign="center";

    ctx.fillStyle="#333";

    ctx.font=
      "bold 48px Arial";

    ctx.fillText(
      baslik,
      600,
      105
    );


    ctx.fillStyle="#666";

    ctx.font=
      "bold 31px Arial";

    ctx.fillText(
      aciklama,
      600,
      157
    );

    ctx.restore();

    guncelle();
  }


  /* =========================
     KÜÇÜK a GEOMETRİSİ

     c'nin üst ucu ile
     düz çizginin üstü
     aynı noktada birleşiyor.
  ========================= */

  const C_START={
    x:760,
    y:420
  };

  const C_END={
    x:760,
    y:790
  };

  const STEM_TOP={
    x:760,
    y:420
  };

  const STEM_BOTTOM={
    x:760,
    y:810
  };


  function bezier(
    p0,p1,p2,n
  ){

    const sonuc=[];

    for(let i=0;i<=n;i++){

      const t=i/n;
      const m=1-t;

      sonuc.push({

        x:
          m*m*p0.x+
          2*m*t*p1.x+
          t*t*p2.x,

        y:
          m*m*p0.y+
          2*m*t*p1.y+
          t*t*p2.y

      });

    }

    return sonuc;
  }


  function cYolu(){

    const yol=[];

    /*
      SAĞ ÜSTTEN BAŞLA
      SOLA VE AŞAĞI DÖN
      SAĞ ALTTA BİTİR
    */

    yol.push(
      ...bezier(
        {x:760,y:420},
        {x:670,y:320},
        {x:555,y:320},
        40
      )
    );

    yol.push(
      ...bezier(
        {x:555,y:320},
        {x:350,y:320},
        {x:350,y:570},
        55
      )
    );

    yol.push(
      ...bezier(
        {x:350,y:570},
        {x:350,y:825},
        {x:560,y:825},
        55
      )
    );

    yol.push(
      ...bezier(
        {x:560,y:825},
        {x:685,y:825},
        {x:760,y:790},
        35
      )
    );

    return yol;
  }


  function duzYolu(){

    const yol=[];

    const adet=80;

    for(let i=0;i<=adet;i++){

      const t=i/adet;

      yol.push({

        x:760,

        y:
          420+
          (810-420)*t

      });

    }

    return yol;
  }


  /* =========================
     GRİ KILAVUZ a
  ========================= */

  function kilavuzCiz(){

    const c=cYolu();
    const d=duzYolu();

    ctx.save();

    ctx.strokeStyle=
      "rgba(90,90,90,.40)";

    ctx.lineWidth=52;

    ctx.lineCap="round";
    ctx.lineJoin="round";


    ctx.beginPath();

    ctx.moveTo(
      c[0].x,
      c[0].y
    );

    for(let i=1;i<c.length;i++){

      ctx.lineTo(
        c[i].x,
        c[i].y
      );

    }

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
      d[0].x,
      d[0].y
    );

    for(let i=1;i<d.length;i++){

      ctx.lineTo(
        d[i].x,
        d[i].y
      );

    }

    ctx.stroke();

    ctx.restore();

    guncelle();
  }


  /* =========================
     OK
  ========================= */

  function ok(
    x1,y1,
    x2,y2
  ){

    const aci=
      Math.atan2(
        y2-y1,
        x2-x1
      );

    const boy=28;

    ctx.save();

    ctx.strokeStyle="#ffd400";
    ctx.fillStyle="#ffd400";

    ctx.lineWidth=13;
    ctx.lineCap="round";


    ctx.beginPath();

    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(x2,y2);

    ctx.lineTo(
      x2-boy*Math.cos(
        aci-Math.PI/6
      ),
      y2-boy*Math.sin(
        aci-Math.PI/6
      )
    );

    ctx.lineTo(
      x2-boy*Math.cos(
        aci+Math.PI/6
      ),
      y2-boy*Math.sin(
        aci+Math.PI/6
      )
    );

    ctx.closePath();
    ctx.fill();

    ctx.restore();

  }


  /* =========================
     1 VE 2 NUMARALARI
  ========================= */

  function numara(
    x,y,sayi
  ){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      34,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#29a9ff";
    ctx.fill();

    ctx.lineWidth=5;
    ctx.strokeStyle="white";
    ctx.stroke();


    ctx.fillStyle="white";

    ctx.font=
      "bold 38px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      sayi,
      x,
      y+2
    );

    ctx.restore();

  }


  /* =========================
     C OKLARI
  ========================= */

  function cOklari(){

    /*
      Oklar kırmızı çizginin
      hemen DIŞINDA.
    */

    ok(
      700,280,
      585,255
    );

    ok(
      285,400,
      270,525
    );

    ok(
      390,885,
      520,900
    );

    ok(
      635,890,
      720,825
    );

    numara(
      820,
      355,
      "1"
    );

    guncelle();
  }


  /* =========================
     DÜZ ÇİZGİ OKLARI
  ========================= */

  function duzOklari(){

    ok(
      850,475,
      850,590
    );

    ok(
      850,640,
      850,755
    );

    numara(
      820,
      355,
      "2"
    );

    guncelle();
  }


  /* =========================
     ÇİZGİ ANİMASYONU
  ========================= */

  function animasyonCiz(
    noktalar,
    sure,
    bitince
  ){

    let start=null;
    let son=0;


    function frame(zaman){

      if(start===null){
        start=zaman;
      }

      const oran=
        Math.min(
          (zaman-start)/sure,
          1
        );

      const hedef=
        Math.min(
          noktalar.length-1,
          Math.floor(
            oran*
            (noktalar.length-1)
          )
        );


      ctx.save();

      ctx.strokeStyle="#ff3b30";

      ctx.lineWidth=45;

      ctx.lineCap="round";
      ctx.lineJoin="round";


      while(son<hedef){

        ctx.beginPath();

        ctx.moveTo(
          noktalar[son].x,
          noktalar[son].y
        );

        ctx.lineTo(
          noktalar[son+1].x,
          noktalar[son+1].y
        );

        ctx.stroke();

        son++;

      }

      ctx.restore();


      /*
        KALEM UCUNDA SARI NOKTA
      */

      const p=
        noktalar[hedef];

      ctx.save();

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        13,
        0,
        Math.PI*2
      );

      ctx.fillStyle="#ffd400";
      ctx.fill();

      ctx.lineWidth=4;
      ctx.strokeStyle="white";
      ctx.stroke();

      ctx.restore();


      guncelle();


      if(oran<1){

        raf=
          requestAnimationFrame(
            frame
          );

      }else{

        raf=null;

        if(bitince){
          bitince();
        }

      }

    }


    raf=
      requestAnimationFrame(
        frame
      );

  }


  /* =========================
     1. ADIM
  ========================= */

  function birinciAdim(){

    temizle();

    kilavuzCiz();


    if(tekrar===1){

      yonerge(
        "1. Önce c çizgisini takip et.",
        "Oku takip ederek yavaşça ilerle."
      );

    }else{

      yonerge(
        "Bir kez daha deneyelim!",
        "Önce c çizgisini tekrar izleyelim."
      );

    }


    cOklari();


    /*
      ÇOCUK ÖNCE KILAVUZU
      VE OKLARI GÖRSÜN
    */

    bekle(
      ()=>{
        animasyonCiz(
          cYolu(),
          5500,
          ikinciAdimHazirlik
        );
      },
      1600
    );

  }


  /* =========================
     2. ADIM
  ========================= */

  function ikinciAdimHazirlik(){

    /*
      KIRMIZI C SİLİNMİYOR.
    */

    yonerge(
      "2. Şimdi düz çizgiyi çiz.",
      "Yukarıdan aşağı doğru ilerle."
    );

    duzOklari();


    bekle(
      ()=>{
        animasyonCiz(
          duzYolu(),
          3300,
          harfTamam
        );
      },
      1400
    );

  }


  /* =========================
     HARF TAMAMLANDI
  ========================= */

  function harfTamam(){

    if(tekrar===1){

      yonerge(
        "Harika! Küçük a tamamlandı.",
        "Şimdi bir kez daha izleyelim."
      );


      neti.removeAttribute(
        "animation__tebrik"
      );

      neti.setAttribute(
        "animation__tebrik",
        "property: scale;"+
        "from: 1 1 1;"+
        "to: 1.10 1.10 1.10;"+
        "dir: alternate;"+
        "loop: 2;"+
        "dur: 300;"+
        "easing: easeInOutQuad"
      );


      tekrar=2;

      bekle(
        birinciAdim,
        2200
      );

    }else{

      sonEkran();

    }

  }


  /* =========================
     SON
  ========================= */

  function sonEkran(){

    yonerge(
      "Harika! Şimdi sıra sende! ✏️",
      "Kitabındaki küçük a harflerini yaz."
    );


    neti.removeAttribute(
      "animation__tebrik"
    );

    neti.setAttribute(
      "animation__tebrik",
      "property: scale;"+
      "from: 1 1 1;"+
      "to: 1.13 1.13 1.13;"+
      "dir: alternate;"+
      "loop: 3;"+
      "dur: 320;"+
      "easing: easeInOutQuad"
    );

  }


  /* =========================
     BAŞLAT
  ========================= */

  function baslat(){

    if(basladi) return;
    if(!hedefVar) return;
    if(!kullaniciBaslatti) return;

    basladi=true;
    tekrar=1;

    temizle();


    plane.setAttribute(
      "visible",
      "true"
    );


    neti.setAttribute(
      "visible",
      "true"
    );

    neti.setAttribute(
      "scale",
      ".05 .05 .05"
    );

    neti.setAttribute(
      "position",
      "-0.40 0.60 0.06"
    );


    neti.setAttribute(
      "animation__buyume",
      "property: scale;"+
      "from: .05 .05 .05;"+
      "to: 1 1 1;"+
      "dur: 900;"+
      "easing: easeOutBack"
    );


    neti.setAttribute(
      "animation__yuksel",
      "property: position;"+
      "from: -0.40 0.42 0.06;"+
      "to: -0.40 0.60 0.06;"+
      "dur: 900;"+
      "easing: easeOutQuad"
    );


    bekle(
      birinciAdim,
      1200
    );

  }


  target.addEventListener(
    "targetFound",
    ()=>{

      hedefVar=true;
      baslat();

    }
  );


  target.addEventListener(
    "targetLost",
    ()=>{

      hedefVar=false;

    }
  );


  window.addEventListener(
    "yazma-baslat",
    baslat
  );

}

});

</script>
</head>

<body>


<div id="startScreen">

<button id="startButton">
✏️ Neti ile küçük a yazalım
</button>

<div id="startText">
Dokun ve yazma sayfasını kameraya göster.
</div>

</div>


<canvas id="yazmaCanvas"></canvas>


<a-scene

mindar-image="
imageTargetSrc: ./targets%202.mind;
filterMinCF: 0.0001;
filterBeta: 0.01;
"

color-space="sRGB"

renderer="
colorManagement: true;
alpha: true;
antialias: true;
"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="
enabled: false;
">


<a-assets>

<img
id="netiAsset"
src="./72509361-9673-4AB6-8739-B7646C5522E4.png"
crossorigin="anonymous">

</a-assets>


<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>


<a-entity
mindar-image-target="targetIndex: 0"
kucuk-a-v6>


<a-image
id="netiYazma"
src="#netiAsset"
position="-0.40 0.60 0.06"
width="0.30"
height="0.30"
visible="false"
material="
shader:flat;
transparent:true;
alphaTest:.01;
">
</a-image>


<a-plane
id="yazmaPlane"
position="0 0.02 0.08"
width="1.15"
height="1.15"
visible="false"
material="
src:#yazmaCanvas;
transparent:true;
shader:flat;
">
</a-plane>


</a-entity>

</a-scene>

</body>
</html>
